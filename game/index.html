<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cubeforge</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#gl{width:100%;height:100%;display:block;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>window.__ATLAS_B64=null;window.__TEXMETA={};</script>
<script>
/* ==== src/registry.js ==== */
// Registry: block metadata, the parity source of truth. The JSON literal between the
// markers is parsed by tools/parity.mjs from the BUILT artifact — keep it strict JSON.
window.CF = window.CF || {};
window.CF.REGISTRY = /*REGISTRY-START*/
{
}/*REGISTRY-END*/;

/* ==== src/game.js ==== */
// Cubeforge boot: WebGL2 canvas + fixed 20 UPS tick loop.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  CF.errors = [];
  CF.ticks = 0;
  CF.ready = false;
  const origErr = console.error;
  console.error = function () { CF.errors.push(Array.from(arguments).map(String).join(' ')); origErr.apply(console, arguments); };
  window.addEventListener('error', (e) => CF.errors.push(String(e.message)));

  function init() {
    const canvas = document.getElementById('gl');
    const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
    if (!gl) { CF.errors.push('WebGL2 unavailable'); document.title = 'FATAL: no webgl2'; return; }
    CF.gl = gl; CF.canvas = canvas;
    function resize() {
      const w = canvas.clientWidth * devicePixelRatio, h = canvas.clientHeight * devicePixelRatio;
      if (canvas.width !== w | 0 || canvas.height !== h | 0) { canvas.width = w | 0; canvas.height = h | 0; }
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    CF.resize = resize;
    window.addEventListener('resize', resize);
    resize();
    gl.clearColor(0.6, 0.75, 1.0, 1); // sky placeholder until SPK-1 sky pass
    CF.ready = true;
    // Fixed-timestep SIM on setInterval (deterministic, works in headless virtual time);
    // RENDER on rAF. Sim never depends on rAF firing.
    setInterval(() => { CF.onTick && CF.onTick(); CF.ticks++; }, 50);
    function frame() {
      gl.clearColor(0.6, 0.75, 1.0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      CF.onDraw && CF.onDraw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

/* ==== src/harness.js ==== */
// Test + shot harness. Hash-routed: #test, #shot=NAME.
// Results go to document.title as TESTRESULT:{encodeURIComponent(JSON)} for tools/test.mjs.
(function () {
  const CF = window.CF;
  function report(result) {
    document.title = 'TESTRESULT:' + encodeURIComponent(JSON.stringify(result));
  }
  CF.assert = (results, name, cond) => { (cond ? results.pass : results.fail).push(name); };

  async function runTests() {
    const r = { mode: 'test', pass: [], fail: [], errors: [], ticks: 0, registry: null };
    try {
      for (let i = 0; i < 200 && !CF.ready; i++) await new Promise((res) => setTimeout(res, 50));
      CF.assert(r, 'boot.ready', CF.ready);
      CF.assert(r, 'gl.webgl2', !!(CF.gl && CF.gl.getParameter && /WebGL 2/.test(CF.gl.getParameter(CF.gl.VERSION))));
      const t0 = CF.ticks;
      await new Promise((res) => setTimeout(res, 600));
      CF.assert(r, 'loop.ticks', CF.ticks > t0 + 5);
      CF.assert(r, 'registry.json', typeof CF.REGISTRY === 'object' && CF.REGISTRY !== null);
      if (typeof CF.worldTests === 'function') await CF.worldTests(r);
      if (typeof CF.playerTests === 'function') await CF.playerTests(r);
    } catch (e) {
      r.fail.push('harness.threw: ' + e.message);
    }
    r.errors = CF.errors.slice(0, 20);
    r.ticks = CF.ticks;
    r.registry = Object.keys(CF.REGISTRY || {}).length;
    report(r);
  }

  async function runShot(name) {
    CF.shotName = name;
    for (let i = 0; i < 200 && !CF.ready; i++) await new Promise((res) => setTimeout(res, 50));
    CF.shotDone = false;
    try {
      if (typeof CF.shotScenarios === 'object' && CF.shotScenarios[name]) await CF.shotScenarios[name]();
    } catch (e) { CF.errors.push('shot:' + name + ' ' + e.message); }
    setTimeout(() => { CF.shotDone = true; }, 2500);
  }

  CF.shotScenarios = {};

  const h = location.hash || '';
  if (h === '#test') runTests();
  else if (h.startsWith('#shot=')) runShot(h.slice(6));
})();

</script>
</body>
</html>
