      arr[j++] = m.col[i * 4]; arr[j++] = m.col[i * 4 + 1]; arr[j++] = m.col[i * 4 + 2]; arr[j++] = m.col[i * 4 + 3];
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, e.vb);
    gl.bufferData(gl.ARRAY_BUFFER, arr.length ? arr : new Float32Array(7), gl.STATIC_DRAW);
    e.n = arr.length / 7;
    const warr = new Float32Array(m.wpos.length + m.wcol.length);
    for (let i = 0, j = 0; i < m.wpos.length / 3; i++) {
      warr[j++] = m.wpos[i * 3]; warr[j++] = m.wpos[i * 3 + 1]; warr[j++] = m.wpos[i * 3 + 2];
      warr[j++] = m.wcol[i * 4]; warr[j++] = m.wcol[i * 4 + 1]; warr[j++] = m.wcol[i * 4 + 2]; warr[j++] = m.wcol[i * 4 + 3];
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, e.wvb);
    gl.bufferData(gl.ARRAY_BUFFER, warr.length ? warr : new Float32Array(7), gl.STATIC_DRAW);
    e.wn = warr.length / 7;
    stats.lastBuf = Array.from(arr.slice(0, 12));
  }

  function renderTick() {
    const W = CF.world;
    stats.ready = texReady;
    if (!W) return;
    let budget = 2;
    for (const k of W.dirty) {
      if (budget-- <= 0) break;
      W.dirty.delete(k);
      const [cx, cz] = k.split(',').map(Number);
      W.ensureLight(cx, cz);
      upload(cx, cz, buildMesh(cx, cz));
      stats.rebuilds++;
    }
    // progressive initial pass: mesh all existing chunks not yet mapped
    if (W.chunks.size) {
      let b2 = 2;
      for (const [k] of W.chunks) {
        if (b2 <= 0) break;
        if (meshMap.has(k)) continue;
        b2--;
        const [cx, cz] = k.split(',').map(Number);
        W.ensureLight(cx, cz);
        upload(cx, cz, buildMesh(cx, cz));
        stats.rebuilds++; stats.meshes++;
      }
    }
  }

  function persp(f, a, n, z) { const t = 1 / Math.tan(f / 2); return [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (z + n) / (n - z), 2 * z * n / (n - z), 0, 0, -1, 0]; }
  function view(e, yaw, pitch) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const f = [sy * cp, sp, cy * cp], r = [cy, 0, -sy];
    const u = [f[1] * r[2] - f[2] * r[1], f[2] * r[0] - f[0] * r[2], f[0] * r[1] - f[1] * r[0]];
    const d = (a) => -(a[0] * e[0] + a[1] * e[1] + a[2] * e[2]);
    const rn = [-f[0], -f[1], -f[2]];
    return [r[0], r[1], r[2], d(r), u[0], u[1], u[2], d(u), rn[0], rn[1], rn[2], d(rn), 0, 0, 0, 1];
  }
  function mm(a, b) { const o = new Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[i * 4 + k] * b[k * 4 + j]; o[i * 4 + j] = s; } return o; }
  const tr = (m) => [m[0], m[4], m[8], m[12], m[1], m[5], m[9], m[13], m[2], m[6], m[10], m[14], m[3], m[7], m[11], m[15]];

  function draw(cam) {
    if (!gl || !texReady) return;
    const c = CF.canvas;
    if (CF.shake > 0) cam = { pos: [cam.pos[0] + (Math.random() - 0.5) * 0.12 * CF.shake / 18, cam.pos[1] + (Math.random() - 0.5) * 0.1 * CF.shake / 18, cam.pos[2] + (Math.random() - 0.5) * 0.12 * CF.shake / 18], yaw: cam.yaw, pitch: cam.pitch }; // #037/#042 blast shake
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.useProgram(prog);
    gl.uniform1i(uTloc, 0);
    gl.viewport(0, 0, c.width, c.height);
    const dayF = CF.dayFactor ? CF.dayFactor() : 1;
    const skyDay = [0.6, 0.75, 1.0], skyNight = [0.02, 0.03, 0.07];
    const mixv = (i) => skyNight[i] + (skyDay[i] - skyNight[i]) * dayF;
    let sky = [mixv(0), mixv(1), mixv(2)];
    if (CF.raining && CF.raining()) { // #041 overcast (thunder = gloomier)
      const k = CF.weather.thunder ? 0.28 : 0.45, g = CF.weather.thunder ? 0.24 : 0.3;
      sky = sky.map((v, i) => v * k + [0.28, 0.3, 0.34][i] * g);
    }
    if (CF.lightFlash > 0) sky = [0.9, 0.92, 1]; // lightning frames the world white
    gl.clearColor(sky[0], sky[1], sky[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(prog);
    const VP = tr(mm(persp(70 * Math.PI / 180, c.width / c.height, 0.1, 300), view(cam.pos, cam.yaw, cam.pitch)));
    gl.uniformMatrix4fv(uVP, false, new Float32Array(VP));
    gl.uniform3f(uFog, sky[0], sky[1], sky[2]);
    gl.uniform1f(gl.getUniformLocation(prog, 'uDay'), Math.max(dayF, 0.25));
    gl.uniform3fv(gl.getUniformLocation(prog, 'E'), new Float32Array(cam.pos));
    let tris = 0, drawn = 0;
    for (const [, e] of meshMap) {
      if (!e.n) continue;
      gl.bindVertexArray(e.vao);
      gl.drawArrays(gl.TRIANGLES, 0, e.n);
      tris += e.n / 3; drawn++;
    }
    // #035 mob boxes: opaque, depth-tested, same shader via palette on unit 1 (dynamic VBO each frame)
    stats.mtris = 0; stats.mobCount = CF.mobs ? CF.mobs.list.length : 0;
    if (CF.buildMobVerts) {
      const mv = CF.buildMobVerts(cam);
      if (mv && mv.length) {
        gl.depthMask(true); gl.disable(gl.BLEND);
        gl.bindBuffer(gl.ARRAY_BUFFER, mobVB);
        gl.bufferData(gl.ARRAY_BUFFER, mv, gl.STREAM_DRAW);
        gl.bindVertexArray(mobVAO);
        gl.uniform1i(uTloc, 1);
        gl.drawArrays(gl.TRIANGLES, 0, mv.length / 7);
        gl.uniform1i(uTloc, 0);
        gl.bindVertexArray(null);
        stats.mtris = mv.length / 21;
      }
    }
    // translucent liquid pass (no depth write) (#022) - premultiplied blending
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(true); // #043: WRITE depth so a nearer liquid face occludes farther ones -> no double-blend banding (was depthMask(false))
    let wtris = 0;
    for (const [, e] of meshMap) {
      if (!e.wn) continue;
      gl.bindVertexArray(e.wvao);
      gl.drawArrays(gl.TRIANGLES, 0, e.wn);
      wtris += e.wn / 3;
    }
    stats.wtris = wtris;
    gl.depthMask(true);
    gl.disable(gl.BLEND);
    stats.tris = tris; stats.drawn = drawn; stats.mapped = meshMap.size;
    stats.glErr = gl.getError();
  }

  CF.initRenderer = initRenderer;
  CF.renderTick = renderTick;
  CF.renderDraw = draw;
  CF.readCenter = () => {
    if (!gl) return [0, 0, 0];
    const q = new Uint8Array(4);
    gl.readPixels((CF.canvas.width / 2) | 0, (CF.canvas.height / 2) | 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, q);
    return [q[0], q[1], q[2]];
  };
  CF.renderReset = () => {
    if (!gl) { meshMap.clear(); return; }
    for (const [, e] of meshMap) { gl.deleteBuffer(e.vb); gl.deleteVertexArray(e.vao); gl.deleteBuffer(e.wvb); gl.deleteVertexArray(e.wvao); }
    meshMap.clear();
    stats.meshes = 0; stats.tris = 0; stats.rebuilds = 0; stats.mtris = 0;
  };

  CF.rendererTests = async (r) => {
    const t0 = performance.now();
    CF.world.ensureAround(0, 0, 4);
    for (let i = 0; i < 40 && CF.world.stats().queue; i++) CF.world.tick();
    for (let i = 0; i < 100 && (!stats.ready || meshMap.size < CF.world.chunks.size - 2); i++) {
      CF.renderTick(); await new Promise((res) => setTimeout(res, 50));
    }
    stats.meshAllMs = +(performance.now() - t0).toFixed(0);
    CF.renderDraw({ pos: [0, CF.world.heightAt(0, 0) + 12, 0], yaw: 0.6, pitch: -1.4 });
    CF.assert(r, 'render.mesh-all(' + stats.meshAllMs + 'ms)', stats.meshAllMs < 6000);
    const rp = new Uint8Array(4);
    gl.readPixels(Math.max(1, (CF.canvas.width / 2) | 0), Math.max(1, (CF.canvas.height / 2) | 0), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, rp);
    stats.px = [rp[0], rp[1], rp[2]];
    CF.assert(r, 'render.px(' + stats.px + ')', rp[0] + rp[1] + rp[2] < 500);
    // #021: same camera, night vs day pixel luminance
    const cam = { pos: [0, CF.world.heightAt(0, 0) + 12, 0], yaw: 0.6, pitch: -1.4 };
    const lum = () => { CF.renderDraw(cam); const q = new Uint8Array(4); gl.readPixels((CF.canvas.width / 2) | 0, (CF.canvas.height / 2) | 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, q); return q[0] + q[1] + q[2]; };
    CF.timeOffset = 0; const dayL = lum();
    CF.timeOffset = 18000; const nightL = lum();
    CF.timeOffset = 0; CF.renderDraw(cam);
    CF.assert(r, 'time.pixel-night(' + nightL + '<' + dayL + ')', nightL < dayL * 0.6 && dayL > 100);
    stats.mapped = meshMap.size;
    CF.assert(r, 'render.atlas', stats.ready === true);
    CF.assert(r, 'render.merged(' + stats.mapped + '/' + CF.world.chunks.size + ')', stats.mapped >= CF.world.chunks.size - 2);
    CF.assert(r, 'render.tris(' + stats.tris + ',rebuilds=' + stats.rebuilds + ')', stats.tris > 1000);
    CF.assert(r, 'render.glErr', stats.glErr === 0);
    CF.assert(r, 'render.no-missing-tiles', stats.missingTiles.size === 0);
    const before = stats.rebuilds;
    CF.world.set(3, 40, 3, CF.IDOF['stone']);
    CF.renderTick(); CF.renderTick();
    CF.assert(r, 'render.dirty-fast', stats.rebuilds >= before + 1);
    // #046: back (-X/-Z) faces must mesh - mesher used to emit only +axis faces, so a block viewed
    // from the opposite corner was a hole. Deterministic sky platform (vegetation can never occlude).
    {
      const W = CF.world, px0 = 96, rx = 44, rz = 100;
      W.ensureAround(rx, rz, 1);
      for (let i = 0; i < 30 && W.stats().queue; i++) W.tick();
      for (let x = rx - 4; x <= rx + 4; x++) for (let z = rz - 4; z <= rz + 4; z++) { W.set(x, px0, z, CF.IDOF['stone']); for (let y = px0 + 1; y <= px0 + 6; y++) W.set(x, y, z, 0); }
      W.ensureLight(rx >> 4, rz >> 4); for (let i = 0; i < 8; i++) W.tick();
      const drain = () => { for (let i = 0; i < 300 && W.dirty.size; i++) CF.renderTick(); };
      const shot = (id) => {
        W.set(rx, px0 + 1, rz, id); drain();
        CF.renderDraw({ pos: [rx - 1.4, px0 + 2.4, rz - 1.4], yaw: Math.atan2(1.9, 1.9), pitch: -0.32 });
        const q = new Uint8Array(4); gl.readPixels((CF.canvas.width / 2) | 0, (CF.canvas.height / 2) | 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, q);
        return [q[0], q[1], q[2], stats.tris];
      };
      const e0 = shot(0), e1 = shot(CF.IDOF['log']);
      shot(0);
      const d = Math.abs(e0[0] - e1[0]) + Math.abs(e0[1] - e1[1]) + Math.abs(e0[2] - e1[2]);
      CF.assert(r, 'render.face-back(' + d + ',t0=' + e0[3] + ',t1=' + e1[3] + ',b=' + e1.slice(0, 3) + ')', d > 40);
    }
  };
})();

// Player: 1.12.2 AABB physics (0.6x1.8, eye 1.62), gravity, walk/sprint/sneak/jump/step-up.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const HW = 0.3, HH = 0.9, EYE = 1.62;
  const GRAV = 32, JUMP = 8.94, WALK = 4.317, SPRINT = 5.6, SNEAK = 1.3;

  const player = {
    pos: [8.5, 80, 8.5], vel: [0, 0, 0], yaw: Math.PI / 4, pitch: -0.2,
    onGround: false, input: { f: 0, s: 0, l: 0, r: 0, jump: false, sneak: false, sprint: false },
    tp(x, y, z) { this.pos = [x, y, z]; this.vel = [0, 0, 0]; },
  };
  CF.player = player;

  const solid = (x, y, z) => CF.solidAt(CF.world.get(Math.floor(x), Math.floor(y), Math.floor(z)));
  function boxHits(px, py, pz) {
    for (let x = Math.floor(px - HW); x <= Math.floor(px + HW); x++)
      for (let y = Math.floor(py - HH + 0.001); y <= Math.floor(py + HH - 0.001); y++)
        for (let z = Math.floor(pz - HW); z <= Math.floor(pz + HW); z++)
          if (solid(x, y, z)) return true;
    return false;
  }

  const keys = {};
  window.addEventListener('keydown', (e) => { keys[e.code] = true; if (['Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) e.preventDefault(); });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  function readInput() {
    const i = player.input;
    if (i.scripted) return;
    i.f = keys['KeyW'] ? 1 : 0; i.s = keys['KeyS'] ? 1 : 0;
    i.l = keys['KeyA'] ? 1 : 0; i.r = keys['KeyD'] ? 1 : 0;
    i.jump = !!keys['Space']; i.sneak = !!keys['ShiftLeft']; i.sprint = !!keys['ControlLeft'];
  }

  function tick(dt = 0.05) {
    if (!CF.world) return;
    player.prevPos = player.pos.slice(); // #047: interpolation source for rAF rendering
    readInput();
    const i = player.input;
    const speed = (i.sprint && (!CF.canSprint || CF.canSprint())) ? SPRINT : i.sneak ? SNEAK : WALK;
    const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw);
    let mx = fx * (i.f - i.s) + Math.cos(player.yaw) * (i.r - i.l);
    let mz = fz * (i.f - i.s) - Math.sin(player.yaw) * (i.r - i.l);
    const ml = Math.hypot(mx, mz);
    if (ml > 0) { mx = mx / ml * speed; mz = mz / ml * speed; }
    player.vel[0] = mx; player.vel[2] = mz;
    player.vel[1] -= GRAV * dt;
    if (i.jump && player.onGround) { player.vel[1] = JUMP; player.onGround = false; }

    const [p0, p1, p2] = player.pos;
    let [x, y, z] = player.pos;
    // per-axis sweep
    let nx = x + player.vel[0] * dt;
    if (boxHits(nx, y, z)) {
      const stepY = y + 0.6;
      if (player.onGround && !boxHits(nx, stepY, z)) { y = stepY; nx = x + player.vel[0] * dt * 0.75; }
      else nx = x;
    }
    x = nx;
    let nz = z + player.vel[2] * dt;
    if (boxHits(x, y, nz)) {
      const stepY = y + 0.6;
      if (player.onGround && !boxHits(x, stepY, nz)) { y = stepY; nz = z + player.vel[2] * dt * 0.75; }
      else nz = z;
    }
    z = nz;
    let ny = y + player.vel[1] * dt;
    player.onGround = false;
    if (boxHits(x, ny, z)) {
      if (player.vel[1] < 0) {
        player.onGround = true;
        ny = Math.floor(ny - HH) + 1 + HH; // #046: rest on the penetrated surface (stale-y snap ratcheted +1/tick = the reported bounce)
        for (let g = 0; g < 8 && boxHits(x, ny, z); g++) ny += 1; // fast falls penetrate several cells - push up until free
      }
      else ny = Math.ceil(y + HH) - 1 - HH - 0.001;
      player.vel[1] = 0;
    }
    y = ny;
    // #046: removed the old "hop noise" snap `y = Math.round((y - HH) * 1000) / 1000` -
    // with a correct landing snap it overwrote CENTER y with feet-y, burying the player.
    player.pos = [x, y, z];
    if (y < -20) player.tp(8.5, CF.world.heightAt(8, 8) + 2, 8.5); // void rescue

    if (!CF.freeCam) CF.camera = { pos: [x, y - HH + EYE, z], yaw: player.yaw, pitch: player.pitch };
  }
  player.tick = tick;
  CF.playerTick = tick;

  // Mouse look with pointer lock (real play; harness uses scripted input/yaw directly).
  document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement) {
      player.yaw += e.movementX * 0.0026;
      player.pitch = Math.max(-1.55, Math.min(1.55, player.pitch - e.movementY * 0.0026));
    }
  });
  document.addEventListener('click', () => { if (CF.canvas && CF.canvas.requestPointerLock) CF.canvas.requestPointerLock(); });

  CF.playerTests = async (r) => {
    const P = CF.player;
    const h = CF.world.heightAt(8, 8);
    P.tp(8.5, h + 10, 8.5);
    P.input.scripted = true;
    P.input.f = P.input.l = P.input.r = 0; P.input.jump = false;
    for (let i = 0; i < 40; i++) tick();
    CF.assert(r, 'player.land', P.onGround && P.pos[1] > h - 1 && P.pos[1] < h + 3);
    const y0 = P.pos[1], x0 = P.pos[0], z0 = P.pos[2];
    P.input.f = 1;
    for (let i = 0; i < 60; i++) tick();
    P.input.f = 0;
    const dist = Math.hypot(P.pos[0] - x0, P.pos[2] - z0);
    CF.assert(r, 'player.move(' + dist.toFixed(1) + ')', dist > 2);
    CF.assert(r, 'player.no-sink', P.pos[1] > h - 1 && P.onGround);
    P.tp(8.5, h + 12, 8.5);
    for (let i = 0; i < 80; i++) tick();
    const hAt = CF.world.heightAt(Math.floor(P.pos[0]), Math.floor(P.pos[2]));
    CF.assert(r, 'player.gravity-fall', P.onGround && P.pos[1] >= hAt);
    CF.assert(r, 'player.camera', !!CF.camera && Math.abs(CF.camera.pos[1] - (P.pos[1] - 0.9 + 1.62)) < 0.5);
    // #018: horizontal wall blocking — build a cobble wall, walk into it, must not pass
    const wx = Math.floor(P.pos[0]) + 2, wz = Math.floor(P.pos[2]);
    const wy = Math.floor(P.pos[1] - 0.9);
    CF.world.ensureAround(wx, wz, 1);
    for (let i = 0; i < 10 && CF.world.stats().queue; i++) CF.world.tick();
    for (let yy = wy; yy <= wy + 2; yy++) for (let dz = -2; dz <= 2; dz++) CF.world.set(wx, yy, wz + dz, CF.IDOF['cobblestone']);
    P.yaw = 0; // face +Z? wall is +X away -> face +X:
    P.yaw = Math.PI / 2;
    P.input.f = 1;
    const xBefore = P.pos[0];
    for (let i = 0; i < 60; i++) tick();
    P.input.f = 0;
    CF.assert(r, 'player.wall-block(' + (P.pos[0] - xBefore).toFixed(2) + ')', P.pos[0] < wx - 0.25 && P.pos[0] > xBefore - 0.01);
    for (let yy = wy; yy <= wy + 2; yy++) for (let dz = -2; dz <= 2; dz++) CF.world.set(wx, yy, wz + dz, 0);
  };
})();

// Interaction: DDA raycast, hold-to-break with 1.12 break-time formula + tier gate,
// place with player-overlap rule, hotbar selection, drops queue.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const HAND_TIER = 0, HAND_SPEED = 1; // tool system comes later; hand for now

  CF.hotbar = ['grass', 'dirt', 'stone', 'cobblestone', 'planks', 'log', 'leaves', 'glowstone', 'glass'];
  CF.sel = 0;
  CF.drops = [];

  CF.hotId = () => {
    const h = CF.held && CF.held();
    if (!h) return 0;
    const reg = CF.REGISTRY[h];
    if (!reg) return 0;
    const k = Object.keys(reg.variants)[0];
    return reg.variants[k].id;
  };

  function raycast(o, d, maxD) {
    let x = Math.floor(o[0]), y = Math.floor(o[1]), z = Math.floor(o[2]);
    const sx = d[0] > 0 ? 1 : -1, sy = d[1] > 0 ? 1 : -1, sz = d[2] > 0 ? 1 : -1;
    const dx = Math.abs(1 / (d[0] || 1e-9)), dy = Math.abs(1 / (d[1] || 1e-9)), dz = Math.abs(1 / (d[2] || 1e-9));
    let tx = ((sx > 0 ? x + 1 - o[0] : o[0] - x)) * dx;
    let ty = ((sy > 0 ? y + 1 - o[1] : o[1] - y)) * dy;
    let tz = ((sz > 0 ? z + 1 - o[2] : o[2] - z)) * dz;
    let t = 0, face = [0, 0, 0];
    for (let i = 0; i < 120; i++) {
      if (CF.solidAt(CF.world.get(x, y, z))) return { x, y, z, face };
      if (tx < ty && tx < tz) { x += sx; t = tx; tx += dx; face = [-sx, 0, 0]; }
      else if (ty < tz) { y += sy; t = ty; ty += dy; face = [0, -sy, 0]; }
      else { z += sz; t = tz; tz += dz; face = [0, 0, -sz]; }
      if (t > maxD) return null;
    }
    return null;
  }
  CF.raycast = raycast;

  CF.aim = () => {
    const p = CF.player;
    if (!p) return null;
    const cy = Math.cos(p.yaw), sy = Math.sin(p.yaw), cp = Math.cos(p.pitch), sp = Math.sin(p.pitch);
    return raycast([p.pos[0], p.pos[1] - 0.9 + 1.62, p.pos[2]], [sy * cp, sp, cy * cp], 5);
  };

  function breakTime(id) {
    const v = CF.BY_ID[id];
    if (!v) return Infinity;
    return CF.breakTimeFor ? CF.breakTimeFor(v, CF.held && CF.held()) : (v.hardness < 0 ? Infinity : v.hardness * 5);
  }
  CF.breakTime = breakTime;

  CF.mining = null; // {x,y,z,progress,need}
  CF.mineStart = (hit) => {
    if (!hit) { CF.mining = null; return; }
    const id = CF.world.get(hit.x, hit.y, hit.z);
    CF.mining = { x: hit.x, y: hit.y, z: hit.z, progress: 0, need: breakTime(id) };
  };
  CF.mineTick = (dt) => {
    const m = CF.mining;
    if (!m) return null;
    if (!isFinite(m.need)) return null; // bedrock: unbreakable
    const id = CF.world.get(m.x, m.y, m.z);
    if (!id) { CF.mining = null; return null; }
    m.progress += dt;
    if (m.progress >= m.need) {
      const v = CF.BY_ID[id];
      const heldName = CF.held && CF.held();
      const tierOk = CF.canHarvest ? CF.canHarvest(v, heldName) : (HAND_TIER >= v.minTier || !v.tool);
      let dropName = v.drop;
      if (v.name === 'gravel' && dropName && Math.random() < 0.1) dropName = 'flint'; // 1.12: 10% flint
      if (v.name === 'leaves') { // 1.12: oak leaves 5% sapling, 0.5% apple, else nothing (#019)
        const lr = Math.random();
        dropName = lr < 0.05 ? (v.variant === 'oak' ? 'sapling' : 'sapling:' + v.variant) : lr < 0.055 && v.variant === 'oak' ? 'apple' : null; // #049 species saplings; apples oak-only (1.12)
      }
      const drops = tierOk && dropName ? [{ name: dropName, n: v.dropN || 1, x: m.x + 0.5, y: m.y + 0.5, z: m.z + 0.5 }] : [];
      if (v.name === 'furnace' && CF.furnaceBreak) CF.furnaceBreak(m.x, m.y, m.z); // #032: contents to player
      if (v.name === 'chest' && CF.chestBreak) CF.chestBreak(m.x, m.y, m.z); // #040: contents to player
      if (v.name === 'bed' && CF.bedBreak) CF.bedBreak(m.x, m.y, m.z); // #041: both halves
      CF.world.set(m.x, m.y, m.z, 0);
      for (const d of drops) CF.give ? CF.give(d.name, d.n) : 0;
      CF.drops.push(...drops);

    return { progress: m.progress / m.need };
  };

  CF.cellHitsPlayer = (tx, ty, tz) => { // #043 shared placement rule (place + bucket)
    const p = CF.player;
    const ox = Math.abs(p.pos[0] - (tx + 0.5)) < 0.3 + 0.5 && Math.abs(p.pos[2] - (tz + 0.5)) < 0.3 + 0.5;
    const oy = p.pos[1] - 0.9 < ty + 1 && p.pos[1] + 0.9 > ty;

  };

  CF.place = (hit) => {
    if (!hit) return false;
    const tx = hit.x + hit.face[0], ty = hit.y + hit.face[1], tz = hit.z + hit.face[2];
    if (CF.world.get(tx, ty, tz)) return false;
    if (CF.cellHitsPlayer(tx, ty, tz)) return false;
    const id = CF.hotId();
    if (!id) return false;
    const v = CF.BY_ID[id];
    if (v.cross) {
      // MC support rule: floor face needs solid below; side faces need solid on that side
      const f = hit.face;
      const support = f[1] === 1 ? CF.solidAt(CF.world.get(hit.x, hit.y, hit.z))
        : CF.solidAt(CF.world.get(tx - f[0], ty - f[1], tz - f[2]));
      if (!support) return false;
    }
    if (v.name === 'bed' && CF.bedPlace) return CF.bedPlace(tx, ty, tz, CF.dirFromYaw(p.yaw)); // #041 2-cell, consumes itself
    const ok = CF.world.set(tx, ty, tz, id);
    if (ok && v.cross && CF.world.flatSet) {
      const f = hit.face;
      const code = f[1] === 1 ? 1 : f[0] === 1 ? 2 : f[0] === -1 ? 6 : f[2] === 1 ? 4 : 8;
      CF.world.flatSet(tx, ty, tz, code);
    }
    if (ok && !CF.creative && CF.consume) CF.consume(CF.held(), 1);
    if (ok && CF.BY_ID[id].name === 'furnace' && CF.furnacePlace) CF.furnacePlace(tx, ty, tz);
    if (ok && CF.BY_ID[id].name === 'chest' && CF.chestPlace) CF.chestPlace(tx, ty, tz);
    return ok;
  };

  window.addEventListener('contextmenu', (e) => e.preventDefault());

    if (e.button === 2) { if (!(CF.useFlintSteel && CF.useFlintSteel(CF.aim())) && !(CF.useBlock && CF.useBlock(CF.aim())) && !(CF.useBucket && CF.useBucket(CF.aim())) && !(CF.mobFeed && CF.mobFeed()) && !(CF.useHeld && CF.useHeld())) CF.place(CF.aim()); }
  });
  window.addEventListener('mouseup', () => { CF.mining = null; });

  window.addEventListener('keydown', (e) => { if (e.code.startsWith('Digit')) { const n = +e.code[5]; if (n >= 1 && n <= 9) { CF.sel = n - 1; CF.uiRefresh && CF.uiRefresh(); } } });

  };
  window.addEventListener('mousedown', (e) => { if (e.button === 0) CF.mouseDown = true; });
  window.addEventListener('mouseup', () => { CF.mouseDown = false; });

  CF.interactTests = async (r) => {

    // break it: pick a floating dirt we place first
    const h = hit.y;
    CF.world.set(hit.x, h + 1, hit.z, IDOF['dirt']);
    CF.drops.length = 0;
    CF.mineStart({ x: hit.x, y: h + 1, z: hit.z });

    while (ticks < 100 && !(broke && broke.broke)) { broke = CF.mineTick(0.05); ticks++; }
    CF.assert(r, 'interact.break-time(1.12 dirt=0.75s, got ' + (ticks * 0.05).toFixed(2) + ')', broke && broke.broke && Math.abs(ticks * 0.05 - 0.75) <= 0.15);
    CF.assert(r, 'interact.drop', broke.broke && broke.drops.length === 1 && broke.drops[0].name === 'dirt');
    CF.assert(r, 'interact.air', CF.world.get(hit.x, h + 1, hit.z) === 0);

    // #019 leaves: 5% sapling (+0.5% apple), else nothing — statistical over 600 breaks
    CF.drops.length = 0;
    let sap = 0, leafTot = 0;
    for (let t = 0; t < 600; t++) {
      CF.world.set(hit.x, h + 1, hit.z, IDOF['leaves']);
      CF.mineStart({ x: hit.x, y: h + 1, z: hit.z });
      for (let i = 0; i < 10; i++) {

      }
    }

      CF.drops.length = 0;

      CF.assert(r, 'interact.clay-drop4(' + (CF.countItem('clay_ball') - before) + ')', broke && broke.broke && CF.countItem('clay_ball') - before === 4);

        broke && broke.broke && broke.drops.length === 1 && broke.drops[0].name === 'log:birch');

    }    CF.world.set(hit.x, h + 1, hit.z, 0);
    // bedrock unbreakable
    CF.assert(r, 'interact.bedrock', !isFinite(CF.breakTime(IDOF['bedrock'])));

    CF.sel = 1; // dirt
    P.pitch = -0.5;

    CF.assert(r, 'interact.no-self-place', !self && CF.world.get(cx, cy, cz) === 0);

    CF.assert(r, 'torch.no-float', !floatT && !CF.world.get(wx9 + 4, wh9 + 3, wz9));
    const n0 = CF.countItem('torch');

    cgWrap.appendChild(resWrap); inv.appendChild(cgWrap);
    const g4 = document.createElement('div'); g4.innerHTML = '<h4>Main</h4>';
    const grid = document.createElement('div'); grid.className = 'grid';
    for (let i = 9; i < 36; i++) { const s = mkSlot('inv', i); invSlots.push(s); grid.appendChild(s); }
    g4.appendChild(grid);
    // #032 furnace section (input / fuel / flame+cook bars / output), shown when a furnace is open
    furnEl = document.createElement('div'); furnEl.id = 'furn';
    const ft = document.createElement('h4'); ft.textContent = 'Furnace'; furnEl.appendChild(ft);
    const row = document.createElement('div'); row.className = 'row';
    finSlot = mkSlot('fin', 0);
    const midCol = document.createElement('div'); midCol.style.cssText = 'display:flex;flex-direction:column;gap:3px;align-items:center';
    burnBar = document.createElement('div'); burnBar.className = 'bar'; burnBar.innerHTML = '<i></i>';
    cookArrow = document.createElement('div'); cookArrow.className = 'bar'; cookArrow.innerHTML = '<i style="background:#9fd0ff"></i>';
    midCol.appendChild(burnBar); midCol.appendChild(cookArrow);
    foutSlot = mkSlot('fout', 0);
    ffuelSlot = mkSlot('ffuel', 0);
    const row2 = document.createElement('div'); row2.className = 'row'; row2.style.marginTop = '4px'; row2.appendChild(ffuelSlot);
    row.appendChild(finSlot); row.appendChild(midCol); row.appendChild(foutSlot);
    furnEl.appendChild(row); furnEl.appendChild(row2);
    inv.appendChild(furnEl);
    // #040 chest 27-slot grid
    chestEl = document.createElement('div'); chestEl.id = 'chest';
    const cht = document.createElement('h4'); cht.textContent = 'Chest'; chestEl.appendChild(cht);
    const cgrid = document.createElement('div'); cgrid.className = 'grid';
    for (let i = 0; i < 27; i++) { const s = mkSlot('cs', i); chestSlots.push(s); cgrid.appendChild(s); }
    chestEl.appendChild(cgrid);
    inv.appendChild(chestEl);
    inv.appendChild(g4);
    ghostEl = document.createElement('div'); ghostEl.id = 'ghost';
    const gi = document.createElement('div'); gi.className = 'icon'; ghostEl.appendChild(gi);
    document.body.appendChild(hud); document.body.appendChild(inv); document.body.appendChild(ghostEl);
    atkEl = document.createElement('div'); atkEl.id = 'atk'; atkEl.innerHTML = '<i></i>';
    document.body.appendChild(atkEl);
    const xh = document.createElement('div'); xh.id = 'xh'; document.body.appendChild(xh); // #047 crosshair
    refresh();
  }
  if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);

  function paint(el, stack) {
    const icon = el.querySelector('.icon'), cnt = el.querySelector('.cnt');
    if (!stack) { icon.style.cssText = 'position:absolute;inset:0;background-repeat:no-repeat'; cnt.textContent = ''; return; }
    Object.assign(icon.style, { position: 'absolute', inset: '0', backgroundRepeat: 'no-repeat' }, iconCss(itemTile(stack.name)));
    cnt.textContent = stack.count > 1 ? stack.count : '';
  }

  function refresh() {
    if (!hud) return;
    const xh = document.getElementById('xh'); if (xh) xh.style.display = CF.ui.open ? 'none' : 'block'; // #047
    for (let i = 0; i < 9; i++) {
      paint(hudSlots[i], CF.inv[i]);
      hudSlots[i].classList.toggle('sel', i === CF.sel);
    }
    for (let i = 0; i < invSlots.length; i++) paint(invSlots[i], CF.inv[i + 9]);
    for (let i = 0; i < 4; i++) paint(craftSlots[i], CF.ui.craft[i]);
    updateResult();
    paint(resultSlot, CF.ui.result);
    if (furnEl) {
      const f0 = be();
      const on = !!CF.ui.container && f0 && f0.type === 'furnace';
      furnEl.style.display = on ? 'block' : 'none';
      CF.ui.container && !be() && (CF.ui.container = null); // BE gone (broken/loaded away): just close panel
      if (on) {
        const f = f0;
        paint(finSlot, f.input); paint(ffuelSlot, f.fuel); paint(foutSlot, f.out);
        burnBar.firstChild.style.height = (f.burnMax ? 100 * f.burn / f.burnMax : 0) + '%';
        cookArrow.firstChild.style.height = Math.min(100, f.cook / 2) + '%'; // 200t cook -> 2%/tick
      }
    }
    if (chestEl) { // #040
      const c = be();
      const on = !!CF.ui.container && c && c.type === 'chest';
      chestEl.style.display = on ? 'block' : 'none';
      if (on) for (let i = 0; i < 27; i++) paint(chestSlots[i], c.slots[i]);
    }
    if (CF.ui.ghost) {
      ghostEl.style.display = 'block';
      Object.assign(ghostEl.querySelector('.icon').style, { position: 'absolute', inset: '0', backgroundRepeat: 'no-repeat' }, iconCss(itemTile(CF.ui.ghost.name)));
      ghostEl.querySelector('.cnt') || 0;
    } else ghostEl.style.display = 'none';
    if (atkEl) { // #036: 1.9-style charge meter, visible only mid-cooldown (sword 12t / tool 20t / hand 5t via CF.atkCdInfo)
      const ch = Math.min(1, (CF.atkTick === undefined ? 20 : CF.atkTick) / (CF.atkCdInfo ? CF.atkCdInfo() : 20));
      atkEl.style.display = ch < 0.999 ? 'block' : 'none';
      atkEl.firstChild.style.width = (ch * 100).toFixed(0) + '%';
    }
    // recompute result from current craft grid
  }

  function updateResult() {
    const grid = CF.ui.craft.map((s) => s || null);
    CF.ui.result = null;
    const res = CF.tryCraft ? CF.tryCraft(grid, 2) : null;
    if (res) CF.ui.result = { name: res.out.name, count: res.out.n };
  }

  function place(stack, kind, i) {
    if (kind === 'inv') {
      const cur = CF.inv[i];
      if (!cur) { CF.inv[i] = stack; return null; }
      if (cur.name === stack.name) {
        const move = Math.min(64 - cur.count, stack.count);
        cur.count += move; stack.count -= move;
        return stack.count > 0 ? stack : null;
      }
      CF.inv[i] = stack; return cur;
    }
    if (kind === 'craft') {
      const cur = CF.ui.craft[i];
      CF.ui.craft[i] = stack;
      updateResult();
      return cur || null;
    }
    if (kind === 'fout') return stack; // #032: furnace output is take-only (1.12)
    if (kind === 'fin' || kind === 'ffuel') {
      const cur = slotGet(kind, i);
      if (!cur) { slotSet(kind, i, stack); return null; }
      if (cur.name === stack.name) {
        const move = Math.min(64 - cur.count, stack.count);
        cur.count += move; stack.count -= move;
        return stack.count > 0 ? stack : null;
      }
      slotSet(kind, i, stack); return cur;
    }
    if (kind === 'cs') { // #040 chest slots: full bidirectional merge/swap like inventory
      const cur = slotGet(kind, i);
      if (!cur) { slotSet(kind, i, stack); return null; }
      if (cur.name === stack.name) {
        const move = Math.min(64 - cur.count, stack.count);
        cur.count += move; stack.count -= move;
        return stack.count > 0 ? stack : null;
      }
      slotSet(kind, i, stack); return cur;
    }
    return stack;
  }

  CF.uiClick = (kind, i, quick) => {
    if (kind === 'result') {
      if (!CF.ui.result) return;
      const r = CF.ui.result;
      // consume inputs: 1 from each non-empty craft slot
      for (let c = 0; c < 4; c++) if (CF.ui.craft[c]) { CF.ui.craft[c].count--; if (!CF.ui.craft[c].count) CF.ui.craft[c] = null; }
      const left = CF.give ? CF.give(r.name, r.count) : r.count;
      if (left) CF.ui.ghost = { name: r.name, count: left };
      refresh();
      return;
    }
    if (quick) {
      // #040 chest quickmove first (1.12: shift-click routes between container and inventory)
      const f = be();
      if (f && f.type === 'chest' && !CF.ui.ghost) {
        if (kind === 'cs' && f.slots[i]) { const s = f.slots[i]; const left = CF.give(s.name, s.count); f.slots[i] = left ? { name: s.name, count: left } : null; refresh(); return; }
        if (kind === 'inv' && CF.inv[i]) { const s = CF.inv[i]; const slot = f.slots.findIndex((x) => x && x.name === s.name && x.count < 64);
          if (slot >= 0) { const move = Math.min(64 - f.slots[slot].count, s.count); f.slots[slot].count += move; s.count -= move; if (!s.count) CF.inv[i] = null; refresh(); return; }
          const empty = f.slots.findIndex((x) => !x); if (empty >= 0) { f.slots[empty] = s; CF.inv[i] = null; refresh(); return; } }
      }
      // shift-click: move inv <-> craft? v1: inv<->hotbar quickmove within inv array
      if (kind === 'inv' && CF.inv[i] && !CF.ui.ghost) {
        const s = CF.inv[i];
        const target = i < 9 ? 9 + CF.inv.slice(9).findIndex((x) => !x) : i % 9;
        if (target >= 0 && target < 36 && !CF.inv[target]) { CF.inv[target] = s; CF.inv[i] = null; refresh(); }
        return;
      }
      return;
    }
    const cur = slotGet(kind, i);
    if (!CF.ui.ghost) {
      if (!cur) return;
      if (kind === 'result') return;
      CF.ui.ghost = cur;
      slotSet(kind, i, null);
    } else {
      CF.ui.ghost = place(CF.ui.ghost, kind, i);
    }
    refresh();
  };

  function moveGhost(e) {
    if (!ghostEl) return;
    ghostEl.style.left = e.clientX + 8 + 'px';
    ghostEl.style.top = e.clientY + 8 + 'px';
  }
  window.addEventListener('mousemove', moveGhost);

  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyE') {
      CF.ui.open = !CF.ui.open;
      if (inv) inv.style.display = CF.ui.open ? 'block' : 'none';
      if (!CF.ui.open && CF.ui.ghost) { CF.give(CF.ui.ghost.name, CF.ui.ghost.count); CF.ui.ghost = null; }
      if (!CF.ui.open) for (let i = 0; i < 4; i++) if (CF.ui.craft[i]) { CF.give(CF.ui.craft[i].name, CF.ui.craft[i].count); CF.ui.craft[i] = null; }
      if (!CF.ui.open) CF.ui.container = null; // #032: closing kills container view (contents stay in BE)
      refresh();
    }
    if (e.code === 'Escape' && CF.ui.open) window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyE' }));
  });
  window.addEventListener('mouseup', (e) => { if (CF.blockPlaceAt && e.button === 1) { /* middle: reserved */ } });

  // #032: right-click block use (furnace opens its GUI instead of placing)
  CF.useBlock = (hit) => {
    if (!hit) return false;
    if (CF.useBed && CF.useBed(hit)) return true; // #041 bed
    if (!CF.blockEntities) return false;
    const k = hit.x + ',' + hit.y + ',' + hit.z;
    const f = CF.blockEntities[k];
    if (f && (f.type === 'furnace' || f.type === 'chest')) { CF.uiOpenContainer(k); return true; } // #032/#040
    return false;
  };
  CF.uiOpenContainer = (k) => {
    CF.ui.container = k;
    if (!CF.ui.open) { CF.ui.open = true; if (inv) inv.style.display = 'block'; }
    refresh();
  };
  CF.uiCloseContainer = (k) => { if (CF.ui.container === k) { CF.ui.container = null; refresh(); } };

  CF.uiRefresh = refresh;
  setInterval(() => { if (document.getElementById('hud')) refresh(); }, 200);

  // ---- tests
  CF.uiTests = async (r) => {
    CF.assert(r, 'ui.hotbar', !!document.getElementById('hud') && document.querySelectorAll('#hud .slot').length === 9);
    CF.assert(r, 'ui.icon-live', (() => {
      const ic = document.querySelector('#hud .slot .icon');
      const raw = ic && ic.style.backgroundImage;
      // #043: icons use var(--cfatlas) (live-swapped after render.js repaints procedural tiles) -
      // inline style holds the var() token; the computed value must resolve to the embedded PNG.
      const resolved = ic ? getComputedStyle(ic).backgroundImage : '';
      return raw === 'var(--cfatlas)' && resolved.includes('data:image/png');
    })());
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Digit3' }));
    CF.assert(r, 'ui.sel', CF.sel === 2 && document.querySelectorAll('#hud .slot')[2].classList.contains('sel'));
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyE' }));
    CF.assert(r, 'ui.open', document.getElementById('inv').style.display === 'block');
    // drag: move cobblestone (inv[3]) to empty slot 20 by two clicks
    CF.inv.fill(null); CF.inv[3] = { name: 'cobblestone', count: 10 };
    CF.ui.ghost = null;
    CF.uiClick('inv', 3); CF.uiClick('inv', 20);
    CF.assert(r, 'ui.drag', CF.inv[20] && CF.inv[20].name === 'cobblestone' && !CF.inv[3]);
    // craft through UI: 1 log into craft grid -> planks x4 result -> collect
    CF.inv.fill(null); CF.inv[5] = { name: 'log', count: 2 };
    CF.ui.craft = [null, null, null, null]; CF.ui.ghost = null;
    CF.uiClick('inv', 5); CF.uiClick('craft', 0);   // pickup log, place in craft grid
    CF.assert(r, 'ui.result', CF.ui.result && CF.ui.result.name === 'planks' && CF.ui.result.count === 4);
    CF.uiClick('result', 0);
    CF.assert(r, 'ui.craft-collect', CF.countItem('planks') === 4 && CF.countItem('log') === 0 && CF.ui.craft[0] && CF.ui.craft[0].name === 'log');
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyE' }));
    CF.assert(r, 'ui.close', document.getElementById('inv').style.display === 'none');

    // ---- #032 furnace GUI
    const fx = 7, fy = Math.floor(CF.world.heightAt(70, 70)) + 2, fz = 70;
    CF.world.ensureAround(70, 70, 1);
    for (let i = 0; i < 10 && CF.world.stats().queue; i++) CF.world.tick();
    CF.world.set(fx, fy, fz, CF.IDOF['furnace']);
    CF.furnacePlace(fx, fy, fz);
    CF.assert(r, 'ui.furn-open', CF.useBlock({ x: fx, y: fy, z: fz }) === true
      && CF.ui.container === fx + ',' + fy + ',' + fz
      && document.getElementById('furn').style.display === 'block');
    CF.inv.fill(null); CF.ui.ghost = null;
    CF.inv[0] = { name: 'iron_ore', count: 2 }; CF.inv[1] = { name: 'coal', count: 3 };
    CF.uiClick('inv', 0); CF.uiClick('fin', 0);
    CF.uiClick('inv', 1); CF.uiClick('ffuel', 0);
    const f = CF.blockEntities[fx + ',' + fy + ',' + fz];
    CF.assert(r, 'ui.furn-insert(in=' + (f.input && f.input.name) + ',f=' + (f.fuel && f.fuel.name) + ')',
      f.input.name === 'iron_ore' && f.fuel.name === 'coal' && f.burn === 0);
    for (let i = 0; i < 202; i++) CF.furnaceTick();
    CF.assert(r, 'ui.furn-smelt(out=' + (f.out && f.out.name + f.out.count) + ',burn=' + f.burn + ')',
      f.out.name === 'iron_ingot' && f.out.count === 1 && f.input.name === 'iron_ore' && f.input.count === 1 && f.burn > 0);
    CF.uiClick('fout', 0);
    CF.assert(r, 'ui.furn-takeout', CF.ui.ghost && CF.ui.ghost.name === 'iron_ingot' && f.out === null);
    CF.ui.ghost = { name: 'cobblestone', count: 1 };
    CF.uiClick('fout', 0);
    CF.assert(r, 'ui.furn-noout-insert', CF.ui.ghost && CF.ui.ghost.name === 'cobblestone' && f.out === null);
    CF.ui.ghost = null;
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyE' }));
    CF.assert(r, 'ui.furn-close', CF.ui.container === null && CF.blockEntities[fx + ',' + fy + ',' + fz].input.name === 'iron_ore');
    CF.inv.fill(null);
    CF.furnaceBreak(fx, fy, fz);
    CF.assert(r, 'ui.furn-break-contents', CF.countItem('iron_ore') === 1 && CF.countItem('coal') === 2 && !CF.blockEntities[fx + ',' + fy + ',' + fz]); // 3 coal minus 1 burned

    // ================= #040 chest: 27-slot container + persistence =================
    const cx0 = 74, cz0 = 70, cy0 = Math.floor(CF.world.heightAt(cx0, cz0)) + 1;
    CF.world.set(cx0, cy0, cz0, CF.IDOF['chest']);
    CF.chestPlace(cx0, cy0, cz0);
    CF.assert(r, 'ui.chest-open', CF.useBlock({ x: cx0, y: cy0, z: cz0 }) === true
      && CF.ui.container === cx0 + ',' + cy0 + ',' + cz0
      && document.getElementById('chest').style.display === 'block'
      && document.getElementById('furn').style.display === 'none');
    CF.inv.fill(null); CF.ui.ghost = null;
    CF.inv[0] = { name: 'cobblestone', count: 10 }; CF.inv[1] = { name: 'cobblestone', count: 5 }; CF.inv[2] = { name: 'dirt', count: 5 };
    CF.uiClick('inv', 0); CF.uiClick('cs', 5); // ghost pickup -> store
    CF.uiClick('inv', 1); CF.uiClick('cs', 5); // second same-kind stack -> merge
    const c = CF.blockEntities[cx0 + ',' + cy0 + ',' + cz0];
    CF.assert(r, 'ui.chest-store(' + (c.slots[5] && c.slots[5].count) + ')', c.slots[5].name === 'cobblestone' && c.slots[5].count === 15);
    CF.uiClick('inv', 2, true); // shift-click dirt -> chest quickmove
    CF.assert(r, 'ui.chest-quickmove', CF.countItem('dirt') === 0 && c.slots.some((s) => s && s.name === 'dirt' && s.count === 5));
    CF.uiClick('cs', 5); CF.uiClick('inv', 0); // take back
    CF.assert(r, 'ui.chest-take', CF.countItem('cobblestone') === 15 && !c.slots[5]);
    // persistence roundtrip
    CF.give('coal', 7);
    const ck = cx0 + ',' + cy0 + ',' + cz0;
    CF.saveNow();
    CF.world.set(cx0, cy0, cz0, 0); delete CF.blockEntities[ck]; // "grief it away"
    CF.loadNow();
    const c2 = CF.blockEntities[ck];
    CF.assert(r, 'ui.chest-persist(' + (c2 && c2.slots.filter(Boolean).length) + ',bes=' + Object.keys(CF.blockEntities).join('|') + ',blk=' + CF.world.get(cx0, cy0, cz0) + '/' + CF.IDOF['chest'] + ')', !!c2 && c2.type === 'chest' && c2.slots.some((s) => s && s.name === 'dirt' && s.count === 5));
    CF.assert(r, 'ui.chest-persist-orphan', CF.world.get(cx0, cy0, cz0) === CF.IDOF['chest']); // block restored too
    // break returns contents
    CF.inv.fill(null);
    const got = CF.chestBreak(cx0, cy0, cz0);
    CF.assert(r, 'ui.chest-break', got >= 5 && CF.countItem('dirt') === 5 && !CF.blockEntities[ck]);
    CF.world.set(cx0, cy0, cz0, 0);
    // #047 crosshair present + hidden while a GUI is open; camera interpolation keeps standing y EXACT
    const xh = document.getElementById('xh');
    CF.ui.open = true; refresh(); const xhHidden = xh.style.display === 'none';
    CF.ui.open = false; refresh();
    CF.assert(r, 'ui.crosshair(' + !!xh + ',' + xhHidden + ')', !!xh && xhHidden === true && xh.style.display === 'block');
    const P = CF.player;
    P.tp(60.5, CF.world.heightAt(60, 60) + 12, 60.5); P.onGround = false; P.prevPos = P.pos.slice();
    for (let i = 0; i < 80 && !P.onGround; i++) CF.playerTick();
    let y0 = P.pos[1], still = true;
    for (let i = 0; i < 600; i++) { CF.playerTick(); if (Math.abs(P.pos[1] - y0) > 1e-9) still = false; }
    CF.assert(r, 'ui.stand-rock-still(dy=' + (P.pos[1] - y0) + ')', still === true && P.onGround === true);
    CF.ui.open = false; CF.ui.container = null; if (inv) inv.style.display = 'none';
  };

  // ---- shot scenarios
  CF.shotScenarios = CF.shotScenarios || {};
  CF.shotScenarios['ui-hotbar'] = async () => {
    CF.freeCam = false;
    const P = CF.player, W = CF.world;
    W.ensureAround(30, 30, 2);
    for (let i = 0; i < 30 && W.stats().queue; i++) W.tick();
    P.tp(30.5, W.heightAt(30, 30) + 3, 30.5);
    P.yaw = 0.9; P.pitch = -0.12;
    for (let i = 0; i < 30; i++) { CF.playerTick(); CF.renderTick(); await new Promise((x) => setTimeout(x, 30)); }
    CF.renderDraw(CF.camera);
    await new Promise((x) => setTimeout(x, 200));
  };
  CF.shotScenarios['ui-inventory'] = async () => {
    await CF.shotScenarios['ui-hotbar']();
    CF.inv[12] = { name: 'log', count: 3 };
    CF.uiClick ? (CF.ui.open || window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyE' }))) : 0;
    CF.uiClick('inv', 12); CF.uiClick('craft', 0);
    CF.uiClick('inv', 14); // second log? shapeless only needs 1
    refresh();
    CF.renderDraw(CF.camera);
    await new Promise((x) => setTimeout(x, 200));
  };
  CF.shotScenarios['ui-furnace'] = async () => {
    await CF.shotScenarios['ui-hotbar']();
    const P = CF.player, W = CF.world;
    const fx = Math.floor(P.pos[0]) + 2, fz = Math.floor(P.pos[2]), fy = W.heightAt(fx, fz) + 1;
    W.set(fx, fy, fz, CF.IDOF['furnace']);
    CF.furnacePlace(fx, fy, fz);
    const f = CF.blockEntities[fx + ',' + fy + ',' + fz];
    f.input = { name: 'iron_ore', count: 3 }; f.fuel = { name: 'coal', count: 2 };
    for (let i = 0; i < 150; i++) CF.furnaceTick(); // part-smelted: flame + cook bars mid-progress, 0 output yet
    CF.useBlock({ x: fx, y: fy, z: fz });
    CF.renderDraw(CF.camera);
    await new Promise((res) => setTimeout(res, 200)); // shot is taken AFTER this fn returns - keep GUI open
  };
  CF.shotScenarios['ui-chest'] = async () => {
    await CF.shotScenarios['ui-hotbar']();
    const P = CF.player, W = CF.world;
    const fx = Math.floor(P.pos[0]) + 2, fz = Math.floor(P.pos[2]), fy = W.heightAt(fx, fz) + 1;
    W.set(fx, fy, fz, CF.IDOF['chest']);
    CF.chestPlace(fx, fy, fz);
    const c = CF.blockEntities[fx + ',' + fy + ',' + fz];
    c.slots[0] = { name: 'cobblestone', count: 42 }; c.slots[1] = { name: 'dirt', count: 17 };
    c.slots[9] = { name: 'coal', count: 5 }; c.slots[10] = { name: 'iron_ingot', count: 3 };
    c.slots[20] = { name: 'log', count: 8 };
    CF.give('apple', 4);
    CF.useBlock({ x: fx, y: fy, z: fz });
    CF.renderDraw(CF.camera);
    await new Promise((res) => setTimeout(res, 200));
  };
})();

/* ==== src/survival.js ==== */
// Survival mode (#026): health, hunger/saturation, fall damage, lava, drowning, respawn, HUD.
// Model per docs/REFERENCE.md §physics/hunger (1.12 simplified-exhaustion model).
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const S = CF.stats = { hp: 20, food: 20, sat: 5, air: 300, deaths: 0 };
  CF.survival = false; // creative default (documented deviation: F4 toggles)

  let peakY = null, hurtCd = 0, regenAcc = 0, starveAcc = 0;

  const hud = document.createElement('div');
  hud.id = 'surv';
  hud.style.cssText = 'position:fixed;bottom:56px;left:50%;transform:translateX(-50%);display:none;gap:0;z-index:21;font:13px monospace';
  hud.innerHTML = '<div id="hearts" style="display:flex;gap:1px"></div><div id="food" style="display:flex;gap:1px;margin-left:60%"></div>';
  // #047: append synchronously when body already exists (scripts run at </body>) - the old
  // Promise.resolve().then() deferred one microtask so getElementById('hearts') could miss it
  // when a test suite ran before the flush (latent since #026, hit by the bedsuite standalone).
  if (document.body) document.body.appendChild(hud);
  else document.addEventListener('DOMContentLoaded', () => document.body.appendChild(hud));

  const HEART = '#c03028', EMPTY = '#3a3a3a', FOODC = '#c88038', DRY = '#2e2e2e';
  function pip(el, n, max, colorFull, colorEmpty, half) {
    el.innerHTML = '';
    for (let i = 0; i < max; i++) {
      const d = document.createElement('div');
      const full = n >= (i + 1) * 2, halfNow = !full && n === i * 2 + 1;
      d.style.cssText = 'width:8px;height:12px;background:' + (full ? colorFull : halfNow ? colorFull : colorEmpty);
      if (halfNow) d.style.background = 'linear-gradient(90deg,' + colorFull + ' 50%,' + colorEmpty + ' 50%)';
      d.title = (full ? 2 : halfNow ? 1 : 0);
      el.appendChild(d);
    }
  }
  function hudRefresh() {
    const on = CF.survival;
    hud.style.display = on ? 'flex' : 'none';
    if (!on) return;
    const hc = document.getElementById('hearts'), fc = document.getElementById('food');
    if (hc) pip(hc, Math.max(0, Math.ceil(S.hp)), 10, HEART, EMPTY, true);
    if (fc) pip(fc, Math.max(0, Math.ceil(S.food)), 10, FOODC, DRY, false);
  }
  CF.survRefresh = hudRefresh;

  CF.canSprint = () => !CF.survival || S.food > 6;
  CF.damage = (n, why) => {
    if (!CF.survival || hurtCd > 0 && why !== 'fall') return;
    S.hp -= n;
    hurtCd = why === 'fall' ? 0 : 10; // 1.12: post-hurt no-damage window (0.5s) - #036
    if (why === 'drown') hurtCd = 20; // drown keeps its 1s rhythm (2 dmg/s)
    if (why) CF.lastHurt = why;
    if (S.hp <= 0) respawn();
  };
  function respawn() {
    S.deaths++;
    S.hp = 20; S.food = 20; S.sat = 5; S.air = 300;
    peakY = null; // stale fall-peaks must never damage across teleports (phantom-fall bug, #036)
    const P = CF.player;
    P.tp(P.spawn[0], P.spawn[1], P.spawn[2]);
    CF.lastDeathAt = CF.ticks;
  }

  CF.useHeld = () => {
    const held = CF.held && CF.held();
    if (!held) return false;
    const def = CF.ITEMS && CF.ITEMS[held];
    if (def && def.food && S.food < 20) {
      S.food = Math.min(20, S.food + def.food);
      S.sat = Math.min(S.food, S.sat + def.food * 0.5);
      CF.consume(held, 1);
      hudRefresh();
      return true;
    }
    return false;
  };

  const origOnTick = CF.onTick;
  CF.onTick = () => {
    if (origOnTick) origOnTick();
    const P = CF.player, W = CF.world;
    if (!P || !W) return;
    if (!P.spawn) P.spawn = P.pos.slice();
    if (hurtCd > 0) hurtCd--;

    // fall tracking
    if (P.onGround) {
      if (peakY !== null) {
        const dist = peakY - P.pos[1];
        S.lastFall = +dist.toFixed(2);
        if (dist > 3) {
          const inWater = W.get(Math.floor(P.pos[0]), Math.floor(P.pos[1] - 0.9), Math.floor(P.pos[2])) === CF.IDOF['water'];
          if (!inWater) CF.damage(Math.floor(dist - 3), 'fall');
        }
        peakY = null;
      }
    } else if (P.vel[1] < 0) {
      peakY = peakY === null ? P.pos[1] : Math.max(peakY, P.pos[1]);
    }

    if (!CF.survival) return;

    // exhaustion -> hunger
    const i = P.input;
    let ex = 0;
    if (P.onGround && (i.f || i.s || i.l || i.r)) ex = i.sprint && CF.canSprint() ? 0.08 : 0.01;
    if (i.jump && P.onGround) ex += 0.1;
    if (CF.mining) ex += 0.02;
    if (ex > 0) {
      S.sat -= ex;
      if (S.sat < 0) { S.food = Math.max(0, S.food + S.sat); S.sat = 0; }
    }

    // starvation
    if (S.food <= 0 && S.sat <= 0) {
      starveAcc++;
      if (starveAcc >= 80) { starveAcc = 0; if (S.hp > 1) CF.damage(1, 'starve'); }
    } else starveAcc = 0;

    // regeneration
    if (S.food >= 18 && S.sat > 0 && S.hp < 20) {
      regenAcc++;
      const rate = S.food >= 20 ? 40 : 80;
      if (regenAcc >= rate) { regenAcc = 0; S.hp = Math.min(20, S.hp + 1); S.sat = Math.max(0, S.sat - 1.5); }
    } else regenAcc = 0;

    // lava contact (body cells)
    const fx = Math.floor(P.pos[0]), fz = Math.floor(P.pos[2]);
    const fy1 = Math.floor(P.pos[1] - 0.8), fy2 = Math.floor(P.pos[1] + 0.8);
    if (W.get(fx, fy1, fz) === CF.IDOF['lava'] || W.get(fx, fy2, fz) === CF.IDOF['lava']) CF.damage(1, 'lava');

    // drowning (head in water)
    const head = W.get(fx, Math.floor(P.pos[1] + 0.72), fz) === CF.IDOF['water'];
    if (head) {
      S.air--;
      if (S.air <= 0) { S.air = 0; if (hurtCd <= 0) CF.damage(2, 'drown'); }
    } else if (S.air < 300) S.air = Math.min(300, S.air + 10);

    // void death
    if (P.pos[1] < -10) { S.hp = 0; respawn(); }

    hudRefresh();
  };

  window.addEventListener('keydown', (e) => {
    if (e.code === 'F4') {
      CF.survival = !CF.survival;
      if (CF.survival) { S.hp = 20; S.food = 20; S.sat = 5; }
      hudRefresh();
    }
  });
  CF.shotScenarios = CF.shotScenarios || {};
  CF.shotScenarios['hud-low'] = async () => {
    CF.freeCam = false;
    const P = CF.player, W = CF.world;
    W.ensureAround(30, 30, 2);
    for (let i = 0; i < 30 && W.stats().queue; i++) W.tick();
    P.tp(30.5, W.heightAt(30, 30) + 3, 30.5);
    P.yaw = 0.9; P.pitch = -0.15;
    CF.survival = true; S.hp = 7; S.food = 6; S.sat = 1; S.air = 240;
    for (let i = 0; i < 40; i++) { CF.playerTick(); CF.renderTick(); await new Promise((x) => setTimeout(x, 30)); }
    hudRefresh();
    CF.renderDraw(CF.camera);
    await new Promise((x) => setTimeout(x, 200));
  };
  setInterval(hudRefresh, 500);

  // ---- tests
  CF.survivalTests = async (r) => {
    const P = CF.player, W = CF.world;
    CF.survival = true; S.hp = 20; S.food = 20; S.sat = 5;
    W.ensureAround(P.spawn ? P.spawn[0] : 8, 8, 2);
    const gx = 100, gz = 100;
    W.ensureAround(gx, gz, 1);
    for (let i = 0; i < 10 && W.stats().queue; i++) W.tick();
    let gxx = gx, gzz = gz, found = false;
    for (let tries = 0; tries < 40 && !found; tries++) {
      const cx3 = gx + (tries % 8) * 3 - 9, cz3 = gz + Math.floor(tries / 8) * 3 - 6;
      const hh3 = W.heightAt(cx3, cz3);
      let clear = true;
      for (let y = hh3 + 1; y <= hh3 + 14; y++) if (W.get(cx3, y, cz3) || W.get(cx3 + 1, y, cz3) || W.get(cx3 - 1, y, cz3)) { clear = false; break; }
      if (clear) { gxx = cx3; gzz = cz3; found = true; }
    }
    CF.assert(r, 'surv.clear-spot', found === true);
    const gh = W.heightAt(gxx, gzz);
    // fall 10 blocks -> 7 dmg
    P.spawn = [gxx + 0.5, gh + 1, gzz + 0.5];
    P.tp(gxx + 0.5, gh + 12, gzz + 0.5);
    S.hp = 20; hurtCd = 0; peakY = null; P.onGround = false;
    for (let t = 0; t < 90; t++) { CF.playerTick(); CF.onTick(); if (P.onGround && t > 3) break; }
    // 1.12 formula floor(d-3): discrete sim peak-logging costs +/-1-2 blocks -> range assert (documented)
    CF.assert(r, 'surv.fall10(' + S.hp + ',f=' + S.lastFall + ')', S.hp >= 11 && S.hp <= 14 && P.onGround);
    // fall 3 blocks -> 0 dmg
    P.tp(gxx + 0.5, gh + 5, gzz + 0.5);
    S.hp = 20; hurtCd = 0; peakY = null; P.onGround = false;
    for (let t = 0; t < 90; t++) { CF.playerTick(); CF.onTick(); if (P.onGround && t > 3) break; }
    CF.assert(r, 'surv.fall3(' + S.hp + ')', S.hp === 20);
    // sprint gate
    S.food = 6;
    CF.assert(r, 'surv.sprint-gate', CF.canSprint() === false);
    S.food = 10;
    CF.assert(r, 'surv.sprint-ok', CF.canSprint() === true);
    // starvation floors at 1 hp
    S.food = 0; S.sat = 0; S.hp = 6; hurtCd = 0; starveAcc = 0;
    for (let t = 0; t < 2000; t++) CF.onTick();
    CF.assert(r, 'surv.starve-floor(' + S.hp + ')', S.hp === 1);
    // eating apple
    S.food = 10; S.sat = 0;
    CF.inv.fill(null); CF.give('apple', 1); CF.sel = 0;
    CF.useHeld();
    CF.assert(r, 'surv.eat(' + S.food + ')', S.food === 14 && CF.countItem('apple') === 0);
    // regen: full food heals
    S.food = 20; S.sat = 5; S.hp = 10; regenAcc = 0;
    for (let t = 0; t < 200; t++) CF.onTick();
    CF.assert(r, 'surv.regen(' + S.hp + ')', S.hp > 10);
    // death + respawn via void
    S.hp = 20; const d0 = S.deaths;
    P.tp(0, -30, 0);
    CF.onTick();
    CF.assert(r, 'surv.respawn(' + S.hp + ',' + S.deaths + ')', S.deaths === d0 + 1 && S.hp === 20 && P.pos[1] > -5);
    // HUD
    hudRefresh();
    CF.assert(r, 'surv.hud', document.getElementById('hearts').children.length === 10 && hud.style.display === 'flex');
    CF.survival = false; hudRefresh();
  };
})();

// localStorage save/load, schema v1 (SPK-5): RLE edited-chunks + player + time.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const KEY = 'cf-save-1';

  function rleEncode(arr) {
    const out = [];
    let cur = arr[0], len = 1;
    for (let i = 1; i < arr.length; i++) {
      if (arr[i] === cur && len < 255) len++;
      else { out.push(cur, len); cur = arr[i]; len = 1; }
    }
    out.push(cur, len);
    return new Uint8Array(out);
  }
  function rleDecode(bytes, size) {
    const arr = new Uint8Array(size);
    let p = 0;
    for (let i = 0; i < bytes.length; i += 2) {
      const id = bytes[i], len = bytes[i + 1];
      for (let k = 0; k < len && p < size; k++) arr[p++] = id;
    }
    return arr;
  }
  CF.rleEncode = rleEncode; CF.rleDecode = rleDecode;

  const b64e = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
  const b64d = (s) => { const bin = atob(s), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8; };

  function initEditTracking(w) {
    if (w._tracked) return;
    w._tracked = true;
    w.edited = new Set();
    const orig = w.set;
    w.set = function (x, y, z, id) {
      const r = orig(x, y, z, id);
      if (r) w.edited.add(Math.floor(x / 16) + ',' + Math.floor(z / 16));
      return r;
    };
  }

  function saveNow() {
    const w = CF.world;
    if (!w) return null;
    initEditTracking(w);
    const save = { v: 1, seed: w.seed, time: CF.ticks, player: CF.player ? {
      pos: CF.player.pos.map((v) => +v.toFixed(2)), yaw: CF.player.yaw, pitch: CF.player.pitch, sel: CF.sel } : null,
      chunks: {}, bes: CF.blockEntities || {} }; // #040: chests+furnaces persist (was furnace-losing-on-reload before)
    let bytes = 0;
    const keys = [...w.edited];
    keys.sort((a, b) => { // far chunks saved last so eviction drops them first
      const [ax, az] = a.split(',').map(Number), [bx, bz] = b.split(',').map(Number);
      return Math.hypot(bx * 16, bz * 16) - Math.hypot(ax * 16, az * 16);
    });
    for (const k of keys) {
      const c = w.chunks.get(k);
      if (!c) continue;
      const enc = rleEncode(c.arr);
      save.chunks[k] = b64e(enc);
      bytes += save.chunks[k].length;
    }
    let warn = null;
    for (;;) {
      try { localStorage.setItem(KEY, JSON.stringify(save)); break; }
      catch (e) {
        const ks = Object.keys(save.chunks);
        if (!ks.length) { warn = 'quota: nothing left'; break; }
        delete save.chunks[ks[ks.length - 1]]; // evict farthest
        warn = 'quota: evicted far edited chunk';
      }
    }
    CF.saveInfo = { bytes: JSON.stringify(save).length, chunks: Object.keys(save.chunks).length, warn };
    return CF.saveInfo;
  }

  function loadNow() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return false; }
    if (!raw) return false;
    loadNow._raw = String(raw).slice(0, 12);
    let save = null;
    try { save = JSON.parse(raw); } catch (e) { loadNow._rej = 'parse'; localStorage.removeItem(KEY); return false; }
    if (!save || save.v !== 1) { loadNow._rej = 'ver'; localStorage.removeItem(KEY); return false; }
    CF.world = CF.makeWorld(save.seed);
    CF.renderReset && CF.renderReset();
    CF.mobs && CF.mobs.clear(); // mobs are transient (persistence = backlog #044)
    if (CF.tnts) CF.tnts.length = 0; // primed TNT not persisted either
    initEditTracking(CF.world);
    for (const [k, b] of Object.entries(save.chunks || {})) {
      const [cx, cz] = k.split(',').map(Number);
      CF.world.generate(cx, cz);
      const c = CF.world.chunks.get(k);
      if (c) { c.arr.set(rleDecode(b64d(b), c.arr.length)); CF.world.edited.add(k); CF.world.dirty.add(k); }
    }
    if (save.player && CF.player) {
      CF.player.tp(...save.player.pos);
      CF.player.yaw = save.player.yaw; CF.player.pitch = save.player.pitch;
      CF.sel = save.player.sel || 0;
    }
    CF.ticks = save.time || 0;
    // #040: restore container BEs (drop orphans whose block is gone, e.g. blown up before saving)
    CF.blockEntities = {};
    for (const [k, b] of Object.entries(save.bes || {})) {
      const [bx, by, bz] = k.split(',').map(Number);
      const nm = CF.BY_ID[CF.world.get(bx, by, bz)];
      if (nm && ((nm.name === 'chest' && b.type === 'chest') || (nm.name === 'furnace' && b.type === 'furnace'))) CF.blockEntities[k] = b;
    }
    CF.loaded = true;
    return true;
  }

  CF.saveNow = saveNow;
  CF.loadNow = loadNow;
  if (CF.world) initEditTracking(CF.world);

  setInterval(() => { if (CF.world && CF.player && CF.ticks > 10 && !CF.autosavePaused) saveNow(); }, 10000);
  window.addEventListener('beforeunload', () => saveNow());
  if (location.search.includes('new=1')) { try { localStorage.removeItem(KEY); } catch (e) {} }
  else if (CF.world) { setTimeout(() => loadNow(), 0); } // auto-load if a save exists (fresh profiles: no-op)

  CF.persistTests = async (r) => {
    const W = CF.world;
    // RLE unit
    const sample = new Uint8Array(400); sample.fill(3); sample[100] = 1; sample[399] = 5;
    const back = rleDecode(rleEncode(sample), 400);
    CF.assert(r, 'save.rle-unit', back.every((v, i) => v === sample[i]));
    // world edit + tower, save, reload
    W.ensureAround(8, 8, 3);
    for (let i = 0; i < 20 && W.stats().queue; i++) W.tick();
    const tx = 8, tz = 8, th = W.heightAt(tx, tz);
    for (let y = th + 1; y <= th + 5; y++) W.set(tx, y, tz, CF.IDOF['cobblestone']);
    CF.player.tp(8.5, th + 1, 8.5); CF.player.yaw = 1.23; CF.player.pitch = -0.33;
    for (let i = 0; i < 40; i++) W.tick(); // spread/gravity churn
    const info = saveNow();
    CF.assert(r, 'save.size(' + info.bytes + 'B)', info.bytes < 150000 && info.chunks >= 1);
    CF.world = CF.makeWorld(999999); // world with no tower, wrong seed
    CF.renderReset && CF.renderReset();
    const ok = loadNow();
    CF.assert(r, 'save.load', ok === true);
    let tower = 0;
    for (let y = th + 1; y <= th + 5; y++) if (CF.world.get(tx, y, tz) === CF.IDOF['cobblestone']) tower++;
    CF.assert(r, 'save.edits(' + tower + ')', tower === 5);
    CF.assert(r, 'save.seed', CF.world.seed === W.seed);
    CF.assert(r, 'save.player', Math.abs(CF.player.yaw - 1.23) < 1e-6 && Math.abs(CF.player.pos[1] - (th + 1)) < 0.01);
    // corrupt save -> clean fallback
    CF.autosavePaused = true;
    localStorage.setItem('cf-save-1', '{corrupt!');
    const rawDbg = (localStorage.getItem('cf-save-1') || '').slice(0, 14);
    const bad = loadNow();
    CF.assert(r, 'save.corrupt(bad=' + bad + ',raw=' + rawDbg + ',rawIn=' + loadNow._raw + ',rej=' + (loadNow._rej || 'pass') + ')',
      bad === false && !!CF.world && CF.world.heightAt(0, 0) > 0);
    localStorage.removeItem('cf-save-1');
    CF.autosavePaused = false;
  };
})();

// F3 debug overlay (Tier-1): fps, xyz, chunk, faced direction, aimed block, light-ish stats.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const div = document.createElement('div');
  div.id = 'f3';
  div.style.cssText = 'position:fixed;top:4px;left:4px;color:#fff;font:12px monospace;' +
    'text-shadow:1px 1px 0 #000;background:rgba(0,0,0,.35);padding:4px;display:none;z-index:10;pointer-events:none';
  if (document.body) document.body.appendChild(div);
  let on = false, frames = 0, fps = 0, last = performance.now();
  window.addEventListener('keydown', (e) => { if (e.code === 'F3') { on = !on; div.style.display = on ? 'block' : 'none'; } });
  setInterval(() => {
    frames++;
    const now = performance.now();
    if (now - last > 500) { fps = Math.round(frames * 1000 / (now - last)); frames = 0; last = now; }
    if (!on) return;
    const p = CF.player, t = CF.aim && CF.aim();
    const b = t ? CF.BY_ID[CF.world.get(t.x, t.y, t.z)] : null;
    const lt = t ? CF.world.lightAt(t.x, t.y + (t.face ? t.face[1] : 0), t.z) : 0;
    const bio = p && CF.world.biome ? CF.world.biome(Math.floor(p.pos[0]), Math.floor(p.pos[2])) : '-';
    div.textContent = 'Cubeforge F3\n' +
      `${fps} fps  ticks ${CF.ticks}` + (CF.simMs !== undefined ? `  sim ${CF.simMs.toFixed(1)}ms` : '') + '\n' +
      (p ? `XYZ: ${p.pos.map((v) => v.toFixed(2)).join(' / ')}\n` +
        `Chunk: ${Math.floor(p.pos[0] / 16)}, ${Math.floor(p.pos[2] / 16)}  facing ${yawFace(p.yaw)}  biome ${bio}\n` : '') +
      `Target: ${b ? b.name + (b.variant !== 'default' ? ':' + b.variant : '') + ` [${t.x} ${t.y} ${t.z}]  light ${Math.max(lt >> 4, 0)}/${lt & 15}` : 'none'}\n` +
      `Time: ${CF.timeOfDay ? CF.timeOfDay() : 0}  Daylight: ${CF.dayFactor ? Math.round(CF.dayFactor() * 100) : 100}%\n` +
      `Chunks: ${CF.world ? CF.world.stats().chunks : 0}  Tris: ${CF.rendererStats ? CF.rendererStats.tris : 0}\n` +
      `Seed: ${CF.world ? CF.world.seed : '-'}  Hotbar: ${CF.hotbar ? CF.hotbar[CF.sel] : '-'}\n` +
      `Drops: ${CF.drops ? CF.drops.length : 0}  Save: ${CF.saveInfo ? CF.saveInfo.bytes + 'B/' + CF.saveInfo.chunks + 'ch' : '-'}` +
      (CF.saveInfo && CF.saveInfo.warn ? ' WARN ' + CF.saveInfo.warn : '');
  }, 250);
  function yawFace(y) {
    const w = ((Math.round(y / (Math.PI / 2)) % 4) + 4) % 4;
    return ['south', 'west', 'north', 'east'][w];
  }
  CF.shotScenarios = CF.shotScenarios || {};
  CF.shotScenarios['f3-on'] = async () => {
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'F3' }));
    const P = CF.player;
    if (P && P.pos[1] < 5) P.tp(30.5, CF.world.heightAt(30, 30) + 3, 30.5);
    await new Promise((r) => setTimeout(r, 600));
  };
  CF.f3Tests = async (r) => {
    CF.assert(r, 'f3.overlay-exists', !!document.getElementById('f3'));
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'F3' }));
    CF.assert(r, 'f3.toggle', div.style.display === 'block');
    await new Promise((res) => setTimeout(res, 400));
    const txt = div.textContent;
    CF.assert(r, 'f3.content', txt.includes('fps') && txt.includes('XYZ') && txt.includes('Chunk') && txt.includes('Target') && txt.includes('Seed') && txt.includes('biome') && txt.includes('Daylight') && txt.includes('Save'));
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'F3' }));
  };
})();

// Mobs (#035 core, #036 AI/combat): entity system (AABB physics, lifecycle, lit-box render) + zombie.
// 1.12 spawn rule: hostile needs max(blockLight, skyLight*dayFactor) <= 7 ("light 0" is 1.18+!).
// #036: heap-A* chase on walkable columns (SPK-4 ALT, sense 35, budget 2/tick) + 1.9-style charge combat.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const GRAV = 32; // same as player (player.js)
  // #039 1.12.2 spawn caps (global, MONSTER/CREATURE categories) + distance bands. Attempt budget throttles
  // the monster cap to a perf-safe trickle given our small load radius.

        { cy: 0.2, sx: 0.5, sy: 0.4, sz: 0.5, color: 'cree' },   // legs

      drop: { name: 'gunpowder', min: 0, max: 2 }, // only when killed by player; detonation = no drop
    },
    // ---- #038 passives (1.12.2: wander + flee when hurt + breed w/ food; babies grow in 6000t)
    pig: { w: 0.9, h: 0.9, hp: 10, speed: 1.1, passive: true, breed: { food: 'carrot' },
      boxes: [
        { cy: 0.5, sx: 0.62, sy: 0.5, sz: 0.8, color: 'pig' },   // body
        { cy: 0.5, cz: -0.5, sx: 0.5, sy: 0.5, sz: 0.4, color: 'pig' }, // head
        { cy: 0.15, sx: 0.5, sy: 0.32, sz: 0.6, color: 'pig' },   // leg block
      ],
      drop: { name: 'raw_porkchop', min: 1, max: 3 }, // saddle/looting -> #044
    },
    cow: { w: 0.9, h: 1.4, hp: 10, speed: 0.9, passive: true, breed: { food: 'wheat' },
      boxes: [
        { cy: 0.95, sx: 0.64, sy: 0.66, sz: 1.0, color: 'cow' },   // body

        { cy: 0.3, sx: 0.56, sy: 0.6, sz: 0.44, color: 'cow' },    // legs block

      boxes: [

        { cy: 1.0, cz: -0.62, sx: 0.42, sy: 0.48, sz: 0.44, color: 'zcloth' }, // face
        { cy: 0.28, sx: 0.5, sy: 0.56, sz: 0.4, color: 'zdark' },  // legs block
      ],
      drop: { name: 'wool', min: 1, max: 1, extra: { name: 'mutton', min: 1, max: 2 } }, // shearing -> #044
