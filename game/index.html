          const uvf = meta ? [(meta.x + 0.25) / 128, (meta.y + 0.25) / 128, (meta.x + 15.75) / 128, (meta.y + 15.75) / 128] : MAGENTA_UV;

          const uvs = [[uvf[0], uvf[1]], [uvf[2], uvf[1]], [uvf[2], uvf[3]], [uvf[0], uvf[3]]];

            const q = [c00, c10, c11, c01][oi];

  const vs = `#version 300 es
layout(location=0) in vec3 P; layout(location=1) in vec3 Q; layout(location=2) in float BR;
uniform mat4 VP; uniform vec3 E;
out vec2 uv; out float sh; out float dist; out float br;
void main(){ gl_Position = VP*vec4(P,1.); uv=Q.xy; sh=Q.z; br=BR; dist=length(E-P); }`;

precision mediump float;

void main(){ vec4 t = texture(T, uv); float f = clamp((dist-40.)/50., 0., 1.);

      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 28, 12);

      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 28, 12);

  function draw(cam) {
    if (!gl || !texReady) return;
    const c = CF.canvas;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);

    if (!gl) return [0, 0, 0];

  CF.rendererTests = async (r) => {
    const t0 = performance.now();

    CF.renderDraw({ pos: [0, CF.world.heightAt(0, 0) + 12, 0], yaw: 0.6, pitch: -1.4 });

// Player: 1.12.2 AABB physics (0.6x1.8, eye 1.62), gravity, walk/sprint/sneak/jump/step-up.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const HW = 0.3, HH = 0.9, EYE = 1.62;
  const GRAV = 32, JUMP = 8.94, WALK = 4.317, SPRINT = 5.6, SNEAK = 1.3;

  const player = {
    pos: [8.5, 80, 8.5], vel: [0, 0, 0], yaw: Math.PI / 4, pitch: -0.2,
    onGround: false, input: { f: 0, s: 0, l: 0, r: 0, jump: false, sneak: false, sprint: false },
    tp(x, y, z) { this.pos = [x, y, z]; this.vel = [0, 0, 0]; },
  };
  CF.player = player;

  const solid = (x, y, z) => CF.solidAt(CF.world.get(Math.floor(x), Math.floor(y), Math.floor(z)));
  function boxHits(px, py, pz) {
    for (let x = Math.floor(px - HW); x <= Math.floor(px + HW); x++)
      for (let y = Math.floor(py - HH + 0.001); y <= Math.floor(py + HH - 0.001); y++)
        for (let z = Math.floor(pz - HW); z <= Math.floor(pz + HW); z++)
          if (solid(x, y, z)) return true;
    return false;
  }

  const keys = {};
  window.addEventListener('keydown', (e) => { keys[e.code] = true; if (['Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) e.preventDefault(); });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  function readInput() {
    const i = player.input;
    if (i.scripted) return;
    i.f = keys['KeyW'] ? 1 : 0; i.s = keys['KeyS'] ? 1 : 0;
    i.l = keys['KeyA'] ? 1 : 0; i.r = keys['KeyD'] ? 1 : 0;
    i.jump = !!keys['Space']; i.sneak = !!keys['ShiftLeft']; i.sprint = !!keys['ControlLeft'];
  }

  function tick(dt = 0.05) {
    if (!CF.world) return;
    readInput();
    const i = player.input;
    const speed = (i.sprint && (!CF.canSprint || CF.canSprint())) ? SPRINT : i.sneak ? SNEAK : WALK;
    const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw);
    let mx = fx * (i.f - i.s) + Math.cos(player.yaw) * (i.r - i.l);
    let mz = fz * (i.f - i.s) - Math.sin(player.yaw) * (i.r - i.l);
    const ml = Math.hypot(mx, mz);
    if (ml > 0) { mx = mx / ml * speed; mz = mz / ml * speed; }
    player.vel[0] = mx; player.vel[2] = mz;
    player.vel[1] -= GRAV * dt;
    if (i.jump && player.onGround) { player.vel[1] = JUMP; player.onGround = false; }

    const [p0, p1, p2] = player.pos;
    let [x, y, z] = player.pos;
    // per-axis sweep
    let nx = x + player.vel[0] * dt;
    if (boxHits(nx, y, z)) {
      const stepY = y + 0.6;
      if (player.onGround && !boxHits(nx, stepY, z)) { y = stepY; nx = x + player.vel[0] * dt * 0.75; }
      else nx = x;
    }
    x = nx;
    let nz = z + player.vel[2] * dt;
    if (boxHits(x, y, nz)) {
      const stepY = y + 0.6;
      if (player.onGround && !boxHits(x, stepY, nz)) { y = stepY; nz = z + player.vel[2] * dt * 0.75; }
      else nz = z;
    }
    z = nz;
    let ny = y + player.vel[1] * dt;
    player.onGround = false;
    if (boxHits(x, ny, z)) {
      if (player.vel[1] < 0) { player.onGround = true; ny = Math.floor(y - HH) + 1 + HH; }
      else ny = Math.ceil(y + HH) - 1 - HH - 0.001;
      player.vel[1] = 0;
    }
    y = ny;
    // snap to exact ground: settle when tiny hop noise
    if (player.onGround && Math.abs(player.vel[1]) < 0.01) y = Math.round((y - HH) * 1000) / 1000;
    player.pos = [x, y, z];
    if (y < -20) player.tp(8.5, CF.world.heightAt(8, 8) + 2, 8.5); // void rescue

    if (!CF.freeCam) CF.camera = { pos: [x, y - HH + EYE, z], yaw: player.yaw, pitch: player.pitch };
  }
  player.tick = tick;
  CF.playerTick = tick;

  // Mouse look with pointer lock (real play; harness uses scripted input/yaw directly).
  document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement) {
      player.yaw += e.movementX * 0.0026;
      player.pitch = Math.max(-1.55, Math.min(1.55, player.pitch - e.movementY * 0.0026));
    }
  });
  document.addEventListener('click', () => { if (CF.canvas && CF.canvas.requestPointerLock) CF.canvas.requestPointerLock(); });

  CF.playerTests = async (r) => {
    const P = CF.player;
    const h = CF.world.heightAt(8, 8);
    P.tp(8.5, h + 10, 8.5);
    P.input.scripted = true;
    P.input.f = P.input.l = P.input.r = 0; P.input.jump = false;
    for (let i = 0; i < 40; i++) tick();
    CF.assert(r, 'player.land', P.onGround && P.pos[1] > h - 1 && P.pos[1] < h + 3);
    const y0 = P.pos[1], x0 = P.pos[0], z0 = P.pos[2];
    P.input.f = 1;
    for (let i = 0; i < 60; i++) tick();
    P.input.f = 0;
    const dist = Math.hypot(P.pos[0] - x0, P.pos[2] - z0);
    CF.assert(r, 'player.move(' + dist.toFixed(1) + ')', dist > 2);
    CF.assert(r, 'player.no-sink', P.pos[1] > h - 1 && P.onGround);
    P.tp(8.5, h + 12, 8.5);
    for (let i = 0; i < 80; i++) tick();
    const hAt = CF.world.heightAt(Math.floor(P.pos[0]), Math.floor(P.pos[2]));
    CF.assert(r, 'player.gravity-fall', P.onGround && P.pos[1] >= hAt);
    CF.assert(r, 'player.camera', !!CF.camera && Math.abs(CF.camera.pos[1] - (P.pos[1] - 0.9 + 1.62)) < 0.5);
    // #018: horizontal wall blocking — build a cobble wall, walk into it, must not pass
    const wx = Math.floor(P.pos[0]) + 2, wz = Math.floor(P.pos[2]);
    const wy = Math.floor(P.pos[1] - 0.9);
    CF.world.ensureAround(wx, wz, 1);
    for (let i = 0; i < 10 && CF.world.stats().queue; i++) CF.world.tick();
    for (let yy = wy; yy <= wy + 2; yy++) for (let dz = -2; dz <= 2; dz++) CF.world.set(wx, yy, wz + dz, CF.IDOF['cobblestone']);
    P.yaw = 0; // face +Z? wall is +X away -> face +X:
    P.yaw = Math.PI / 2;
    P.input.f = 1;
    const xBefore = P.pos[0];
    for (let i = 0; i < 60; i++) tick();
    P.input.f = 0;
    CF.assert(r, 'player.wall-block(' + (P.pos[0] - xBefore).toFixed(2) + ')', P.pos[0] < wx - 0.25 && P.pos[0] > xBefore - 0.01);
    for (let yy = wy; yy <= wy + 2; yy++) for (let dz = -2; dz <= 2; dz++) CF.world.set(wx, yy, wz + dz, 0);
  };
})();

// Interaction: DDA raycast, hold-to-break with 1.12 break-time formula + tier gate,
// place with player-overlap rule, hotbar selection, drops queue.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const HAND_TIER = 0, HAND_SPEED = 1; // tool system comes later; hand for now

  CF.hotbar = ['grass', 'dirt', 'stone', 'cobblestone', 'planks', 'log', 'leaves', 'glowstone', 'glass'];
  CF.sel = 0;
  CF.drops = [];

  CF.hotId = () => {
    const h = CF.held && CF.held();
    if (!h) return 0;
    const reg = CF.REGISTRY[h];
    if (!reg) return 0;
    const k = Object.keys(reg.variants)[0];
    return reg.variants[k].id;
  };

  function raycast(o, d, maxD) {
    let x = Math.floor(o[0]), y = Math.floor(o[1]), z = Math.floor(o[2]);
    const sx = d[0] > 0 ? 1 : -1, sy = d[1] > 0 ? 1 : -1, sz = d[2] > 0 ? 1 : -1;
    const dx = Math.abs(1 / (d[0] || 1e-9)), dy = Math.abs(1 / (d[1] || 1e-9)), dz = Math.abs(1 / (d[2] || 1e-9));
    let tx = ((sx > 0 ? x + 1 - o[0] : o[0] - x)) * dx;
    let ty = ((sy > 0 ? y + 1 - o[1] : o[1] - y)) * dy;
    let tz = ((sz > 0 ? z + 1 - o[2] : o[2] - z)) * dz;
    let t = 0, face = [0, 0, 0];
    for (let i = 0; i < 120; i++) {
      if (CF.solidAt(CF.world.get(x, y, z))) return { x, y, z, face };
      if (tx < ty && tx < tz) { x += sx; t = tx; tx += dx; face = [-sx, 0, 0]; }
      else if (ty < tz) { y += sy; t = ty; ty += dy; face = [0, -sy, 0]; }
      else { z += sz; t = tz; tz += dz; face = [0, 0, -sz]; }
      if (t > maxD) return null;
    }
    return null;
  }
  CF.raycast = raycast;

  CF.aim = () => {
    const p = CF.player;
    if (!p) return null;
    const cy = Math.cos(p.yaw), sy = Math.sin(p.yaw), cp = Math.cos(p.pitch), sp = Math.sin(p.pitch);
    return raycast([p.pos[0], p.pos[1] - 0.9 + 1.62, p.pos[2]], [sy * cp, sp, cy * cp], 5);
  };

  function breakTime(id) {
    const v = CF.BY_ID[id];
    if (!v) return Infinity;
    return CF.breakTimeFor ? CF.breakTimeFor(v, CF.held && CF.held()) : (v.hardness < 0 ? Infinity : v.hardness * 5);
  }
  CF.breakTime = breakTime;

  CF.mining = null; // {x,y,z,progress,need}
  CF.mineStart = (hit) => {
    if (!hit) { CF.mining = null; return; }
    const id = CF.world.get(hit.x, hit.y, hit.z);
    CF.mining = { x: hit.x, y: hit.y, z: hit.z, progress: 0, need: breakTime(id) };
  };
  CF.mineTick = (dt) => {
    const m = CF.mining;
    if (!m) return null;
    if (!isFinite(m.need)) return null; // bedrock: unbreakable
    const id = CF.world.get(m.x, m.y, m.z);
    if (!id) { CF.mining = null; return null; }
    m.progress += dt;
    if (m.progress >= m.need) {
      const v = CF.BY_ID[id];
      const heldName = CF.held && CF.held();
      const tierOk = CF.canHarvest ? CF.canHarvest(v, heldName) : (HAND_TIER >= v.minTier || !v.tool);
      let dropName = v.drop;
      if (v.name === 'gravel' && dropName && Math.random() < 0.1) dropName = 'flint'; // 1.12: 10% flint
      if (v.name === 'leaves') { // 1.12: oak leaves 5% sapling, 0.5% apple, else nothing (#019)
        const lr = Math.random();
        dropName = lr < 0.05 ? 'sapling' : lr < 0.055 ? 'apple' : null;
      }
      const drops = tierOk && dropName ? [{ name: dropName, n: 1, x: m.x + 0.5, y: m.y + 0.5, z: m.z + 0.5 }] : [];
      if (v.name === 'furnace' && CF.furnaceBreak) CF.furnaceBreak(m.x, m.y, m.z); // #032: contents to player
      CF.world.set(m.x, m.y, m.z, 0);
      for (const d of drops) CF.give ? CF.give(d.name, d.n) : 0;
      CF.drops.push(...drops);
      CF.mining = null;
      return { broke: [m.x, m.y, m.z], drops, noDrop: !tierOk };
    }
    return { progress: m.progress / m.need };
  };

  CF.place = (hit) => {
    if (!hit) return false;
    const tx = hit.x + hit.face[0], ty = hit.y + hit.face[1], tz = hit.z + hit.face[2];
    if (CF.world.get(tx, ty, tz)) return false;
    const p = CF.player;
    const ox = Math.abs(p.pos[0] - (tx + 0.5)) < 0.3 + 0.5 && Math.abs(p.pos[2] - (tz + 0.5)) < 0.3 + 0.5;
    const oy = p.pos[1] - 0.9 < ty + 1 && p.pos[1] + 0.9 > ty;
    if (ox && oy) return false;
    const id = CF.hotId();
    if (!id) return false;
    const v = CF.BY_ID[id];
    if (v.cross) {
      // MC support rule: floor face needs solid below; side faces need solid on that side
      const f = hit.face;
      const support = f[1] === 1 ? CF.solidAt(CF.world.get(hit.x, hit.y, hit.z))
        : CF.solidAt(CF.world.get(tx - f[0], ty - f[1], tz - f[2]));
      if (!support) return false;
    }
    const ok = CF.world.set(tx, ty, tz, id);
    if (ok && v.cross && CF.world.flatSet) {
      const f = hit.face;
      const code = f[1] === 1 ? 1 : f[0] === 1 ? 2 : f[0] === -1 ? 6 : f[2] === 1 ? 4 : 8;
      CF.world.flatSet(tx, ty, tz, code);
    }
    if (ok && !CF.creative && CF.consume) CF.consume(CF.held(), 1);
    if (ok && CF.BY_ID[id].name === 'furnace' && CF.furnacePlace) CF.furnacePlace(tx, ty, tz);
    return ok;
  };

  // input wiring (real browser)
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('mousedown', (e) => {
    if (!CF.player) return;
    if (e.button === 0) CF.mineStart(CF.aim());
    if (e.button === 2) { if (!(CF.useFlintSteel && CF.useFlintSteel(CF.aim())) && !(CF.useBlock && CF.useBlock(CF.aim())) && !(CF.mobFeed && CF.mobFeed()) && !(CF.useHeld && CF.useHeld())) CF.place(CF.aim()); }
  });
  window.addEventListener('mouseup', () => { CF.mining = null; });
  window.addEventListener('wheel', (e) => { CF.sel = (CF.sel + (e.deltaY > 0 ? 1 : -1) + CF.hotbar.length) % CF.hotbar.length; CF.uiRefresh && CF.uiRefresh(); });
  window.addEventListener('keydown', (e) => { if (e.code.startsWith('Digit')) { const n = +e.code[5]; if (n >= 1 && n <= 9) { CF.sel = n - 1; CF.uiRefresh && CF.uiRefresh(); } } });

  // continuous mining from the sim tick (1.12: holding LMB continues)
  const origTick = CF.onTick;
  CF.onTick = () => {
    if (origTick) origTick();
    if (CF.mouseDown) { if (!CF.mining) CF.mineStart(CF.aim()); CF.mineTick(0.05); }
  };
  window.addEventListener('mousedown', (e) => { if (e.button === 0) CF.mouseDown = true; });
  window.addEventListener('mouseup', () => { CF.mouseDown = false; });

  CF.interactTests = async (r) => {
    const P = CF.player, IDOF = CF.IDOF;
    // place a dirt block under cursor by direct API: aim down at ground
    P.pitch = -1.4;
    const hit = CF.aim();
    CF.assert(r, 'interact.aim-hit', !!hit && CF.solidAt(CF.world.get(hit.x, hit.y, hit.z)));
    // break it: pick a floating dirt we place first
    const h = hit.y;
    CF.world.set(hit.x, h + 1, hit.z, IDOF['dirt']);
    CF.drops.length = 0;
    CF.mineStart({ x: hit.x, y: h + 1, z: hit.z });
    let broke = null, ticks = 0;
    while (ticks < 100 && !(broke && broke.broke)) { broke = CF.mineTick(0.05); ticks++; }
    CF.assert(r, 'interact.break-time(1.12 dirt=0.75s, got ' + (ticks * 0.05).toFixed(2) + ')', broke && broke.broke && Math.abs(ticks * 0.05 - 0.75) <= 0.15);
    CF.assert(r, 'interact.drop', broke.broke && broke.drops.length === 1 && broke.drops[0].name === 'dirt');
    CF.assert(r, 'interact.air', CF.world.get(hit.x, h + 1, hit.z) === 0);
    // stone by hand: 2.25*5=11.25s > 2s of mining -> not broken, no drop
    CF.world.set(hit.x, h + 1, hit.z, IDOF['stone']);
    CF.mineStart({ x: hit.x, y: h + 1, z: hit.z });
    for (let i = 0; i < 40; i++) CF.mineTick(0.05);
    CF.assert(r, 'interact.slow-tier', CF.world.get(hit.x, h + 1, hit.z) === IDOF['stone']);
    const need = CF.breakTime(IDOF['stone']);
    CF.assert(r, 'interact.slow-time(' + need + 's)', Math.abs(need - 7.5) < 0.01);
    CF.mining = null;
    // gravel flint 10% (1.12, audit #011): statistical over 240 breaks
    CF.drops.length = 0;
    let flint = 0, total = 0;
    for (let t = 0; t < 240; t++) {
      CF.world.set(hit.x, h + 1, hit.z, IDOF['gravel']);
      CF.mineStart({ x: hit.x, y: h + 1, z: hit.z });
      for (let i = 0; i < 40; i++) {
        const res = CF.mineTick(0.05);
        if (res && res.broke) { total++; flint += res.drops.some((d) => d.name === 'flint') ? 1 : 0; break; }
      }
    }
    CF.assert(r, 'interact.gravel-flint(' + flint + '/' + total + ')', total === 240 && flint > 6 && flint < 45);
    // #019 leaves: 5% sapling (+0.5% apple), else nothing — statistical over 600 breaks
    CF.drops.length = 0;
    let sap = 0, leafTot = 0;
    for (let t = 0; t < 600; t++) {
      CF.world.set(hit.x, h + 1, hit.z, IDOF['leaves']);
      CF.mineStart({ x: hit.x, y: h + 1, z: hit.z });
      for (let i = 0; i < 10; i++) {
        const res = CF.mineTick(0.05);
        if (res && res.broke) { leafTot++; sap += res.drops.some((d) => d.name === 'sapling') ? 1 : 0; break; }
      }
    }
    CF.assert(r, 'interact.leaves-drop(' + sap + '/' + leafTot + ')', leafTot === 600 && sap > 12 && sap < 55);
    CF.world.set(hit.x, h + 1, hit.z, 0);
    // bedrock unbreakable
    CF.assert(r, 'interact.bedrock', !isFinite(CF.breakTime(IDOF['bedrock'])));
    // place: aim ~2 blocks ahead (not own column!), place selected hotbar block
    CF.sel = 1; // dirt
    P.pitch = -0.5;
    const g = CF.aim();
    const placed = CF.place(g);
    const tg = [g.x + g.face[0], g.y + g.face[1], g.z + g.face[2]];
    CF.assert(r, 'interact.place', placed && CF.world.get(tg[0], tg[1], tg[2]) === IDOF['dirt']);
    CF.world.set(tg[0], tg[1], tg[2], 0);
    // place into self fails: craft synthetic hit targeting player's own feet cell
    const cx = Math.floor(P.pos[0]), cy = Math.floor(P.pos[1] - 0.45), cz = Math.floor(P.pos[2]);
    CF.world.set(cx, cy, cz, 0);
    const self = CF.place({ x: cx - 1, y: cy, z: cz, face: [1, 0, 0] });
    CF.assert(r, 'interact.no-self-place', !self && CF.world.get(cx, cy, cz) === 0);
    // #028: torch attaches to solid faces only; pops when support dies
    const wx9 = 60, wz9 = 60;
    CF.world.ensureAround(wx9, wz9, 1);
    for (let i = 0; i < 10 && CF.world.stats().queue; i++) CF.world.tick();
    const wh9 = CF.world.heightAt(wx9, wz9);
    CF.world.set(wx9, wh9 + 1, wz9, IDOF['cobblestone']);
    CF.inv[CF.sel] = { name: 'torch', count: 4 };
    const wallT = CF.place({ x: wx9, y: wh9 + 1, z: wz9, face: [0, 0, -1] });
    CF.assert(r, 'torch.on-wall', wallT && CF.world.get(wx9, wh9 + 1, wz9 - 1) === IDOF['torch']);
    const floatT = CF.place({ x: wx9 + 3, y: wh9 + 3, z: wz9, face: [1, 0, 0] });
    CF.assert(r, 'torch.no-float', !floatT && !CF.world.get(wx9 + 4, wh9 + 3, wz9));
    const n0 = CF.countItem('torch');
    CF.world.set(wx9, wh9 + 1, wz9, 0);
    CF.assert(r, 'torch.pop(g=' + CF.world.get(wx9, wh9 + 1, wz9 - 1) + ',c=' + CF.countItem('torch') + '/' + (n0 + 1) + ')', CF.world.get(wx9, wh9 + 1, wz9 - 1) === 0 && CF.countItem('torch') === n0 + 1);
  };
})();

// Items, inventory, crafting (1.12 recipes), tools (speeds/tiers), furnace smelting (#024).
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const STACK = 64;

  const TOOLS = { wood: { tier: 1, speed: 2 }, stone: { tier: 2, speed: 4 }, iron: { tier: 3, speed: 6 }, diamond: { tier: 4, speed: 8 } };
  const MAT_ITEM = { wood: 'planks', stone: 'cobblestone', iron: 'iron_ingot', diamond: 'diamond' };
  CF.ITEMS = {
    stick: { tile: 'item_stick' },
    coal: { tile: 'item_coal' },
    iron_ingot: { tile: 'item_iron_ingot' },
    gold_ingot: { tile: 'item_gold_ingot' },
    diamond: { tile: 'item_diamond' },
    apple: { tile: 'item_apple', food: 4 },
    rotten_flesh: { food: 4, poison: true }, // 1.12: +4 food, 80% poison II 4s (poison effect lands with #036 combat)
    sapling: { tile: 'item_sapling' },
    flint: { tile: 'item_flint' },
    shears: { tile: 'item_shears', tool: { type: 'shears', tier: 0, speed: 1 } },
    flint_and_steel: {}, // #042 igniter (durability ignored in Tier-1)
    // mob drops + passive products (#037/#038). No atlas tiles yet -> blank icons (tracked #044); counts/logic tested.
    bone: {}, arrow: {}, gunpowder: {}, string: {}, feather: {}, leather: {}, ink_sac: {},
    egg: {}, wheat: {}, carrot: { food: 3 }, potato: { food: 1 }, wheat_seeds: {},
    raw_porkchop: { food: 3 }, cooked_porkchop: { food: 8 },
    raw_beef: { food: 3 }, steak: { food: 8 },
    mutton: { food: 2 }, cooked_mutton: { food: 6 },
    raw_chicken: { food: 2, poison: 0.3 }, cooked_chicken: { food: 6 },
    wool: {}, // sheep drop; colour variants -> #044 (only white registered)
  };
  for (const [mat, info] of Object.entries(TOOLS))
    for (const shape of ['pickaxe', 'axe', 'shovel', 'sword'])
      CF.ITEMS[mat + '_' + shape] = { tile: 'item_' + mat + '_' + shape, tool: { type: shape, tier: info.tier, speed: info.speed } };

  CF.itemDef = (name) => {
    if (CF.ITEMS[name]) return CF.ITEMS[name];
    const reg = CF.REGISTRY[name];
    if (reg) { const k = Object.keys(reg.variants)[0]; return { tile: reg.variants[k].tiles[0], block: true }; }
    return null;
  };

  // ---- inventory (36 slots: 0-8 hotbar)
  CF.inv = new Array(36).fill(null);
  CF.give = (name, n = 1) => {
    let left = n;
    for (let i = 0; i < 36 && left > 0; i++) {
      const s = CF.inv[i];
      if (s && s.name === name && s.count < STACK) { const add = Math.min(STACK - s.count, left); s.count += add; left -= add; }
    }
    for (let i = 0; i < 36 && left > 0; i++) if (!CF.inv[i]) { const add = Math.min(STACK, left); CF.inv[i] = { name, count: add }; left -= add; }
    return left; // leftover (inv full)
  };
  CF.countItem = (name) => CF.inv.reduce((s, it) => s + (it && it.name === name ? it.count : 0), 0);
  CF.consume = (name, n = 1) => {
    if (CF.countItem(name) < n) return false;
    let left = n;
    for (let i = 0; i < 36 && left > 0; i++) {
      const s = CF.inv[i];
      if (s && s.name === name) { const t = Math.min(s.count, left); s.count -= t; left -= t; if (!s.count) CF.inv[i] = null; }
    }
    return true;
  };
  CF.held = () => CF.inv[CF.sel] && CF.inv[CF.sel].name;
  CF.heldDef = () => { const h = CF.held(); return h ? CF.itemDef(h) : null; };

  // ---- break-time with held tool (model documented in REFERENCE §tool tiers)
  CF.canHarvest = (blockV, heldName) => {
    if (!blockV.tool) return true;
    const d = heldName && CF.ITEMS[heldName];
    if (!d || !d.tool) return false;
    return d.tool.type === blockV.tool && d.tool.tier >= (blockV.minTier || 0);
  };
  CF.breakTimeFor = (blockV, heldName) => {
    if (blockV.hardness < 0) return Infinity;
    const d = heldName && CF.ITEMS[heldName];
    if (CF.canHarvest(blockV, heldName)) {
      const speed = d && d.tool ? d.tool.speed : 1;
      return blockV.hardness * 1.5 / speed;
    }
    return blockV.hardness * 5;
  };

  // ---- crafting: shaped (1.12 patterns) + shapeless; grid = array of size*size {name}|null
  const P = (rows, key, out, n) => ({ rows, key, out: { name: out, n } });
  CF.RECIPES = [
    { shapeless: { log: 1 }, out: { name: 'planks', n: 4 } },
    P(['p', 'p'], { p: 'planks' }, 'stick', 4),
    P(['pp', 'pp'], { p: 'planks' }, 'crafting_table', 1),
    P(['ccc', 'c c', 'ccc'], { c: 'cobblestone' }, 'furnace', 1),
    P(['ccc', 'c c', 'ccc'], { c: 'planks' }, 'chest', 1),
    P(['c', 's'], { c: 'coal', s: 'stick' }, 'torch', 4),
    P(['mmm', ' s ', ' s '], null, 'pickaxe', 4), // materials expanded below
    P(['mm', 'ms', ' s'], null, 'axe', 4),
    P(['m', 's', 's'], null, 'shovel', 4),
    P(['m', 'm', 's'], null, 'sword', 4),
    P([' i', 'i '], { i: 'iron_ingot' }, 'shears', 1),
    // #042 TNT (1.12: 5 gunpowder + 4 sand) + flint & steel (1.12: iron ingot + flint)
    P(['gsg', 'sgs', 'gsg'], { g: 'gunpowder', s: 'sand' }, 'tnt', 1),
    P(['i', 'f'], { i: 'iron_ingot', f: 'flint' }, 'flint_and_steel', 1),
  ];
  const baseTools = CF.RECIPES.filter((x) => x.rows && !x.key);
  for (const mat of ['wood', 'stone', 'iron', 'diamond'])
    for (const b of baseTools)
      CF.RECIPES.push({ rows: b.rows, key: { m: MAT_ITEM[mat], s: 'stick' }, out: { name: mat + '_' + b.out.name, n: 1 } });
  CF.RECIPES = CF.RECIPES.filter((x) => (x.key || x.shapeless) && baseTools.indexOf(x) < 0);

  function normalize(grid, size) {
    let r0 = size, r1 = -1, c0 = size, c1 = -1;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++)
      if (grid[r * size + c]) { r0 = Math.min(r0, r); r1 = Math.max(r1, r); c0 = Math.min(c0, c); c1 = Math.max(c1, c); }
    if (r1 < 0) return null;
    const rows = [];
    for (let r = r0; r <= r1; r++) rows.push(grid.slice(r * size + c0, r * size + c1 + 1).map((s) => s && s.name));
    return rows;
  }
  CF.tryCraft = (grid, size) => {
    const names = grid.filter(Boolean).map((s) => s.name);
    const filled = grid.reduce((s, x) => s + (x ? x.count : 0), 0);
    for (const rec of CF.RECIPES) {
      if (rec.shapeless) {
        const need = Object.entries(rec.shapeless);
        if (names.length !== need.length) continue;
        const pool = names.slice();
        let ok = true;
        for (const [matName, cnt] of need) {
          const want = MAT_ITEM[matName] || matName;
          const i = pool.indexOf(want);
          if (i < 0) { ok = false; break; }
          pool.splice(i, 1);
        }
        if (ok) return { out: rec.out, count: 1 };
        continue;
      }
      const rows = normalize(grid, size);
      if (!rows || rows.length !== rec.rows.length) continue;
      let ok = true;
      const consumed = {};
      for (let r = 0; r < rows.length && ok; r++)
        for (let c = 0; c < rows[r].length && ok; c++) {
          const want = rec.key[rec.rows[r][c]] || (rec.rows[r][c] === ' ' ? null : '?');
          const got = rows[r][c];
          const wantN = rec.rows[r][c] === ' ' ? null : want;
          if (wantN !== got) ok = false;
          if (got) consumed[got] = (consumed[got] || 0) + 1;
        }
      if (ok) return { out: rec.out, count: Math.floor(filled ? 1 : 1) };
    }
    return null;
  };
  CF.craftOnce = (slots) => {
    // slots: array (4 or 9) of inventory indices forming the crafting grid
    const size = slots.length === 9 ? 3 : 2;
    const grid = slots.map((i) => CF.inv[i] || null);
    const res = CF.tryCraft(grid, size);
    if (!res) return null;
    for (const i of slots) {
      if (CF.inv[i]) { CF.inv[i].count--; if (!CF.inv[i].count) CF.inv[i] = null; }
    }
    CF.give(res.out.name, res.out.n);
    return res.out;
  };

  // ---- furnace block entities + smelting (200t/item, coal fuel 1600t)
  CF.blockEntities = {};
  const SMELT = { iron_ore: 'iron_ingot', gold_ore: 'gold_ingot', sand: 'glass' };
  CF.FUEL = { coal: 1600, planks: 300, log: 300, stick: 100 };
  CF.furnacePlace = (x, y, z) => { CF.blockEntities[x + ',' + y + ',' + z] = { type: 'furnace', input: null, fuel: null, out: null, burn: 0, cook: 0 }; };
  // #032: breaking a furnace returns its contents to the player (no item entities in Tier-1)
  CF.furnaceBreak = (x, y, z) => {
    const k = x + ',' + y + ',' + z, f = CF.blockEntities[k];
    if (!f) return;
    for (const s of [f.input, f.fuel, f.out]) if (s && CF.give) CF.give(s.name, s.count);
    delete CF.blockEntities[k];
    CF.uiCloseContainer && CF.uiCloseContainer(k);
  };
  CF.furnaceTick = () => {
    for (const k in CF.blockEntities) {
      const f = CF.blockEntities[k];
      if (f.type !== 'furnace') continue;
      const canSmelt = f.input && SMELT[f.input.name] && (f.out === null || (f.out.name === SMELT[f.input.name] && f.out.count < STACK));
      if (f.burn === 0 && canSmelt && f.fuel && CF.FUEL[f.fuel.name]) {
        f.burn = CF.FUEL[f.fuel.name]; f.burnMax = CF.FUEL[f.fuel.name];
        f.fuel.count--; if (!f.fuel.count) f.fuel = null;
      }
      if (f.burn > 0 && canSmelt) {
        f.burn--; f.cook++;
        if (f.cook >= 200) {
          f.cook = 0;
          const prod = SMELT[f.input.name];
          f.input.count--; if (!f.input.count) f.input = null;
          f.out = f.out ? { name: prod, count: f.out.count + 1 } : { name: prod, count: 1 };
        }
      } else if (f.burn > 0) f.burn--;
      else f.cook = 0;
    }
  };

  const origOnTick = CF.onTick;
  CF.onTick = () => { if (origOnTick) origOnTick(); CF.furnaceTick(); };

  // creative starter kit (survival switch comes in #026)
  if (CF.creative === undefined) {
    CF.creative = true;
    ['grass', 'dirt', 'stone', 'cobblestone', 'planks', 'log', 'leaves', 'glowstone', 'crafting_table'].forEach((n, i) => { CF.inv[i] = { name: n, count: 64 }; });
    CF.inv[8] = { name: 'torch', count: 16 };
  }

  // ---- tests
  CF.itemTests = async (r) => {
    const put = (i, name, n = 1) => { CF.inv[i] = { name, count: n }; };
    // log -> 4 planks (shapeless)
    CF.inv.fill(null);
    put(0, 'log', 1);
    let res = CF.craftOnce([0, 1, 2, 3]);
    CF.assert(r, 'items.planks(' + JSON.stringify(res) + ')', res && res.name === 'planks' && CF.countItem('planks') === 4 && CF.countItem('log') === 0);
    // sticks: 2 planks vertical -> 4 (slot grid is row-major: vertical = slots 0 & 2)
    CF.inv.fill(null); put(0, 'planks', 1); put(2, 'planks', 1);
    CF.craftOnce([0, 1, 2, 3]);
    CF.assert(r, 'items.stick', CF.countItem('stick') === 4 && CF.countItem('planks') === 0);
    // torch: coal over stick -> 4
    CF.inv.fill(null); put(0, 'coal', 1); put(2, 'stick', 1);
    CF.craftOnce([0, 1, 2, 3]);
    CF.assert(r, 'items.torch(t=' + CF.countItem('torch') + ',c=' + CF.countItem('coal') + ')', CF.countItem('torch') === 4 && CF.countItem('coal') === 0 && CF.countItem('stick') === 0);
    // crafting table 2x2 planks
    CF.inv.fill(null); for (let i = 0; i < 4; i++) put(i, 'planks', 1);
    CF.craftOnce([0, 1, 2, 3]);
    CF.assert(r, 'items.table(' + CF.countItem('crafting_table') + ')', CF.countItem('crafting_table') === 1);
    // iron pickaxe 3x3 pattern
    CF.inv.fill(null); put(20, 'iron_ingot', 1); put(21, 'iron_ingot', 1); put(22, 'iron_ingot', 1); put(24, 'stick', 1); put(27, 'stick', 1);
    res = CF.craftOnce([20, 21, 22, 23, 24, 25, 26, 27, 28]);
    CF.assert(r, 'items.iron-pickaxe(' + CF.countItem('iron_pickaxe') + ',' + (res && res.name) + ')', CF.countItem('iron_pickaxe') === 1 && res && res.name === 'iron_pickaxe');
    // tool speeds per model: stone w/ wood pick = 1.125s, w/ hand = 7.5s, iron ore w/ stone pick harvests
    const stoneV = CF.REGISTRY.stone.variants.default;
    CF.assert(r, 'items.speed-stone-wood(' + CF.breakTimeFor(stoneV, 'wood_pickaxe') + ')',
      Math.abs(CF.breakTimeFor(stoneV, 'wood_pickaxe') - 1.125) < 0.01 && Math.abs(CF.breakTimeFor(stoneV, null) - 7.5) < 0.01);
    const goldV = CF.REGISTRY.gold_ore.variants.default;
    CF.assert(r, 'items.gate-gold', CF.canHarvest(goldV, 'wood_pickaxe') === false && CF.canHarvest(goldV, 'iron_pickaxe') === true);
    // furnace smelt: iron_ore + coal -> iron_ingot after 200 ticks
    CF.furnacePlace(1, 1, 1);
    const f = CF.blockEntities['1,1,1'];
    f.input = { name: 'iron_ore', count: 1 }; f.fuel = { name: 'coal', count: 1 };
    for (let i = 0; i < 202; i++) CF.furnaceTick();
    CF.assert(r, 'items.smelt(' + (f.out && f.out.name + f.out.count) + ')', f.out && f.out.name === 'iron_ingot' && f.out.count === 1 && f.input === null);
    delete CF.blockEntities['1,1,1'];
    // torch: light 14 propagates (uses the #020 light engine)
    CF.world.ensureAround(60, 60, 2);
    for (let i = 0; i < 20 && CF.world.stats().queue; i++) CF.world.tick();
    let th2 = 0;
    for (let dx = -2; dx <= 6; dx++) th2 = Math.max(th2, CF.world.heightAt(60 + dx, 60));
    const ty2 = th2 + 2;
    CF.world.set(60, ty2, 60, CF.IDOF['torch']);
    CF.world.ensureLight(3, 3);
    const tl = CF.world.lightAt(60, ty2, 61) & 15;
    const tl2 = CF.world.lightAt(60, ty2, 64) & 15;
    const tl0 = CF.world.lightAt(60, ty2, 60) & 15;
    const tidHere = CF.world.get(60, ty2, 60);
    CF.assert(r, 'items.torch-light(src=' + tl0 + ',id=' + tidHere + ',lid=' + (CF.IDOF['torch']) + ',l=' + (CF.BY_ID[tidHere] && CF.BY_ID[tidHere].light) + ',adj=' + tl + ',' + tl2 + ')', tl === 13 && tl2 === 10);
    // give/stack/consume
    CF.inv.fill(null);
    CF.give('dirt', 70);
    CF.assert(r, 'items.stack', CF.countItem('dirt') === 70 && CF.inv[0].count === 64 && CF.inv[1].count === 6);
    CF.assert(r, 'items.consume', CF.consume('dirt', 65) && CF.countItem('dirt') === 5 && !CF.consume('dirt', 6));
  };
})();

/* ==== src/ui.js ==== */
// Inventory & hotbar UI (#025): DOM overlay, atlas-sliced icons, click-drag transfer, 2x2 crafting.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const ICON_SCALE = 3;

  CF.ui = {
    open: false,
    ghost: null,          // {name,count} carried by cursor
    craft: [null, null, null, null],
    craftSize: 2,
    container: null,      // #032: blockEntity key while a container GUI (furnace) is open
  };

  // #032: generic slot accessors across inv / craft grid / container blockEntities
  const be = () => (CF.ui.container && CF.blockEntities) ? CF.blockEntities[CF.ui.container] : null;
  function slotGet(kind, i) {
    if (kind === 'inv') return CF.inv[i];
    if (kind === 'craft') return CF.ui.craft[i];
    const f = be(); if (!f) return null;
    return kind === 'fin' ? f.input : kind === 'ffuel' ? f.fuel : kind === 'fout' ? f.out : null;
  }
  function slotSet(kind, i, s) {
    if (kind === 'inv') { CF.inv[i] = s; return; }
    if (kind === 'craft') { CF.ui.craft[i] = s; updateResult(); return; }
    const f = be(); if (!f) return;
    if (kind === 'fin') f.input = s; else if (kind === 'ffuel') f.fuel = s; else f.out = s;
  }

  const style = document.createElement('style');
  style.textContent =
    '#hud{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:3px;z-index:20}' +
    '.slot{width:44px;height:44px;background:rgba(0,0,0,.45);border:2px solid #6b6b6b;position:relative;box-sizing:border-box;image-rendering:pixelated;cursor:pointer}' +
    '.slot.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}' +
    '.slot .cnt{position:absolute;right:1px;bottom:0;color:#fff;font:bold 12px monospace;text-shadow:1px 1px 0 #000}' +
    '#inv{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(20,20,20,.85);' +
    'border:2px solid #555;padding:10px;display:none;z-index:30;color:#fff;font:12px monospace}' +
    '#inv .grid{display:grid;grid-template-columns:repeat(9,40px);gap:3px}' +
    '#inv .cgrid{display:grid;grid-template-columns:repeat(2,40px);gap:3px}' +
    '#inv .slot{width:36px;height:36px;border-width:2px}' +
    '#inv h4{margin:6px 0 3px;font-weight:normal;color:#bbb}' +
    '#ghost{position:fixed;width:32px;height:32px;pointer-events:none;z-index:40;display:none;image-rendering:pixelated}' +
    '.icon{position:absolute;inset:0;background-repeat:no-repeat}' +
    '#furn{display:none;margin:6px 0;padding:6px;border:1px solid #666}' +
    '#furn .row{display:flex;gap:8px;align-items:center;justify-content:center}' +
    '#furn .bar{width:22px;height:36px;background:#333;border:1px solid #555;position:relative;overflow:hidden}' +
    '#furn .bar>i{position:absolute;left:0;right:0;bottom:0;background:#e8a33d;display:block}' +
    '#atk{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);width:120px;height:4px;background:#222;border:1px solid #555;z-index:21;display:none}' +
    '#atk>i{display:block;height:100%;background:#c03028;width:0}';
  document.head ? document.head.appendChild(style) : document.addEventListener('DOMContentLoaded', () => document.head.appendChild(style));

  const ICON_URL = window.__ATLAS_B64 ? 'url(data:image/png;base64,' + window.__ATLAS_B64 + ')' : 'none';
  function iconCss(tile) {
    const meta = (window.__TEXMETA || {})[tile];
    if (!meta) return { backgroundImage: 'none' };
    const S = ICON_SCALE;
    return {
      backgroundImage: ICON_URL,
      backgroundSize: 128 * S + 'px ' + 128 * S + 'px',
      backgroundPosition: '-' + meta.x * S + 'px -' + meta.y * S + 'px',
    };
  }
  function itemTile(name) {
    const d = CF.itemDef && CF.itemDef(name);
    return d ? d.tile : null;
  }

  function mkSlot(kind, i) {
    const d = document.createElement('div');
    d.className = 'slot';
    d.dataset.kind = kind; d.dataset.i = i;
    d.innerHTML = '<div class="icon"></div><div class="cnt"></div>';
    d.addEventListener('mousedown', (e) => { e.preventDefault(); uiClick(kind, i, e.button === 2 || e.shiftKey); });
    d.addEventListener('mouseenter', (e) => { if (CF.ui.ghost && e.shiftKey) uiClick(kind, i, true); });
    return d;
  }

  let hud, inv, ghostEl, hudSlots = [], invSlots = [], craftSlots = [], resultSlot = null;
  let furnEl, finSlot, ffuelSlot, foutSlot, burnBar, cookArrow;
  let atkEl;

  function build() {
    hud = document.createElement('div'); hud.id = 'hud';
    for (let i = 0; i < 9; i++) { const s = mkSlot('inv', i); hudSlots.push(s); hud.appendChild(s); }
    inv = document.createElement('div'); inv.id = 'inv';
    const title = document.createElement('div'); title.textContent = 'Inventory (E to close)';
    inv.appendChild(title);
    const cgWrap = document.createElement('div'); cgWrap.innerHTML = '<h4>Crafting</h4>';
    const cg = document.createElement('div'); cg.className = 'cgrid';
    for (let i = 0; i < 4; i++) { const s = mkSlot('craft', i); craftSlots.push(s); cg.appendChild(s); }
    resultSlot = mkSlot('result', 0); resultSlot.classList.add('result');
    const resWrap = document.createElement('div'); resWrap.appendChild(cg);
    const resLbl = document.createElement('div'); resLbl.innerHTML = '<h4>→</h4>';
    resWrap.style.display = 'flex'; resWrap.style.gap = '8px'; resWrap.style.alignItems = 'center';
    resWrap.appendChild(resLbl); resWrap.appendChild(resultSlot);
    cgWrap.appendChild(resWrap); inv.appendChild(cgWrap);
    const g4 = document.createElement('div'); g4.innerHTML = '<h4>Main</h4>';
    const grid = document.createElement('div'); grid.className = 'grid';
    for (let i = 9; i < 36; i++) { const s = mkSlot('inv', i); invSlots.push(s); grid.appendChild(s); }
    g4.appendChild(grid);
    // #032 furnace section (input / fuel / flame+cook bars / output), shown when a furnace is open
    furnEl = document.createElement('div'); furnEl.id = 'furn';
    const ft = document.createElement('h4'); ft.textContent = 'Furnace'; furnEl.appendChild(ft);
    const row = document.createElement('div'); row.className = 'row';
    finSlot = mkSlot('fin', 0);
    const midCol = document.createElement('div'); midCol.style.cssText = 'display:flex;flex-direction:column;gap:3px;align-items:center';
    burnBar = document.createElement('div'); burnBar.className = 'bar'; burnBar.innerHTML = '<i></i>';
    cookArrow = document.createElement('div'); cookArrow.className = 'bar'; cookArrow.innerHTML = '<i style="background:#9fd0ff"></i>';
    midCol.appendChild(burnBar); midCol.appendChild(cookArrow);
    foutSlot = mkSlot('fout', 0);
    ffuelSlot = mkSlot('ffuel', 0);
    const row2 = document.createElement('div'); row2.className = 'row'; row2.style.marginTop = '4px'; row2.appendChild(ffuelSlot);
    row.appendChild(finSlot); row.appendChild(midCol); row.appendChild(foutSlot);
    furnEl.appendChild(row); furnEl.appendChild(row2);
    inv.appendChild(furnEl);
    inv.appendChild(g4);
    ghostEl = document.createElement('div'); ghostEl.id = 'ghost';
    const gi = document.createElement('div'); gi.className = 'icon'; ghostEl.appendChild(gi);
    document.body.appendChild(hud); document.body.appendChild(inv); document.body.appendChild(ghostEl);
    atkEl = document.createElement('div'); atkEl.id = 'atk'; atkEl.innerHTML = '<i></i>';
    document.body.appendChild(atkEl);
    refresh();
  }
  if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);

  function paint(el, stack) {
    const icon = el.querySelector('.icon'), cnt = el.querySelector('.cnt');
    if (!stack) { icon.style.cssText = 'position:absolute;inset:0;background-repeat:no-repeat'; cnt.textContent = ''; return; }
    Object.assign(icon.style, { position: 'absolute', inset: '0', backgroundRepeat: 'no-repeat' }, iconCss(itemTile(stack.name)));
    cnt.textContent = stack.count > 1 ? stack.count : '';
  }

  function refresh() {
    if (!hud) return;
    for (let i = 0; i < 9; i++) {
      paint(hudSlots[i], CF.inv[i]);
      hudSlots[i].classList.toggle('sel', i === CF.sel);
    }
    for (let i = 0; i < invSlots.length; i++) paint(invSlots[i], CF.inv[i + 9]);
    for (let i = 0; i < 4; i++) paint(craftSlots[i], CF.ui.craft[i]);
    updateResult();
    paint(resultSlot, CF.ui.result);
    if (furnEl) {
      const on = !!CF.ui.container && !!be();
      furnEl.style.display = on ? 'block' : 'none';
      CF.ui.container && !be() && (CF.ui.container = null); // BE gone (broken/loaded away): just close panel
      if (on) {
        const f = be();
        paint(finSlot, f.input); paint(ffuelSlot, f.fuel); paint(foutSlot, f.out);
        burnBar.firstChild.style.height = (f.burnMax ? 100 * f.burn / f.burnMax : 0) + '%';
        cookArrow.firstChild.style.height = Math.min(100, f.cook / 2) + '%'; // 200t cook -> 2%/tick
      }
    }
    if (CF.ui.ghost) {
      ghostEl.style.display = 'block';
      Object.assign(ghostEl.querySelector('.icon').style, { position: 'absolute', inset: '0', backgroundRepeat: 'no-repeat' }, iconCss(itemTile(CF.ui.ghost.name)));
      ghostEl.querySelector('.cnt') || 0;
    } else ghostEl.style.display = 'none';
    if (atkEl) { // #036: 1.9-style charge meter, visible only mid-cooldown (sword 12t / tool 20t / hand 5t via CF.atkCdInfo)
      const ch = Math.min(1, (CF.atkTick === undefined ? 20 : CF.atkTick) / (CF.atkCdInfo ? CF.atkCdInfo() : 20));
      atkEl.style.display = ch < 0.999 ? 'block' : 'none';
      atkEl.firstChild.style.width = (ch * 100).toFixed(0) + '%';
    }
    // recompute result from current craft grid
  }

  function updateResult() {
    const grid = CF.ui.craft.map((s) => s || null);
    CF.ui.result = null;
    const res = CF.tryCraft ? CF.tryCraft(grid, 2) : null;
    if (res) CF.ui.result = { name: res.out.name, count: res.out.n };
  }

  function place(stack, kind, i) {
    if (kind === 'inv') {
      const cur = CF.inv[i];
      if (!cur) { CF.inv[i] = stack; return null; }
      if (cur.name === stack.name) {
        const move = Math.min(64 - cur.count, stack.count);
        cur.count += move; stack.count -= move;
        return stack.count > 0 ? stack : null;
      }
      CF.inv[i] = stack; return cur;
    }
    if (kind === 'craft') {
      const cur = CF.ui.craft[i];
      CF.ui.craft[i] = stack;
      updateResult();
      return cur || null;
    }
    if (kind === 'fout') return stack; // #032: furnace output is take-only (1.12)
    if (kind === 'fin' || kind === 'ffuel') {
      const cur = slotGet(kind, i);
      if (!cur) { slotSet(kind, i, stack); return null; }
      if (cur.name === stack.name) {
        const move = Math.min(64 - cur.count, stack.count);
        cur.count += move; stack.count -= move;
        return stack.count > 0 ? stack : null;
      }
      slotSet(kind, i, stack); return cur;
    }
    return stack;
  }

  CF.uiClick = (kind, i, quick) => {
    if (kind === 'result') {
      if (!CF.ui.result) return;
      const r = CF.ui.result;
      // consume inputs: 1 from each non-empty craft slot
      for (let c = 0; c < 4; c++) if (CF.ui.craft[c]) { CF.ui.craft[c].count--; if (!CF.ui.craft[c].count) CF.ui.craft[c] = null; }
      const left = CF.give ? CF.give(r.name, r.count) : r.count;
      if (left) CF.ui.ghost = { name: r.name, count: left };
      refresh();
      return;
    }
    if (quick) {
      // shift-click: move inv <-> craft? v1: inv<->hotbar quickmove within inv array
      if (kind === 'inv' && CF.inv[i] && !CF.ui.ghost) {
        const s = CF.inv[i];
        const target = i < 9 ? 9 + CF.inv.slice(9).findIndex((x) => !x) : i % 9;
        if (target >= 0 && target < 36 && !CF.inv[target]) { CF.inv[target] = s; CF.inv[i] = null; refresh(); }
      }
      return;
    }
    const cur = slotGet(kind, i);
    if (!CF.ui.ghost) {
      if (!cur) return;
      if (kind === 'result') return;
      CF.ui.ghost = cur;
      slotSet(kind, i, null);
    } else {
      CF.ui.ghost = place(CF.ui.ghost, kind, i);
    }
    refresh();
  };

  function moveGhost(e) {
    if (!ghostEl) return;
    ghostEl.style.left = e.clientX + 8 + 'px';
    ghostEl.style.top = e.clientY + 8 + 'px';
  }
  window.addEventListener('mousemove', moveGhost);

  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyE') {
      CF.ui.open = !CF.ui.open;
      if (inv) inv.style.display = CF.ui.open ? 'block' : 'none';
      if (!CF.ui.open && CF.ui.ghost) { CF.give(CF.ui.ghost.name, CF.ui.ghost.count); CF.ui.ghost = null; }
      if (!CF.ui.open) for (let i = 0; i < 4; i++) if (CF.ui.craft[i]) { CF.give(CF.ui.craft[i].name, CF.ui.craft[i].count); CF.ui.craft[i] = null; }
      if (!CF.ui.open) CF.ui.container = null; // #032: closing kills container view (contents stay in BE)
      refresh();
    }
    if (e.code === 'Escape' && CF.ui.open) window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyE' }));
  });
  window.addEventListener('mouseup', (e) => { if (CF.blockPlaceAt && e.button === 1) { /* middle: reserved */ } });

  // #032: right-click block use (furnace opens its GUI instead of placing)
  CF.useBlock = (hit) => {
    if (!hit || !CF.blockEntities) return false;
    const k = hit.x + ',' + hit.y + ',' + hit.z;
    const f = CF.blockEntities[k];
    if (f && f.type === 'furnace') { CF.uiOpenContainer(k); return true; }
    return false;
  };
  CF.uiOpenContainer = (k) => {
    CF.ui.container = k;
    if (!CF.ui.open) { CF.ui.open = true; if (inv) inv.style.display = 'block'; }
    refresh();
  };
  CF.uiCloseContainer = (k) => { if (CF.ui.container === k) { CF.ui.container = null; refresh(); } };

  CF.uiRefresh = refresh;

// Survival mode (#026): health, hunger/saturation, fall damage, lava, drowning, respawn, HUD.
// Model per docs/REFERENCE.md §physics/hunger (1.12 simplified-exhaustion model).
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const S = CF.stats = { hp: 20, food: 20, sat: 5, air: 300, deaths: 0 };
  CF.survival = false; // creative default (documented deviation: F4 toggles)

  let peakY = null, hurtCd = 0, regenAcc = 0, starveAcc = 0;

  const hud = document.createElement('div');
  hud.id = 'surv';
  hud.style.cssText = 'position:fixed;bottom:56px;left:50%;transform:translateX(-50%);display:none;gap:0;z-index:21;font:13px monospace';
  hud.innerHTML = '<div id="hearts" style="display:flex;gap:1px"></div><div id="food" style="display:flex;gap:1px;margin-left:60%"></div>';
  (document.body ? Promise.resolve() : new Promise((r) => document.addEventListener('DOMContentLoaded', r))).then(() => document.body.appendChild(hud));

  const HEART = '#c03028', EMPTY = '#3a3a3a', FOODC = '#c88038', DRY = '#2e2e2e';
  function pip(el, n, max, colorFull, colorEmpty, half) {
    el.innerHTML = '';
    for (let i = 0; i < max; i++) {
      const d = document.createElement('div');
      const full = n >= (i + 1) * 2, halfNow = !full && n === i * 2 + 1;
      d.style.cssText = 'width:8px;height:12px;background:' + (full ? colorFull : halfNow ? colorFull : colorEmpty);
      if (halfNow) d.style.background = 'linear-gradient(90deg,' + colorFull + ' 50%,' + colorEmpty + ' 50%)';
      d.title = (full ? 2 : halfNow ? 1 : 0);
      el.appendChild(d);
    }
  }
  function hudRefresh() {
    const on = CF.survival;
    hud.style.display = on ? 'flex' : 'none';
    if (!on) return;
    pip(document.getElementById('hearts'), Math.max(0, Math.ceil(S.hp)), 10, HEART, EMPTY, true);
    pip(document.getElementById('food'), Math.max(0, Math.ceil(S.food)), 10, FOODC, DRY, false);
  }
  CF.survRefresh = hudRefresh;

  CF.canSprint = () => !CF.survival || S.food > 6;
  CF.damage = (n, why) => {
    if (!CF.survival || hurtCd > 0 && why !== 'fall') return;
    S.hp -= n;
    hurtCd = why === 'fall' ? 0 : 10; // 1.12: post-hurt no-damage window (0.5s) - #036
    if (why === 'drown') hurtCd = 20; // drown keeps its 1s rhythm (2 dmg/s)
    if (why) CF.lastHurt = why;
    if (S.hp <= 0) respawn();
  };
  function respawn() {
    S.deaths++;
    S.hp = 20; S.food = 20; S.sat = 5; S.air = 300;
    peakY = null; // stale fall-peaks must never damage across teleports (phantom-fall bug, #036)
    const P = CF.player;
    P.tp(P.spawn[0], P.spawn[1], P.spawn[2]);
    CF.lastDeathAt = CF.ticks;
  }

  CF.useHeld = () => {
    const held = CF.held && CF.held();
    if (!held) return false;
    const def = CF.ITEMS && CF.ITEMS[held];
    if (def && def.food && S.food < 20) {
      S.food = Math.min(20, S.food + def.food);
      S.sat = Math.min(S.food, S.sat + def.food * 0.5);
      CF.consume(held, 1);
      hudRefresh();
      return true;
    }
    return false;
  };

  const origOnTick = CF.onTick;
  CF.onTick = () => {
    if (origOnTick) origOnTick();
    const P = CF.player, W = CF.world;
    if (!P || !W) return;
    if (!P.spawn) P.spawn = P.pos.slice();
    if (hurtCd > 0) hurtCd--;

    // fall tracking
    if (P.onGround) {
      if (peakY !== null) {
        const dist = peakY - P.pos[1];
        S.lastFall = +dist.toFixed(2);
        if (dist > 3) {
          const inWater = W.get(Math.floor(P.pos[0]), Math.floor(P.pos[1] - 0.9), Math.floor(P.pos[2])) === CF.IDOF['water'];
          if (!inWater) CF.damage(Math.floor(dist - 3), 'fall');
        }
        peakY = null;
      }
    } else if (P.vel[1] < 0) {
      peakY = peakY === null ? P.pos[1] : Math.max(peakY, P.pos[1]);
    }

    if (!CF.survival) return;

    // exhaustion -> hunger
    const i = P.input;
    let ex = 0;
    if (P.onGround && (i.f || i.s || i.l || i.r)) ex = i.sprint && CF.canSprint() ? 0.08 : 0.01;
    if (i.jump && P.onGround) ex += 0.1;
    if (CF.mining) ex += 0.02;
    if (ex > 0) {
      S.sat -= ex;
      if (S.sat < 0) { S.food = Math.max(0, S.food + S.sat); S.sat = 0; }
    }

    // starvation
    if (S.food <= 0 && S.sat <= 0) {
      starveAcc++;
      if (starveAcc >= 80) { starveAcc = 0; if (S.hp > 1) CF.damage(1, 'starve'); }
    } else starveAcc = 0;

    // regeneration
    if (S.food >= 18 && S.sat > 0 && S.hp < 20) {
      regenAcc++;
      const rate = S.food >= 20 ? 40 : 80;
      if (regenAcc >= rate) { regenAcc = 0; S.hp = Math.min(20, S.hp + 1); S.sat = Math.max(0, S.sat - 1.5); }
    } else regenAcc = 0;

    // lava contact (body cells)
    const fx = Math.floor(P.pos[0]), fz = Math.floor(P.pos[2]);
    const fy1 = Math.floor(P.pos[1] - 0.8), fy2 = Math.floor(P.pos[1] + 0.8);
    if (W.get(fx, fy1, fz) === CF.IDOF['lava'] || W.get(fx, fy2, fz) === CF.IDOF['lava']) CF.damage(1, 'lava');

    // drowning (head in water)
    const head = W.get(fx, Math.floor(P.pos[1] + 0.72), fz) === CF.IDOF['water'];
    if (head) {
      S.air--;
      if (S.air <= 0) { S.air = 0; if (hurtCd <= 0) CF.damage(2, 'drown'); }
    } else if (S.air < 300) S.air = Math.min(300, S.air + 10);

    // void death
    if (P.pos[1] < -10) { S.hp = 0; respawn(); }

    hudRefresh();
  };

  window.addEventListener('keydown', (e) => {
    if (e.code === 'F4') {
      CF.survival = !CF.survival;
      if (CF.survival) { S.hp = 20; S.food = 20; S.sat = 5; }
      hudRefresh();
    }
  });
  CF.shotScenarios = CF.shotScenarios || {};
  CF.shotScenarios['hud-low'] = async () => {
    CF.freeCam = false;
    const P = CF.player, W = CF.world;
    W.ensureAround(30, 30, 2);
    for (let i = 0; i < 30 && W.stats().queue; i++) W.tick();
    P.tp(30.5, W.heightAt(30, 30) + 3, 30.5);
    P.yaw = 0.9; P.pitch = -0.15;
    CF.survival = true; S.hp = 7; S.food = 6; S.sat = 1; S.air = 240;
    for (let i = 0; i < 40; i++) { CF.playerTick(); CF.renderTick(); await new Promise((x) => setTimeout(x, 30)); }
    hudRefresh();
    CF.renderDraw(CF.camera);
    await new Promise((x) => setTimeout(x, 200));
  };
  setInterval(hudRefresh, 500);

  // ---- tests
  CF.survivalTests = async (r) => {
    const P = CF.player, W = CF.world;
    CF.survival = true; S.hp = 20; S.food = 20; S.sat = 5;
    W.ensureAround(P.spawn ? P.spawn[0] : 8, 8, 2);
    const gx = 100, gz = 100;
    W.ensureAround(gx, gz, 1);
    for (let i = 0; i < 10 && W.stats().queue; i++) W.tick();
    let gxx = gx, gzz = gz, found = false;
    for (let tries = 0; tries < 40 && !found; tries++) {
      const cx3 = gx + (tries % 8) * 3 - 9, cz3 = gz + Math.floor(tries / 8) * 3 - 6;
      const hh3 = W.heightAt(cx3, cz3);
      let clear = true;
      for (let y = hh3 + 1; y <= hh3 + 14; y++) if (W.get(cx3, y, cz3) || W.get(cx3 + 1, y, cz3) || W.get(cx3 - 1, y, cz3)) { clear = false; break; }
      if (clear) { gxx = cx3; gzz = cz3; found = true; }
    }
    CF.assert(r, 'surv.clear-spot', found === true);
    const gh = W.heightAt(gxx, gzz);
    // fall 10 blocks -> 7 dmg
    P.spawn = [gxx + 0.5, gh + 1, gzz + 0.5];
    P.tp(gxx + 0.5, gh + 12, gzz + 0.5);
    S.hp = 20; hurtCd = 0; peakY = null; P.onGround = false;
    for (let t = 0; t < 90; t++) { CF.playerTick(); CF.onTick(); if (P.onGround && t > 3) break; }
    // 1.12 formula floor(d-3): discrete sim peak-logging costs +/-1-2 blocks -> range assert (documented)
    CF.assert(r, 'surv.fall10(' + S.hp + ',f=' + S.lastFall + ')', S.hp >= 11 && S.hp <= 14 && P.onGround);
    // fall 3 blocks -> 0 dmg
    P.tp(gxx + 0.5, gh + 5, gzz + 0.5);
    S.hp = 20; hurtCd = 0; peakY = null; P.onGround = false;
    for (let t = 0; t < 90; t++) { CF.playerTick(); CF.onTick(); if (P.onGround && t > 3) break; }
    CF.assert(r, 'surv.fall3(' + S.hp + ')', S.hp === 20);
    // sprint gate
    S.food = 6;
    CF.assert(r, 'surv.sprint-gate', CF.canSprint() === false);
    S.food = 10;
    CF.assert(r, 'surv.sprint-ok', CF.canSprint() === true);
    // starvation floors at 1 hp
    S.food = 0; S.sat = 0; S.hp = 6; hurtCd = 0; starveAcc = 0;
    for (let t = 0; t < 2000; t++) CF.onTick();
    CF.assert(r, 'surv.starve-floor(' + S.hp + ')', S.hp === 1);
    // eating apple
    S.food = 10; S.sat = 0;
    CF.inv.fill(null); CF.give('apple', 1); CF.sel = 0;
    CF.useHeld();
    CF.assert(r, 'surv.eat(' + S.food + ')', S.food === 14 && CF.countItem('apple') === 0);
    // regen: full food heals
    S.food = 20; S.sat = 5; S.hp = 10; regenAcc = 0;
    for (let t = 0; t < 200; t++) CF.onTick();
    CF.assert(r, 'surv.regen(' + S.hp + ')', S.hp > 10);
    // death + respawn via void
    S.hp = 20; const d0 = S.deaths;
    P.tp(0, -30, 0);
    CF.onTick();
    CF.assert(r, 'surv.respawn(' + S.hp + ',' + S.deaths + ')', S.deaths === d0 + 1 && S.hp === 20 && P.pos[1] > -5);
    // HUD
    hudRefresh();
    CF.assert(r, 'surv.hud', document.getElementById('hearts').children.length === 10 && hud.style.display === 'flex');
    CF.survival = false; hudRefresh();
  };
})();

// localStorage save/load, schema v1 (SPK-5): RLE edited-chunks + player + time.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const KEY = 'cf-save-1';

  function rleEncode(arr) {
    const out = [];
    let cur = arr[0], len = 1;
    for (let i = 1; i < arr.length; i++) {
      if (arr[i] === cur && len < 255) len++;
      else { out.push(cur, len); cur = arr[i]; len = 1; }
    }
    out.push(cur, len);
    return new Uint8Array(out);
  }
  function rleDecode(bytes, size) {
    const arr = new Uint8Array(size);
    let p = 0;
    for (let i = 0; i < bytes.length; i += 2) {
      const id = bytes[i], len = bytes[i + 1];
      for (let k = 0; k < len && p < size; k++) arr[p++] = id;
    }
    return arr;
  }
  CF.rleEncode = rleEncode; CF.rleDecode = rleDecode;

  const b64e = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
  const b64d = (s) => { const bin = atob(s), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8; };

  function initEditTracking(w) {
    if (w._tracked) return;
    w._tracked = true;
    w.edited = new Set();
    const orig = w.set;
    w.set = function (x, y, z, id) {
      const r = orig(x, y, z, id);
      if (r) w.edited.add(Math.floor(x / 16) + ',' + Math.floor(z / 16));
      return r;
    };
  }

  function saveNow() {
    const w = CF.world;
    if (!w) return null;
    initEditTracking(w);
    const save = { v: 1, seed: w.seed, time: CF.ticks, player: CF.player ? {
      pos: CF.player.pos.map((v) => +v.toFixed(2)), yaw: CF.player.yaw, pitch: CF.player.pitch, sel: CF.sel } : null,
      chunks: {} };
    let bytes = 0;
    const keys = [...w.edited];
    keys.sort((a, b) => { // far chunks saved last so eviction drops them first
      const [ax, az] = a.split(',').map(Number), [bx, bz] = b.split(',').map(Number);
      return Math.hypot(bx * 16, bz * 16) - Math.hypot(ax * 16, az * 16);
    });
    for (const k of keys) {
      const c = w.chunks.get(k);
      if (!c) continue;
      const enc = rleEncode(c.arr);
      save.chunks[k] = b64e(enc);
      bytes += save.chunks[k].length;
    }
    let warn = null;
    for (;;) {
      try { localStorage.setItem(KEY, JSON.stringify(save)); break; }
      catch (e) {
        const ks = Object.keys(save.chunks);
        if (!ks.length) { warn = 'quota: nothing left'; break; }
        delete save.chunks[ks[ks.length - 1]]; // evict farthest
        warn = 'quota: evicted far edited chunk';
      }
    }
    CF.saveInfo = { bytes: JSON.stringify(save).length, chunks: Object.keys(save.chunks).length, warn };
    return CF.saveInfo;
  }

  function loadNow() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return false; }
    if (!raw) return false;
    loadNow._raw = String(raw).slice(0, 12);
    let save = null;
    try { save = JSON.parse(raw); } catch (e) { loadNow._rej = 'parse'; localStorage.removeItem(KEY); return false; }
    if (!save || save.v !== 1) { loadNow._rej = 'ver'; localStorage.removeItem(KEY); return false; }
    CF.world = CF.makeWorld(save.seed);
    CF.renderReset && CF.renderReset();
    CF.mobs && CF.mobs.clear(); // mobs are transient (persistence = backlog #044)
    if (CF.tnts) CF.tnts.length = 0; // primed TNT not persisted either
    initEditTracking(CF.world);
    for (const [k, b] of Object.entries(save.chunks || {})) {
      const [cx, cz] = k.split(',').map(Number);
      CF.world.generate(cx, cz);
      const c = CF.world.chunks.get(k);
      if (c) { c.arr.set(rleDecode(b64d(b), c.arr.length)); CF.world.edited.add(k); CF.world.dirty.add(k); }
    }
    if (save.player && CF.player) {
      CF.player.tp(...save.player.pos);
      CF.player.yaw = save.player.yaw; CF.player.pitch = save.player.pitch;
      CF.sel = save.player.sel || 0;
    }
    CF.ticks = save.time || 0;
    CF.loaded = true;
    return true;
  }

  CF.saveNow = saveNow;
  CF.loadNow = loadNow;
  if (CF.world) initEditTracking(CF.world);

  setInterval(() => { if (CF.world && CF.player && CF.ticks > 10 && !CF.autosavePaused) saveNow(); }, 10000);
  window.addEventListener('beforeunload', () => saveNow());
  if (location.search.includes('new=1')) { try { localStorage.removeItem(KEY); } catch (e) {} }
  else if (CF.world) { setTimeout(() => loadNow(), 0); } // auto-load if a save exists (fresh profiles: no-op)

  CF.persistTests = async (r) => {
    const W = CF.world;
    // RLE unit
    const sample = new Uint8Array(400); sample.fill(3); sample[100] = 1; sample[399] = 5;
    const back = rleDecode(rleEncode(sample), 400);
    CF.assert(r, 'save.rle-unit', back.every((v, i) => v === sample[i]));
    // world edit + tower, save, reload
    W.ensureAround(8, 8, 3);
    for (let i = 0; i < 20 && W.stats().queue; i++) W.tick();
    const tx = 8, tz = 8, th = W.heightAt(tx, tz);

  // --- #038 passive AI: idle wander + flee-when-hurt + grow up; breeding handled in M.breedScan
  function aiPassive(m, T, P) {

  // --- player melee: 1.12 charge meter + attack-over-mining priority + knockback
  document.addEventListener('mousedown', (e) => { if (e.button === 0) CF._freshClick = true; }, true);

  // --- arrow projectiles (skeleton). Ballistic w/ predictive aim so they actually threaten.

  function fireArrow(m, T, P) {

  // ============================ per-tick: physics, AI, burn, spawn ============================

  // --- render feed: world-space boxes, vertex layout matches chunk stream (pos3 + uv/shade + light)

/* ==== src/explode.js ==== */
// Explosion (#037 creeper / #042 TNT): 1.12.2 ray-marched block destruction + entity damage.
// Algorithm per docs/REFERENCE + wiki: 16^3 rays from centre, intensity = power*rand(0.7..1.3),
// march 0.3/step, subtract (blastRes+0.3)*0.3 per solid crossed and 0.22500001 after; destroy if >0.
// Entity: impact=(1-dist/(2*power))*exposure; damage=((impact^2+impact)/2)*(7*2*power)+1 (NORMAL, no scaling).
// Block-drop-as-item (prob 1/power) deferred to item-entities (#044); we do destruction (mobGriefing on).
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  // 1.12.2 blast resistance by name (default 2.0). obsidian/bedrock effectively indestructible.
  const BLAST = {
    bedrock: 3600, obsidian: 1200, enchanting_table: 1200, anvil: 1200, mob_spawner: 1200,
    stone: 6, cobblestone: 6, mossy_cobblestone: 6, brick_block: 6, stonebrick: 6, planks: 3,
    log: 4, crafting_table: 2.5, furnace: 3.5, coal_ore: 3, iron_ore: 3, gold_ore: 3, diamond_ore: 3,
    emerald_ore: 3, lapis_ore: 3, redstone_ore: 3, quartz_ore: 3,
    dirt: 0.5, grass: 0.6, sand: 0.5, gravel: 0.6, clay: 0.6, sandstone: 0.8, snow: 0.2, snow_layer: 0.2,
    glass: 0.3, glowstone: 0.3, leaves: 0.2, torch: 0, bookshelf: 1.5, tnt: 0,
  };
  CF.blastRes = (id) => { const b = CF.BY_ID[id]; const raw = b ? (BLAST[b.name] != null ? BLAST[b.name] : 2.0) : 0; return raw / 5; }; // MC divides explosionResistance by 5 (stone 6->1.2, obsidian 1200->240)

  function exposure(x, y, z, ex, ey, ez) { // fraction of sampled path points that are non-solid
    let clear = 0, n = 6;
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 1);
      const id = CF.world.get(Math.floor(x + (ex - x) * t), Math.floor(y + (ey - y) * t), Math.floor(z + (ez - z) * t));
      if (!CF.solidAt(id)) clear++;
    }
    return clear / n;
  }

  CF.explode = (x, y, z, power) => {
    const W = CF.world, destroyed = new Set();
    for (let rx = 0; rx < 16; rx++) for (let ry = 0; ry < 16; ry++) for (let rz = 0; rz < 16; rz++) {
      let dx = rx / 15 * 2 - 1, dy = ry / 15 * 2 - 1, dz = rz / 15 * 2 - 1;
      const len = Math.hypot(dx, dy, dz) || 1; dx /= len; dy /= len; dz /= len;
      let intensity = power * (0.7 + Math.random() * 0.6);
      for (let d = 0; d < power * 2 && intensity > 0; d += 0.3) {
        const bx = Math.floor(x + dx * d), by = Math.floor(y + dy * d), bz = Math.floor(z + dz * d);
        const id = W.get(bx, by, bz);
        if (id) {
          const res = CF.blastRes(id);
          intensity -= (res + 0.3) * 0.3;
          if (intensity > 0) destroyed.add(bx + ',' + by + ',' + bz);
          intensity -= 0.22500001;
        }
      }
    }
    for (const k of destroyed) { const [bx, by, bz] = k.split(',').map(Number); if (W.get(bx, by, bz)) W.set(bx, by, bz, 0); }
    // entity damage: players + mobs
    const hurt = (pos, isPlayer) => {
      const dist = Math.hypot(pos[0] - x, pos[1] - y, pos[2] - z);
      if (dist > power * 2) return 0;
      const impact = (1 - dist / (2 * power)) * exposure(x, y, z, pos[0], pos[1], pos[2]);
      if (impact <= 0) return 0;
      const dmg = ((impact * impact + impact) / 2) * (7 * 2 * power) + 1;
      return Math.round(dmg * 10) / 10;
    };
    const result = { destroyed: destroyed.size, playerDmg: 0 };
    if (CF.player && CF.survival !== undefined) {
      const pd = hurt(CF.player.pos, true);
      if (pd > 0) { result.playerDmg = pd; CF.damage(pd, 'explosion'); }
    }
    if (CF.mobs) for (const m of CF.mobs.list.slice()) {
      const md = hurt(m.pos, false);
      if (md > 0 && CF.mobs.hurt) CF.mobs.hurt(m, md, 'explosion');
    }
    CF.shake = 18; // render/camera shake counter (#037+ polish)
    return result;
  };
})();

// TNT (#042): craft, place, prime with flint & steel, 80-tick fuse, chain reaction, power-4 explosion.
// Reuses CF.explode (src/explode.js, #037). Block tile is runtime-drawn (functional:false -> not parity-counted).
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const meta = (window.__TEXMETA = window.__TEXMETA || {});
  if (!meta.tnt_side) meta.tnt_side = { x: 32, y: 48, w: 16, h: 16, src: 'generated:tnt.js' }; // free atlas cell
  if (!meta.tnt_top) meta.tnt_top = { x: 48, y: 48, w: 16, h: 16, src: 'generated:tnt.js' };

  CF.FUSE = 80; // 1.12.2: tnt fuse = 4s = 80 game ticks
  CF.tnts = CF.tnts || [];
  CF.primeTNT = (x, y, z, fuse) => { // turn a placed TNT block into a primed entity (returns bool)
    if (CF.world.get(x, y, z) !== CF.IDOF['tnt']) return false;
    CF.world.set(x, y, z, 0);
    CF.tnts.push({ pos: [x + 0.5, y + 0.5, z + 0.5], fuse: fuse == null ? CF.FUSE : fuse });
    return true;
  };
  CF.tntTick = () => {
    for (let i = CF.tnts.length - 1; i >= 0; i--) {
      const t = CF.tnts[i];
      if (--t.fuse > 0) continue;
      CF.tnts.splice(i, 1);
      const power = 4; // 1.12.2 tnt explosion power
      if (CF.explode) CF.explode(t.pos[0], t.pos[1], t.pos[2], power);
      // chain reaction (1.12): nearby un-primed TNT blocks caught by the blast get primed
      const bx = Math.floor(t.pos[0]), by = Math.floor(t.pos[1]), bz = Math.floor(t.pos[2]), R = Math.ceil(power * 1.5);
      for (let dx = -R; dx <= R; dx++) for (let dy = -R; dy <= R; dy++) for (let dz = -R; dz <= R; dz++) {
        if (dx * dx + dy * dy + dz * dz > R * R) continue;
        if (CF.world.get(bx + dx, by + dy, bz + dz) === CF.IDOF['tnt']) CF.primeTNT(bx + dx, by + dy, bz + dz, 10 + Math.floor(Math.random() * 15));
      }
    }
  };
  CF.useFlintSteel = (hit) => { // RMB a placed TNT block while holding flint & steel -> prime
    if (!hit) return false;
    const held = CF.held && CF.held();
    if (held !== 'flint_and_steel') return false;
    return CF.primeTNT(hit.x, hit.y, hit.z);
  };

  // --- shot: primed, flashing TNT among a cluster (frozen mid-fuse)
  CF.shotScenarios = CF.shotScenarios || {};
  CF.shotScenarios['tnt-fuse'] = async () => {
    CF.freeCam = true; CF.timeOffset = 600;
    const W = CF.world;
    const bx = 280, by = 100, bz = 100;
    W.ensureAround(bx, bz, 1); for (let i = 0; i < 40 && W.stats().queue; i++) W.tick();
    for (let x = bx - 5; x <= bx + 5; x++) for (let z = bz - 5; z <= bz + 5; z++) for (let y = by - 3; y <= by; y++) W.set(x, y, z, W.get(x, y, z) === CF.IDOF['bedrock'] ? CF.IDOF['bedrock'] : (y === by ? CF.IDOF['stone'] : (CF.IDOF['dirt'])));
    for (let i = 0; i < 10; i++) W.tick();
    CF.tnts.length = 0;
    W.set(bx + 1, by + 1, bz, CF.IDOF['tnt']); W.set(bx + 2, by + 1, bz, CF.IDOF['tnt']);
    CF.primeTNT(bx, by + 1, bz, 14); // mid-fuse -> flashing
    CF.tntTick = () => {};
    for (let i = 0; i < 40; i++) CF.renderTick();
    CF.camera = { pos: [bx - 4, by + 3.2, bz], yaw: Math.PI / 2, pitch: -0.12 };
    CF.ticks |= 1; // force the white-flash parity frame (render flashes primed TNT on odd ticks)
    CF.renderDraw(CF.camera); await new Promise((res) => setTimeout(res, 150));
    CF.ticks |= 1;
    CF.shotExtra = { tnts: CF.tnts.length, fuse: CF.tnts[0] && CF.tnts[0].fuse };
    CF.renderDraw(CF.camera);
  };

  // --- test suite
  CF.tntTests = async (r) => {
    const W = CF.world, ID = CF.IDOF;
    CF.survival = false;
    // craft recipes (3x3 tnt needs the tryCraft path; the 2x2 hand grid can't reach it -> crafting-table GUI is a gap)
    const gun = { name: 'gunpowder' }, sand = { name: 'sand' };
    const tc = CF.tryCraft([gun, sand, gun, sand, gun, sand, gun, sand, gun], 3);
    CF.assert(r, 'tnt.craft(' + (tc && tc.out.name) + ')', tc && tc.out.name === 'tnt');
    const fs = CF.tryCraft([{ name: 'iron_ingot' }, null, { name: 'flint' }, null], 2);
    CF.assert(r, 'tnt.flintsteel(' + (fs && fs.out.name) + ')', fs && fs.out.name === 'flint_and_steel');

    // place + prime via flint&steel + fuse + crater
    const bx = 280, by = 100, bz = 100;
    W.ensureAround(bx, bz, 1); for (let i = 0; i < 20 && W.stats().queue; i++) W.tick();
    for (let x = bx - 4; x <= bx + 4; x++) for (let z = bz - 4; z <= bz + 4; z++) for (let y = by - 3; y <= by; y++) W.set(x, y, z, ID['stone']);
    CF.tnts.length = 0;
    W.set(bx, by + 1, bz, ID['tnt']);
    CF.inv.fill(null); CF.give('flint_and_steel', 1); CF.sel = 0;
    const primed = CF.useFlintSteel({ x: bx, y: by + 1, z: bz });
    CF.assert(r, 'tnt.prime(' + primed + ',block=' + W.get(bx, by + 1, bz) + ')', primed === true && CF.tnts.length === 1 && W.get(bx, by + 1, bz) === 0);
    for (let i = 0; i < CF.FUSE + 2; i++) CF.tntTick();
    let crater = 0; for (let x = bx - 3; x <= bx + 3; x++) for (let z = bz - 3; z <= bz + 3; z++) if (W.get(x, by, z) === 0) crater++;
    CF.assert(r, 'tnt.boom(crater=' + crater + ',tnts=' + CF.tnts.length + ')', CF.tnts.length === 0 && crater > 6);

    // chain: two tnt 2 apart; prime one -> other no longer survives as an intact block (primed-then-boomed)
    for (let x = bx - 4; x <= bx + 4; x++) for (let z = bz - 4; z <= bz + 4; z++) for (let y = by - 3; y <= by + 1; y++) W.set(x, y, z, ID['stone']);
    W.set(bx, by + 1, bz, ID['tnt']); W.set(bx + 2, by + 1, bz, ID['tnt']);
    CF.tnts.length = 0; CF.primeTNT(bx, by + 1, bz, 5);
    for (let i = 0; i < CF.FUSE + 40; i++) CF.tntTick();
    CF.assert(r, 'tnt.chain(left=' + W.get(bx + 2, by + 1, bz) + ',tnts=' + CF.tnts.length + ')', W.get(bx, by + 1, bz) === 0 && W.get(bx + 2, by + 1, bz) === 0 && CF.tnts.length === 0);
    // bedrock resists (blastRes 1200): a tnt sitting on bedrock leaves the bedrock intact
    for (let x = bx - 4; x <= bx + 4; x++) for (let z = bz - 4; z <= bz + 4; z++) for (let y = by - 3; y <= by; y++) W.set(x, y, z, ID['stone']);
    W.set(bx, by, bz, ID['bedrock']); W.set(bx, by + 1, bz, ID['tnt']); CF.tnts.length = 0;
    CF.primeTNT(bx, by + 1, bz, 3); for (let i = 0; i < CF.FUSE + 5; i++) CF.tntTick();
    CF.assert(r, 'tnt.bedrock-survives', W.get(bx, by, bz) === ID['bedrock']);
    for (let x = bx - 4; x <= bx + 4; x++) for (let z = bz - 4; z <= bz + 4; z++) for (let y = by - 3; y <= by + 2; y++) W.set(x, y, z, 0);
    CF.tnts.length = 0;
  };
})();

// Cubeforge boot: WebGL2 canvas + fixed 20 UPS tick loop.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  CF.errors = [];
  CF.ticks = 0;
  CF.ready = false;
  const origErr = console.error;
  console.error = function () { CF.errors.push(Array.from(arguments).map(String).join(' ')); origErr.apply(console, arguments); };
  window.addEventListener('error', (e) => CF.errors.push(String(e.message)));

  function init() {
    const canvas = document.getElementById('gl');
    const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
    if (!gl) { CF.errors.push('WebGL2 unavailable'); document.title = 'FATAL: no webgl2'; return; }
    CF.gl = gl; CF.canvas = canvas;
    function resize() {
      const w = canvas.clientWidth * devicePixelRatio, h = canvas.clientHeight * devicePixelRatio;
      if (canvas.width !== w | 0 || canvas.height !== h | 0) { canvas.width = w | 0; canvas.height = h | 0; }
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    CF.resize = resize;
    window.addEventListener('resize', resize);
    resize();
    gl.clearColor(0.6, 0.75, 1.0, 1); // sky placeholder until SPK-1 sky pass
    CF.ready = true;
    // Fixed-timestep SIM on setInterval (deterministic, works in headless virtual time);
    // RENDER on rAF. Sim never depends on rAF firing.
    const loopId = setInterval(() => {
      const t0 = performance.now();
      if (CF.world) {
        const p = CF.player;
        CF.world.ensureAround(p ? p.pos[0] : 0, p ? p.pos[2] : 0, 4);
        CF.world.tick();
        CF.playerTick && CF.playerTick();
        CF.mobTick && CF.mobTick(); // #035 entities (spawn scheduler is survival-gated)
        CF.tntTick && CF.tntTick(); // #042 primed TNT fuses + chain + explode
      }
      CF.renderTick && CF.renderTick();
      CF.onTick && CF.onTick();
      if (CF.renderDraw) CF.renderDraw(CF.camera || { pos: [8, CF.world ? CF.world.heightAt(0, 0) + 26 : 90, 8], yaw: 0.7, pitch: -0.9 });
      CF.simMs = performance.now() - t0;
      CF.ticks++;
    }, 50);
    CF.stopGameLoop = () => { clearInterval(loopId); CF.stopDraw = true; };
    function frame() {
      if (CF.stopDraw) return;
      if (CF.renderDraw) {
        CF.renderDraw(CF.camera || { pos: [8, CF.world ? CF.world.heightAt(0, 0) + 26 : 90, 8], yaw: 0.7, pitch: -0.9 });
      } else {
        gl.clearColor(0.6, 0.75, 1.0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    CF.initRenderer && CF.initRenderer(gl);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
