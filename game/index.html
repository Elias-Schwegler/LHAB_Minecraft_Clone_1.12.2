  // CF.boxesOf(flat bits) - slab halves, stair base+step). Movement tests box-vs-box, not cell spans.

    if (!v.boxes) return [[fx, fy, fz, fx + 1, fy + 1, fz + 1]];
    const fm = CF.world.flatAt ? CF.world.flatAt(fx, fy, fz) : 0;
    return CF.boxesOf(v, fm).map((b) => [fx + b[0], fy + b[1], fz + b[2], fx + b[3], fy + b[4], fz + b[5]]);
  }
  // [yLo,yHi] span of geometry in cell (x,y,z) that overlaps the footprint circle (px,hw,pz); legacy
  // full-cell min/max span when footprint omitted. null = nothing solid.
  function cellTopAt(x, y, z, px, hw, pz) {
    const bs = cellBoxesAbs(Math.floor(x), Math.floor(y), Math.floor(z));
    if (!bs) return null;
    let lo = Infinity, hi = -Infinity;
    for (const b of bs) {
      if (px !== undefined && !(b[0] < px + hw && b[3] > px - hw && b[2] < pz + hw && b[5] > pz - hw)) continue;

      for (let z = Math.floor(pz - hw); z <= Math.floor(pz + hw); z++)
        for (let y = Math.floor(lo); y <= Math.floor(hi - 0.001); y++) {

  CF.sel = 0;
  CF.drops = [];

  CF.hotId = () => {

    if (h.indexOf(':') > 0) { // #052: variant items ('stone_slab:cobblestone')
      const p2 = h.split(':');
      const r2 = CF.REGISTRY[p2[0]];
      if (r2 && r2.variants[p2[1]]) return r2.variants[p2[1]].id;
      return 0;
    }
    const reg = CF.REGISTRY[h];
    if (!reg) return 0;
    const k = Object.keys(reg.variants)[0];
    return reg.variants[k].id;
  };

  function raycast(o, d, maxD) {
    let x = Math.floor(o[0]), y = Math.floor(o[1]), z = Math.floor(o[2]);
    const sx = d[0] > 0 ? 1 : -1, sy = d[1] > 0 ? 1 : -1, sz = d[2] > 0 ? 1 : -1;
    const dx = Math.abs(1 / (d[0] || 1e-9)), dy = Math.abs(1 / (d[1] || 1e-9)), dz = Math.abs(1 / (d[2] || 1e-9));
    let tx = ((sx > 0 ? x + 1 - o[0] : o[0] - x)) * dx;
    let ty = ((sy > 0 ? y + 1 - o[1] : o[1] - y)) * dy;
    let tz = ((sz > 0 ? z + 1 - o[2] : o[2] - z)) * dz;
    let t = 0, face = [0, 0, 0];
    for (let i = 0; i < 120; i++) {
      if (CF.solidAt(CF.world.get(x, y, z))) return { x, y, z, face };
      if (tx < ty && tx < tz) { x += sx; t = tx; tx += dx; face = [-sx, 0, 0]; }
      else if (ty < tz) { y += sy; t = ty; ty += dy; face = [0, -sy, 0]; }
      else { z += sz; t = tz; tz += dz; face = [0, 0, -sz]; }

  CF.aim = () => {

      }

  CF.cellHitsPlayer = (tx, ty, tz) => { // #043 shared placement rule (place + bucket)

  CF.dropHeld = () => {

  CF.itemTick = () => {
    const P = CF.player, W = CF.world, dt = 0.05;
    for (let i = CF.itemEnts.length - 1; i >= 0; i--) {
      const it = CF.itemEnts[i];
      if (++it.age > 6000) { CF.itemEnts.splice(i, 1); continue; } // 5-min despawn (1.12)

    gold_ingot: { tile: 'item_gold_ingot' },
    diamond: { tile: 'item_diamond' },
    apple: { tile: 'item_apple', food: 4 },
    rotten_flesh: { food: 4, poison: true }, // 1.12: +4 food, 80% poison II 4s (poison effect lands with #036 combat)
    sapling: { tile: 'item_sapling' },
    flint: { tile: 'item_flint' },
    shears: { tile: 'item_shears', tool: { type: 'shears', tier: 0, speed: 1 }, stack: 1 },
    flint_and_steel: { stack: 1 }, // #042 igniter (durability ignored in Tier-1)
    // #043 buckets (1.12: stack 1; fetch liquid SOURCES only; placing creates a new source)
    bucket: { tile: 'item_bucket', stack: 1 },
    water_bucket: { tile: 'item_water_bucket', stack: 1 },
    lava_bucket: { tile: 'item_lava_bucket', stack: 1 },
    // mob drops + passive products (#037/#038). No atlas tiles yet -> blank icons (tracked #044); counts/logic tested.
    bone: {}, arrow: {}, gunpowder: {}, string: {}, feather: {}, leather: {}, ink_sac: {},
    egg: {}, wheat: { tile: 'item_wheat' }, carrot: { tile: 'item_carrot', food: 3 }, potato: { tile: 'item_potato', food: 1 }, wheat_seeds: { tile: 'item_wheat_seeds' }, bread: { tile: 'item_bread', food: 5 }, // #054 farm icons landed (blank-icons era over)
    raw_porkchop: { food: 3 }, cooked_porkchop: { food: 8 },
    raw_beef: { food: 3 }, steak: { food: 8 },
    mutton: { food: 2 }, cooked_mutton: { food: 6 },
    raw_chicken: { food: 2, poison: 0.3 }, cooked_chicken: { food: 6 },
    wool: {}, // superseded by the wool BLOCK family (#050) - bare item kept for sheep drop compat
    clay_ball: {}, brick: {}, // #051 chain items (icons -> #048)
    quartz: { tile: 'item_quartz' }, // #056 nether quartz (quartz_ore drop; smelting->quartz_block = #048/later)
  };
  for (const [mat, info] of Object.entries(TOOLS))
    for (const shape of ['pickaxe', 'axe', 'shovel', 'sword', 'hoe'])
      CF.ITEMS[mat + '_' + shape] = { tile: 'item_' + mat + '_' + shape, tool: { type: shape, tier: info.tier, speed: info.speed }, stack: 1 };

  CF.itemDef = (name) => {
    if (CF.ITEMS[name]) return CF.ITEMS[name];
    let reg = CF.REGISTRY[name], vk = null;
    if (name.indexOf(':') > 0) { const p = name.split(':'); reg = CF.REGISTRY[p[0]]; vk = p[1]; } // #049: variant items ('log:birch')
    if (reg) { const k = vk || Object.keys(reg.variants)[0]; return { tile: reg.variants[k].tiles[0], block: true }; }
    return null;
  };

  // ---- inventory (36 slots: 0-8 hotbar)
  CF.inv = new Array(36).fill(null);
  CF.give = (name, n = 1) => {
    const max = (CF.itemDef(name) || {}).stack || STACK; // 1.12: tools/buckets = 1 (others 64)
    let left = n;
    for (let i = 0; i < 36 && left > 0; i++) {
      const s = CF.inv[i];
      if (s && s.name === name && s.count < max) { const add = Math.min(max - s.count, left); s.count += add; left -= add; }
    }
    for (let i = 0; i < 36 && left > 0; i++) if (!CF.inv[i]) { const add = Math.min(max, left); CF.inv[i] = { name, count: add }; left -= add; }
    return left; // leftover (inv full)
  };
  CF.countItem = (name) => CF.inv.reduce((s, it) => s + (it && it.name === name ? it.count : 0), 0);
  CF.consume = (name, n = 1) => {
    if (CF.countItem(name) < n) return false;
    let left = n;
    for (let i = 0; i < 36 && left > 0; i++) {
      const s = CF.inv[i];
      if (s && s.name === name) { const t = Math.min(s.count, left); s.count -= t; left -= t; if (!s.count) CF.inv[i] = null; }
    }
    return true;
  };
  CF.held = () => CF.inv[CF.sel] && CF.inv[CF.sel].name;
  CF.heldDef = () => { const h = CF.held(); return h ? CF.itemDef(h) : null; };

  // ---- break-time with held tool (model documented in REFERENCE §tool tiers)
  CF.canHarvest = (blockV, heldName) => {
    if (!blockV.tool) return true;
    const d = heldName && CF.ITEMS[heldName];
    if (!d || !d.tool) return false;
    return d.tool.type === blockV.tool && d.tool.tier >= (blockV.minTier || 0);
  };
  CF.breakTimeFor = (blockV, heldName) => {
    if (blockV.hardness < 0) return Infinity;
    const d = heldName && CF.ITEMS[heldName];
    if (CF.canHarvest(blockV, heldName)) {
      const speed = d && d.tool ? d.tool.speed : 1;
      return blockV.hardness * 1.5 / speed;
    }
    return blockV.hardness * 5;
  };

  // ---- crafting: shaped (1.12 patterns) + shapeless; grid = array of size*size {name}|null
  const P = (rows, key, out, n) => ({ rows, key, out: { name: out, n } });
  CF.RECIPES = [
    { shapeless: { log: 1 }, out: { name: 'planks', n: 4 } },
    P(['p', 'p'], { p: 'planks' }, 'stick', 4),
    P(['pp', 'pp'], { p: 'planks' }, 'crafting_table', 1),
    P(['ccc', 'c c', 'ccc'], { c: 'cobblestone' }, 'furnace', 1),
    P(['ccc', 'c c', 'ccc'], { c: 'planks' }, 'chest', 1),
    P(['c', 's'], { c: 'coal', s: 'stick' }, 'torch', 4),
    P(['mmm', ' s ', ' s '], null, 'pickaxe', 4), // materials expanded below
    P(['mm', 'ms', ' s'], null, 'axe', 4),
    P(['m', 's', 's'], null, 'shovel', 4),
    P(['m', 'm', 's'], null, 'sword', 4),
    P([' i', 'i '], { i: 'iron_ingot' }, 'shears', 1),
    P(['www', 'ppp'], { w: 'wool', p: 'planks' }, 'bed', 1), // #041 (1.12: any colours; single white simplification)
    // #042 TNT (1.12: 5 gunpowder + 4 sand) + flint & steel (1.12: iron ingot + flint)
    P(['gsg', 'sgs', 'gsg'], { g: 'gunpowder', s: 'sand' }, 'tnt', 1),
    P(['i', 'f'], { i: 'iron_ingot', f: 'flint' }, 'flint_and_steel', 1),
    P(['i i', ' i '], { i: 'iron_ingot' }, 'bucket', 1), // #043 (1.12 V pattern, 3 ingots)
    P(['mm ', ' s ', ' s '], null, 'hoe', 4), // #054 (1.12 hoe; materials expanded below)
    P(['www'], { w: 'wheat' }, 'bread', 1), // #054 (3 wheat -> 1 bread)
    // #051 storage compression/uncraft + brick
    P(['iii', 'iii', 'iii'], { i: 'iron_ingot' }, 'iron_block', 1),
    P(['ggg', 'ggg', 'ggg'], { i: 'gold_ingot', g: 'gold_ingot' }, 'gold_block', 1),
    P(['ddd', 'ddd', 'ddd'], { i: 'diamond', d: 'diamond' }, 'diamond_block', 1),
    P(['bb', 'bb'], { b: 'brick' }, 'brick_block', 1),
    // #052 slabs: 3 same material in a row -> 6
    P(['ccc'], { c: 'cobblestone' }, 'stone_slab:cobblestone', 6),
    P(['sss'], { s: 'stone' }, 'stone_slab:stone', 6),
    P(['ppp'], { p: 'planks' }, 'wooden_slab:oak', 6),
    // #053 stairs: 1+2+3 staircase pattern -> 6 (1.12: oak 53, stone_stairs=COBBLE 67, brick 108)
    P(['p  ', 'pp ', 'ppp'], { p: 'planks' }, 'oak_stairs', 6),
    P(['c  ', 'cc ', 'ccc'], { c: 'cobblestone' }, 'stone_stairs', 6),
    P(['b  ', 'bb ', 'bbb'], { b: 'brick_block' }, 'brick_stairs', 6),
    { shapeless: { iron_block: 1 }, out: { name: 'iron_ingot', n: 9 } },
    { shapeless: { gold_block: 1 }, out: { name: 'gold_ingot', n: 9 } },
    { shapeless: { diamond_block: 1 }, out: { name: 'diamond', n: 9 } },
  ];
  const baseTools = CF.RECIPES.filter((x) => x.rows && !x.key);
  for (const mat of ['wood', 'stone', 'iron', 'diamond'])
    for (const b of baseTools)
      CF.RECIPES.push({ rows: b.rows, key: { m: MAT_ITEM[mat], s: 'stick' }, out: { name: mat + '_' + b.out.name, n: 1 } });
  CF.RECIPES = CF.RECIPES.filter((x) => (x.key || x.shapeless) && baseTools.indexOf(x) < 0);

  function normalize(grid, size) {
    let r0 = size, r1 = -1, c0 = size, c1 = -1;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++)
      if (grid[r * size + c]) { r0 = Math.min(r0, r); r1 = Math.max(r1, r); c0 = Math.min(c0, c); c1 = Math.max(c1, c); }
    if (r1 < 0) return null;
    const rows = [];
    for (let r = r0; r <= r1; r++) rows.push(grid.slice(r * size + c0, r * size + c1 + 1).map((s) => s && s.name));
    return rows;
  }
  CF.tryCraft = (grid, size) => {
    const names = grid.filter(Boolean).map((s) => s.name);
    const filled = grid.reduce((s, x) => s + (x ? x.count : 0), 0);
    for (const rec of CF.RECIPES) {
      if (rec.shapeless) {
        const need = Object.entries(rec.shapeless);
        if (names.length !== need.length) continue;
        const pool = names.slice();
        let ok = true;
        for (const [matName, cnt] of need) {
          const want = MAT_ITEM[matName] || matName;
          const i = pool.indexOf(want);
          if (i < 0) { ok = false; break; }
          pool.splice(i, 1);
        }
        if (ok) return { out: rec.out, count: 1 };
        continue;
      }
      const rows = normalize(grid, size);
      if (!rows || rows.length !== rec.rows.length) continue;
      let ok = true;
      const consumed = {};
      for (let r = 0; r < rows.length && ok; r++) {
        const wlen = Math.max(rows[r].length, rec.rows[r].length); // #054: compare full pattern width (a 2-wide hoe grid must NOT match the 3-wide pickaxe whose col-2 went unchecked)
        for (let c = 0; c < wlen && ok; c++) {
          const rc = c < rec.rows[r].length ? rec.rows[r][c] : ' ';
          const want = rc === ' ' ? null : (rec.key[rc] || '?');
          const got = c < rows[r].length ? rows[r][c] : null;
          if (want !== got) ok = false;
          if (got) consumed[got] = (consumed[got] || 0) + 1;
        }
      }
      if (ok) return { out: rec.out, count: Math.floor(filled ? 1 : 1) };
    }
    return null;
  };
  CF.craftOnce = (slots) => {
    // slots: array (4 or 9) of inventory indices forming the crafting grid
    const size = slots.length === 9 ? 3 : 2;
    const grid = slots.map((i) => CF.inv[i] || null);
    const res = CF.tryCraft(grid, size);
    if (!res) return null;
    for (const i of slots) {
      if (CF.inv[i]) { CF.inv[i].count--; if (!CF.inv[i].count) CF.inv[i] = null; }
    }
    CF.give(res.out.name, res.out.n);
    return res.out;
  };

  // ---- furnace block entities + smelting (200t/item, coal fuel 1600t)
  CF.blockEntities = {};
  const SMELT = { iron_ore: 'iron_ingot', gold_ore: 'gold_ingot', sand: 'glass', clay_ball: 'brick' }; // #051
  CF.FUEL = { coal: 1600, planks: 300, log: 300, stick: 100 };
  CF.furnacePlace = (x, y, z) => { CF.blockEntities[x + ',' + y + ',' + z] = { type: 'furnace', input: null, fuel: null, out: null, burn: 0, cook: 0 }; };
  // #040 chest: 27-slot container block entity (+ tiles drawn procedurally by render at load)
  const meta = (window.__TEXMETA = window.__TEXMETA || {});
  if (!meta.chest_side) meta.chest_side = { x: 48, y: 160, w: 16, h: 16, src: 'generated:items.js' };
  if (!meta.chest_top) meta.chest_top = { x: 64, y: 160, w: 16, h: 16, src: 'generated:items.js' };
  CF.chestPlace = (x, y, z) => { CF.blockEntities[x + ',' + y + ',' + z] = { type: 'chest', slots: new Array(27).fill(null) }; };
  CF.chestBreak = (x, y, z) => {
    const k = x + ',' + y + ',' + z, c = CF.blockEntities[k];
    if (!c || c.type !== 'chest') return 0;
    let n = 0;
    for (const s of c.slots) if (s && CF.give) { CF.give(s.name, s.count); n += s.count; }
    delete CF.blockEntities[k];
    CF.uiCloseContainer && CF.uiCloseContainer(k);
    return n;
  };
  CF.containerBreak = (name, x, y, z) => { if (name === 'furnace' && CF.furnaceBreak) CF.furnaceBreak(x, y, z); if (name === 'chest' && CF.chestBreak) CF.chestBreak(x, y, z); };
  // #043 bucket tiles (procedural, painted by render.js in free atlas row y=64)
  if (!meta.item_bucket) {
    meta.item_bucket = { x: 112, y: 160, w: 16, h: 16, src: 'generated:items.js' };
    meta.item_water_bucket = { x: 128, y: 160, w: 16, h: 16, src: 'generated:items.js' };
    meta.item_lava_bucket = { x: 144, y: 160, w: 16, h: 16, src: 'generated:items.js' };
  }
  CF.useBucket = (hit) => { // RMB: empty bucket + liquid source -> fill (source removed, MC-accurate); filled + air face-adjacent -> place new source
    if (!hit || !CF.world) return false;
    const W = CF.world, held = CF.held && CF.held();
    if (!held) return false;
    const swapHeld = (to) => { // stack-1 items: consume the held unit, give 'to' (same slot frees up first)
      const s = CF.inv[CF.sel];
      if (!s || s.name !== held) return false;
      s.count--; if (!s.count) CF.inv[CF.sel] = null;
      CF.give(to, 1);
      return true;
    };
    if (held === 'bucket') {
      const id = W.get(hit.x, hit.y, hit.z), v = id && CF.BY_ID[id];
      if (!v || !v.liquid || W.flatAt(hit.x, hit.y, hit.z) !== 0) return false; // 1.12: source blocks only (flow is immovable by bucket)
      W.set(hit.x, hit.y, hit.z, 0);
      return swapHeld(v.name === 'lava' ? 'lava_bucket' : 'water_bucket');
    }
    if (held === 'water_bucket' || held === 'lava_bucket') {
      const t = [hit.x + hit.face[0], hit.y + hit.face[1], hit.z + hit.face[2]];
      if (W.get(t[0], t[1], t[2])) return false; // air only (MC replaceable-block placement -> Tier-1 simplification)
      if (CF.cellHitsPlayer && CF.cellHitsPlayer(t[0], t[1], t[2])) return false; // never place fluid into yourself
      W.set(t[0], t[1], t[2], CF.IDOF[held === 'water_bucket' ? 'water' : 'lava']);
      if (W.flatSet) W.flatSet(t[0], t[1], t[2], 0); // level 0 = source
      return swapHeld('bucket');
    }
    return false;
  };
  // #032: breaking a furnace returns its contents to the player (no item entities in Tier-1)
  CF.furnaceBreak = (x, y, z) => {
    const k = x + ',' + y + ',' + z, f = CF.blockEntities[k];
    if (!f) return;
    for (const s of [f.input, f.fuel, f.out]) if (s && CF.give) CF.give(s.name, s.count);
    delete CF.blockEntities[k];
    CF.uiCloseContainer && CF.uiCloseContainer(k);
  };
  CF.furnaceTick = () => {
    for (const k in CF.blockEntities) {
      const f = CF.blockEntities[k];
      if (f.type !== 'furnace') continue;
      const canSmelt = f.input && SMELT[f.input.name] && (f.out === null || (f.out.name === SMELT[f.input.name] && f.out.count < STACK));
      if (f.burn === 0 && canSmelt && f.fuel && CF.FUEL[f.fuel.name]) {
        f.burn = CF.FUEL[f.fuel.name]; f.burnMax = CF.FUEL[f.fuel.name];
        f.fuel.count--; if (!f.fuel.count) f.fuel = null;
      }
      if (f.burn > 0 && canSmelt) {
        f.burn--; f.cook++;
        if (f.cook >= 200) {
          f.cook = 0;
          const prod = SMELT[f.input.name];
          f.input.count--; if (!f.input.count) f.input = null;
          f.out = f.out ? { name: prod, count: f.out.count + 1 } : { name: prod, count: 1 };
        }
      } else if (f.burn > 0) f.burn--;
      else f.cook = 0;
    }
  };

  const origOnTick = CF.onTick;
  CF.onTick = () => { if (origOnTick) origOnTick(); CF.furnaceTick(); };

  // creative starter kit (survival switch comes in #026)
  if (CF.creative === undefined) {
    CF.creative = true;
    ['grass', 'dirt', 'stone', 'cobblestone', 'planks', 'log', 'leaves', 'glowstone', 'crafting_table'].forEach((n, i) => { CF.inv[i] = { name: n, count: 64 }; });
    CF.inv[8] = { name: 'torch', count: 16 };
  }

  // ---- tests
  CF.itemTests = async (r) => {
    const put = (i, name, n = 1) => { CF.inv[i] = { name, count: n }; };
    // log -> 4 planks (shapeless)
    CF.inv.fill(null);
    put(0, 'log', 1);
    let res = CF.craftOnce([0, 1, 2, 3]);
    CF.assert(r, 'items.planks(' + JSON.stringify(res) + ')', res && res.name === 'planks' && CF.countItem('planks') === 4 && CF.countItem('log') === 0);
    // sticks: 2 planks vertical -> 4 (slot grid is row-major: vertical = slots 0 & 2)
    CF.inv.fill(null); put(0, 'planks', 1); put(2, 'planks', 1);
    CF.craftOnce([0, 1, 2, 3]);
    CF.assert(r, 'items.stick', CF.countItem('stick') === 4 && CF.countItem('planks') === 0);
    // torch: coal over stick -> 4
    CF.inv.fill(null); put(0, 'coal', 1); put(2, 'stick', 1);
    CF.craftOnce([0, 1, 2, 3]);
    CF.assert(r, 'items.torch(t=' + CF.countItem('torch') + ',c=' + CF.countItem('coal') + ')', CF.countItem('torch') === 4 && CF.countItem('coal') === 0 && CF.countItem('stick') === 0);
    // crafting table 2x2 planks
    CF.inv.fill(null); for (let i = 0; i < 4; i++) put(i, 'planks', 1);
    CF.craftOnce([0, 1, 2, 3]);
    CF.assert(r, 'items.table(' + CF.countItem('crafting_table') + ')', CF.countItem('crafting_table') === 1);
    // iron pickaxe 3x3 pattern
    CF.inv.fill(null); put(20, 'iron_ingot', 1); put(21, 'iron_ingot', 1); put(22, 'iron_ingot', 1); put(24, 'stick', 1); put(27, 'stick', 1);
    res = CF.craftOnce([20, 21, 22, 23, 24, 25, 26, 27, 28]);
    CF.assert(r, 'items.iron-pickaxe(' + CF.countItem('iron_pickaxe') + ',' + (res && res.name) + ')', CF.countItem('iron_pickaxe') === 1 && res && res.name === 'iron_pickaxe');
    // #053 stairs: 1+2+3 staircase pattern -> 6 oak stairs
    CF.inv.fill(null); for (const s of [20, 23, 24, 26, 27, 28]) put(s, 'planks', 1);
    res = CF.craftOnce([20, 21, 22, 23, 24, 25, 26, 27, 28]);
    CF.assert(r, 'items.stairs-craft(' + CF.countItem('oak_stairs') + ',' + (res && res.name) + ')', CF.countItem('oak_stairs') === 6 && res && res.name === 'oak_stairs' && CF.countItem('planks') === 0);
    // #054: hoe (2 mats + 2 sticks diagonal) + bread (3 wheat)
    CF.inv.fill(null); put(20, 'planks', 1); put(21, 'planks', 1); put(24, 'stick', 1); put(27, 'stick', 1);
    res = CF.craftOnce([20, 21, 22, 23, 24, 25, 26, 27, 28]);
    CF.assert(r, 'items.hoe-craft(' + CF.countItem('wood_hoe') + ',' + (res && res.name) + ')', CF.countItem('wood_hoe') === 1 && res && res.name === 'wood_hoe');
    CF.inv.fill(null); for (const s of [20, 21, 22]) put(s, 'wheat', 1);
    res = CF.craftOnce([20, 21, 22, 23, 24, 25, 26, 27, 28]);
    CF.assert(r, 'items.bread-craft(' + CF.countItem('bread') + ')', CF.countItem('bread') === 1 && CF.countItem('wheat') === 0);
    // tool speeds per model: stone w/ wood pick = 1.125s, w/ hand = 7.5s, iron ore w/ stone pick harvests
    const stoneV = CF.REGISTRY.stone.variants.default;
    CF.assert(r, 'items.speed-stone-wood(' + CF.breakTimeFor(stoneV, 'wood_pickaxe') + ')',
      Math.abs(CF.breakTimeFor(stoneV, 'wood_pickaxe') - 1.125) < 0.01 && Math.abs(CF.breakTimeFor(stoneV, null) - 7.5) < 0.01);
    const goldV = CF.REGISTRY.gold_ore.variants.default;
    CF.assert(r, 'items.gate-gold', CF.canHarvest(goldV, 'wood_pickaxe') === false && CF.canHarvest(goldV, 'iron_pickaxe') === true);
    // furnace smelt: iron_ore + coal -> iron_ingot after 200 ticks
    CF.furnacePlace(1, 1, 1);
    const f = CF.blockEntities['1,1,1'];
    f.input = { name: 'iron_ore', count: 1 }; f.fuel = { name: 'coal', count: 1 };
    for (let i = 0; i < 202; i++) CF.furnaceTick();
    CF.assert(r, 'items.smelt(' + (f.out && f.out.name + f.out.count) + ')', f.out && f.out.name === 'iron_ingot' && f.out.count === 1 && f.input === null);
    delete CF.blockEntities['1,1,1'];
    // torch: light 14 propagates (uses the #020 light engine)
    CF.world.ensureAround(60, 60, 2);
    for (let i = 0; i < 20 && CF.world.stats().queue; i++) CF.world.tick();
    let th2 = 0;
    for (let dx = -2; dx <= 6; dx++) th2 = Math.max(th2, CF.world.heightAt(60 + dx, 60));
    const ty2 = th2 + 2;
    CF.world.set(60, ty2, 60, CF.IDOF['torch']);
    CF.world.ensureLight(3, 3);
    const tl = CF.world.lightAt(60, ty2, 61) & 15;
    const tl2 = CF.world.lightAt(60, ty2, 64) & 15;
    const tl0 = CF.world.lightAt(60, ty2, 60) & 15;
    const tidHere = CF.world.get(60, ty2, 60);
    CF.assert(r, 'items.torch-light(src=' + tl0 + ',id=' + tidHere + ',lid=' + (CF.IDOF['torch']) + ',l=' + (CF.BY_ID[tidHere] && CF.BY_ID[tidHere].light) + ',adj=' + tl + ',' + tl2 + ')', tl === 13 && tl2 === 10);
    // give/stack/consume
    CF.inv.fill(null);
    CF.give('dirt', 70);
    CF.assert(r, 'items.stack', CF.countItem('dirt') === 70 && CF.inv[0].count === 64 && CF.inv[1].count === 6);
    CF.assert(r, 'items.consume', CF.consume('dirt', 65) && CF.countItem('dirt') === 5 && !CF.consume('dirt', 6));
    CF.inv.fill(null);
    for (let i = 0; i < 9; i++) CF.inv[i] = { name: 'iron_ingot', count: 1 };
    CF.craftOnce([0, 1, 2, 3, 4, 5, 6, 7, 8]);
    const packed = CF.countItem('iron_block');
    CF.inv.fill(null); CF.inv[0] = { name: 'iron_block', count: 1 };
    CF.craftOnce([0, 1, 2, 3, 4, 5, 6, 7, 8].map((i) => (i === 0 ? 0 : 30)));
    const unpacked = CF.countItem('iron_ingot');
    CF.assert(r, 'items.storage-9x1(' + packed + ',' + unpacked + ')', packed === 1 && unpacked === 9);
    // ---- #043 buckets (1.12 semantics: source-only pickup, source placement, stack 1)
    {
      const W = CF.world, bx = 220, bz = 220;

      if (!CF.ui.open) { CF.ui.workbench = false; for (let i = 0; i < 9; i++) if (CF.ui.craft[i]) { CF.give(CF.ui.craft[i].name, CF.ui.craft[i].count); CF.ui.craft[i] = null; } } // #059: close returns all 9 + leaves workbench mode
      if (!CF.ui.open) CF.ui.container = null; // #032: closing kills container view (contents stay in BE)
      refresh();
    }
    if (e.code === 'Escape' && CF.ui.open) window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyE' }));
  });
  window.addEventListener('mouseup', (e) => { if (CF.blockPlaceAt && e.button === 1) { /* middle: reserved */ } });

  // #032: right-click block use (furnace opens its GUI instead of placing)
  CF.useBlock = (hit) => {
    if (!hit) return false;
    if (CF.useBed && CF.useBed(hit)) return true; // #041 bed
    if (CF.IDOF && CF.world.get(hit.x, hit.y, hit.z) === CF.IDOF['crafting_table']) return CF.uiOpenWorkbench(); // #059 3x3 GUI
    if (!CF.blockEntities) return false;
    const k = hit.x + ',' + hit.y + ',' + hit.z;
    const f = CF.blockEntities[k];
    if (f && (f.type === 'furnace' || f.type === 'chest')) { CF.uiOpenContainer(k); return true; } // #032/#040
    return false;
  };
  CF.uiOpenContainer = (k) => {
    CF.ui.container = k;
    if (!CF.ui.open) { CF.ui.open = true; if (inv) inv.style.display = 'block'; }
    refresh();
  };
  // #059: crafting table opens the 3x3 grid GUI (+ full recipe book); sneak-free right-click, contents return on close
  CF.uiOpenWorkbench = () => {
    CF.ui.workbench = true;
    if (!CF.ui.open) { CF.ui.open = true; if (inv) inv.style.display = 'block'; }
    refresh();
    return true;
  };
  // #059 recipe book: every recipe the CURRENT inventory can pay for, click fills the grid.
  // (MC 'discovered/known' persistence deferred - craftable-filter is the useful v1.)
  function bookList() {
    const size = CF.ui.workbench ? 3 : 2;
    const out = [];
    CF.RECIPES.forEach((rec, idx) => {
      const need = {};
      if (rec.shapeless) { for (const m in rec.shapeless) need[m] = (need[m] || 0) + rec.shapeless[m]; }
      else {
        if (rec.rows.length > size || rec.rows.some((r) => r.length > size)) return;
        for (const row of rec.rows) for (const ch of row) { const nm = rec.key[ch]; if (nm) need[nm] = (need[nm] || 0) + 1; }
      }
      for (const m in need) if (CF.countItem(m) < need[m]) return;
      out.push({ idx, name: rec.out.name, n: rec.out.n });
    });
    return out;
  }
  CF.bookFill = (ri) => {
    const rec = CF.RECIPES[ri];
    if (!rec) return false;
    for (let c = 0; c < 9; c++) if (CF.ui.craft[c]) { CF.give(CF.ui.craft[c].name, CF.ui.craft[c].count); CF.ui.craft[c] = null; }
    const size = CF.ui.workbench ? 3 : 2;
    const slotAt = size === 3 ? (r, c) => r * 3 + c : (r, c) => [0, 1, 3, 4][r * 2 + c];
    const take = (name) => {
      for (let i = 0; i < 36; i++) { const s = CF.inv[i]; if (s && s.name === name) { s.count--; if (!s.count) CF.inv[i] = null; return true; } }
      return false;
    };
    if (rec.shapeless) {
      const cells = size === 3 ? [0, 1, 2] : [0, 1];
      let k = 0;
      for (const [m, cnt] of Object.entries(rec.shapeless)) for (let t = 0; t < cnt; t++) {
        if (!take(m)) return false;
        CF.ui.craft[cells[k++ % cells.length]] = { name: m, count: 1 };
      }
    } else {
      for (let r = 0; r < rec.rows.length; r++) for (let c = 0; c < rec.rows[r].length; c++) {
        const nm = rec.key[rec.rows[r][c]];
        if (!nm) continue;
        if (!take(nm)) return false;
        CF.ui.craft[slotAt(r, c)] = { name: nm, count: 1 };
      }
    }
    updateResult(); refresh();
    return true;
  };
  function renderBook() {
    if (!inv) return;
    if (!bookEl) { bookEl = document.createElement('div'); bookEl.className = 'book'; inv.appendChild(bookEl); }
    if (!CF.ui.open) { bookEl.style.display = 'none'; return; }
    bookEl.style.display = 'block';
    bookEl.innerHTML = '<h4>Recipes (' + (CF.ui.workbench ? '3x3' : '2x2') + ')</h4>';
    const list = bookList();
    for (const e of list) {
      const d = document.createElement('div');
      d.className = 'r';
      const ic = document.createElement('div');
      ic.style.cssText = 'position:absolute;inset:0;background-repeat:no-repeat';
      Object.assign(ic.style, iconCss(itemTile(e.name)));
      d.appendChild(ic);
      d.title = e.name + ' x' + e.n;
      d.addEventListener('mousedown', (ev) => { ev.preventDefault(); CF.bookFill(e.idx); });
      bookEl.appendChild(d);
    }
    if (!list.length) bookEl.innerHTML += '<div style="opacity:0.6">nothing craftable - gather materials</div>';
  }
  CF.uiCloseContainer = (k) => { if (CF.ui.container === k) { CF.ui.container = null; refresh(); } };

  CF.uiRefresh = refresh;
  setInterval(() => { if (document.getElementById('hud')) refresh(); }, 200);

  // ---- tests
  CF.uiTests = async (r) => {
    CF.assert(r, 'ui.hotbar', !!document.getElementById('hud') && document.querySelectorAll('#hud .slot').length === 9);
    CF.assert(r, 'ui.icon-live', (() => {
      const ic = document.querySelector('#hud .slot .icon');
      const raw = ic && ic.style.backgroundImage;
      // #043: icons use var(--cfatlas) (live-swapped after render.js repaints procedural tiles) -
      // inline style holds the var() token; the computed value must resolve to the embedded PNG.
      const resolved = ic ? getComputedStyle(ic).backgroundImage : '';

    })());
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Digit3' }));
    CF.assert(r, 'ui.sel', CF.sel === 2 && document.querySelectorAll('#hud .slot')[2].classList.contains('sel'));
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyE' }));
    CF.assert(r, 'ui.open', document.getElementById('inv').style.display === 'block');

    CF.ui.ghost = null;
    CF.uiClick('inv', 3); CF.uiClick('inv', 20);

    for (let i = 0; i < 202; i++) CF.furnaceTick();
    CF.assert(r, 'ui.furn-smelt(out=' + (f.out && f.out.name + f.out.count) + ',burn=' + f.burn + ')',
      f.out.name === 'iron_ingot' && f.out.count === 1 && f.input.name === 'iron_ore' && f.input.count === 1 && f.burn > 0);
    CF.uiClick('fout', 0);

    CF.ui.ghost = null;
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyE' }));
    CF.assert(r, 'ui.furn-close', CF.ui.container === null && CF.blockEntities[fx + ',' + fy + ',' + fz].input.name === 'iron_ore');
    CF.inv.fill(null);
    CF.furnaceBreak(fx, fy, fz);
    CF.assert(r, 'ui.furn-break-contents', CF.countItem('iron_ore') === 1 && CF.countItem('coal') === 2 && !CF.blockEntities[fx + ',' + fy + ',' + fz]); // 3 coal minus 1 burned

    // ================= #040 chest: 27-slot container + persistence =================
    const cx0 = 74, cz0 = 70, cy0 = Math.floor(CF.world.heightAt(cx0, cz0)) + 1;

    CF.inv.fill(null); CF.ui.ghost = null;
    CF.inv[0] = { name: 'cobblestone', count: 10 }; CF.inv[1] = { name: 'cobblestone', count: 5 }; CF.inv[2] = { name: 'dirt', count: 5 };
    CF.uiClick('inv', 0); CF.uiClick('cs', 5); // ghost pickup -> store
    CF.uiClick('inv', 1); CF.uiClick('cs', 5); // second same-kind stack -> merge
    const c = CF.blockEntities[cx0 + ',' + cy0 + ',' + cz0];
    CF.assert(r, 'ui.chest-store(' + (c.slots[5] && c.slots[5].count) + ')', c.slots[5].name === 'cobblestone' && c.slots[5].count === 15);
    CF.uiClick('inv', 2, true); // shift-click dirt -> chest quickmove
    CF.assert(r, 'ui.chest-quickmove', CF.countItem('dirt') === 0 && c.slots.some((s) => s && s.name === 'dirt' && s.count === 5));
    CF.uiClick('cs', 5); CF.uiClick('inv', 0); // take back
    CF.assert(r, 'ui.chest-take', CF.countItem('cobblestone') === 15 && !c.slots[5]);
    // persistence roundtrip
    CF.give('coal', 7);
    const ck = cx0 + ',' + cy0 + ',' + cz0;
    CF.saveNow();
    CF.world.set(cx0, cy0, cz0, 0); delete CF.blockEntities[ck]; // "grief it away"
    CF.loadNow();
    const c2 = CF.blockEntities[ck];
    CF.assert(r, 'ui.chest-persist(' + (c2 && c2.slots.filter(Boolean).length) + ',bes=' + Object.keys(CF.blockEntities).join('|') + ',blk=' + CF.world.get(cx0, cy0, cz0) + '/' + CF.IDOF['chest'] + ')', !!c2 && c2.type === 'chest' && c2.slots.some((s) => s && s.name === 'dirt' && s.count === 5));
    CF.assert(r, 'ui.chest-persist-orphan', CF.world.get(cx0, cy0, cz0) === CF.IDOF['chest']); // block restored too
    // break returns contents
    CF.inv.fill(null);
    const got = CF.chestBreak(cx0, cy0, cz0);
    CF.assert(r, 'ui.chest-break', got >= 5 && CF.countItem('dirt') === 5 && !CF.blockEntities[ck]);
    CF.world.set(cx0, cy0, cz0, 0);
    // #059: 3x3 workbench GUI + recipe book (list/click-fill) - craft a wooden pickaxe THROUGH the book
    {
      const tbx = 66, tbz = 66;
      CF.world.ensureAround(tbx, tbz, 1);
      for (let i = 0; i < 10 && CF.world.stats().queue; i++) CF.world.tick();
      const tby = CF.world.heightAt(tbx, tbz);

      CF.inv.fill(null);
      CF.give('planks', 6); CF.give('stick', 4);
      const opened = CF.useBlock({ x: tbx, y: tby, z: tbz });
      const okW = opened === true && CF.ui.workbench === true && CF.ui.open === true;
      const book = bookList();
      const pick = book.find((b) => b.name === 'wood_pickaxe');
      const filled = pick ? CF.bookFill(pick.idx) : false;
      const gridOk = !!(CF.ui.craft[0] && CF.ui.craft[1] && CF.ui.craft[2] && CF.ui.craft[4] && CF.ui.craft[7] &&
        CF.ui.craft[0].name === 'planks' && CF.ui.craft[4].name === 'stick' &&
        CF.ui.result && CF.ui.result.name === 'wood_pickaxe');
      const planksA = CF.countItem('planks');
      CF.uiClick('result', 0);
      const made = CF.countItem('wood_pickaxe');
      const after = CF.countItem('planks');
      CF.ui.workbench = false;
      const size2 = bookList().length; // 2x2 mode must hide tool recipes (they cannot fit the small lattice)
      CF.world.set(tbx, tby, tbz, 0); CF.ui.ghost = null;
      CF.assert(r, 'ui.book(' + okW + ',' + !!pick + ',' + filled + ',' + gridOk + ',' + made + ',' + planksA + '>' + after + ',s2=' + size2 + ')',
        okW && !!pick && filled === true && gridOk === true && made === 1 && planksA === 3 && after === 3 && size2 >= 1 && size2 < book.length);
    }
    // #047 crosshair present + hidden while a GUI is open; camera interpolation keeps standing y EXACT
    const xh = document.getElementById('xh');
    CF.ui.open = true; refresh(); const xhHidden = xh.style.display === 'none';
    CF.ui.open = false; refresh();
    CF.assert(r, 'ui.crosshair(' + !!xh + ',' + xhHidden + ')', !!xh && xhHidden === true && xh.style.display === 'block');
    const P = CF.player;
    P.tp(60.5, CF.world.heightAt(60, 60) + 12, 60.5); P.onGround = false; P.prevPos = P.pos.slice();
    for (let i = 0; i < 80 && !P.onGround; i++) CF.playerTick();
    let y0 = P.pos[1], still = true;
    for (let i = 0; i < 600; i++) { CF.playerTick(); if (Math.abs(P.pos[1] - y0) > 1e-9) still = false; }
    CF.assert(r, 'ui.stand-rock-still(dy=' + (P.pos[1] - y0) + ')', still === true && P.onGround === true);
    CF.ui.open = false; CF.ui.container = null; if (inv) inv.style.display = 'none';
  };

  // ---- shot scenarios
  CF.shotScenarios = CF.shotScenarios || {};
  CF.shotScenarios['ui-hotbar'] = async () => {
    CF.freeCam = false;
    const P = CF.player, W = CF.world;
    W.ensureAround(30, 30, 2);
    for (let i = 0; i < 30 && W.stats().queue; i++) W.tick();
    P.tp(30.5, W.heightAt(30, 30) + 3, 30.5);
    P.yaw = 0.9; P.pitch = -0.12;
    for (let i = 0; i < 30; i++) { CF.playerTick(); CF.renderTick(); await new Promise((x) => setTimeout(x, 30)); }
    CF.renderDraw(CF.camera);
    await new Promise((x) => setTimeout(x, 200));
  };
  CF.shotScenarios['ui-inventory'] = async () => {
    await CF.shotScenarios['ui-hotbar']();
    CF.inv[12] = { name: 'log', count: 3 };
    CF.uiClick ? (CF.ui.open || window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyE' }))) : 0;
    CF.uiClick('inv', 12); CF.uiClick('craft', 0);
    CF.uiClick('inv', 14); // second log? shapeless only needs 1
    refresh();
    CF.renderDraw(CF.camera);
    await new Promise((x) => setTimeout(x, 200));
  };
  CF.shotScenarios['ui-furnace'] = async () => {
    await CF.shotScenarios['ui-hotbar']();
    const P = CF.player, W = CF.world;
    const fx = Math.floor(P.pos[0]) + 2, fz = Math.floor(P.pos[2]), fy = W.heightAt(fx, fz) + 1;
    W.set(fx, fy, fz, CF.IDOF['furnace']);
    CF.furnacePlace(fx, fy, fz);
    const f = CF.blockEntities[fx + ',' + fy + ',' + fz];
    f.input = { name: 'iron_ore', count: 3 }; f.fuel = { name: 'coal', count: 2 };
    for (let i = 0; i < 150; i++) CF.furnaceTick(); // part-smelted: flame + cook bars mid-progress, 0 output yet
    CF.useBlock({ x: fx, y: fy, z: fz });
    CF.renderDraw(CF.camera);
    await new Promise((res) => setTimeout(res, 200)); // shot is taken AFTER this fn returns - keep GUI open
  };
  CF.shotScenarios['ui-chest'] = async () => {
    await CF.shotScenarios['ui-hotbar']();

/* ==== src/survival.js ==== */
// Survival mode (#026): health, hunger/saturation, fall damage, lava, drowning, respawn, HUD.
// Model per docs/REFERENCE.md §physics/hunger (1.12 simplified-exhaustion model).
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const S = CF.stats = { hp: 20, food: 20, sat: 5, air: 300, deaths: 0 };
  CF.survival = false; // creative default (documented deviation: F4 toggles)

  let peakY = null, hurtCd = 0, regenAcc = 0, starveAcc = 0;

  const hud = document.createElement('div');
  hud.id = 'surv';
  hud.style.cssText = 'position:fixed;bottom:56px;left:50%;transform:translateX(-50%);display:none;gap:0;z-index:21;font:13px monospace';
  hud.innerHTML = '<div id="hearts" style="display:flex;gap:1px"></div><div id="food" style="display:flex;gap:1px;margin-left:60%"></div>';
  // #047: append synchronously when body already exists (scripts run at </body>) - the old
  // Promise.resolve().then() deferred one microtask so getElementById('hearts') could miss it
  // when a test suite ran before the flush (latent since #026, hit by the bedsuite standalone).
  if (document.body) document.body.appendChild(hud);
  else document.addEventListener('DOMContentLoaded', () => document.body.appendChild(hud));

  const HEART = '#c03028', EMPTY = '#3a3a3a', FOODC = '#c88038', DRY = '#2e2e2e';
  function pip(el, n, max, colorFull, colorEmpty, half) {
    el.innerHTML = '';
    for (let i = 0; i < max; i++) {
      const d = document.createElement('div');
      const full = n >= (i + 1) * 2, halfNow = !full && n === i * 2 + 1;
      d.style.cssText = 'width:8px;height:12px;background:' + (full ? colorFull : halfNow ? colorFull : colorEmpty);
      if (halfNow) d.style.background = 'linear-gradient(90deg,' + colorFull + ' 50%,' + colorEmpty + ' 50%)';
      d.title = (full ? 2 : halfNow ? 1 : 0);
      el.appendChild(d);
    }
  }
  function hudRefresh() {
    const on = CF.survival;
    hud.style.display = on ? 'flex' : 'none';
    if (!on) return;
    const hc = document.getElementById('hearts'), fc = document.getElementById('food');
    if (hc) pip(hc, Math.max(0, Math.ceil(S.hp)), 10, HEART, EMPTY, true);
    if (fc) pip(fc, Math.max(0, Math.ceil(S.food)), 10, FOODC, DRY, false);
  }
  CF.survRefresh = hudRefresh;

  CF.canSprint = () => !CF.survival || S.food > 6;
  CF.damage = (n, why) => {
    if (!CF.survival || hurtCd > 0 && why !== 'fall') return;
    S.hp -= n;
    hurtCd = why === 'fall' ? 0 : 10; // 1.12: post-hurt no-damage window (0.5s) - #036
    if (why === 'drown') hurtCd = 20; // drown keeps its 1s rhythm (2 dmg/s)
    if (why) CF.lastHurt = why;
    if (S.hp <= 0) respawn();
  };
  function respawn() {
    S.deaths++;
    S.hp = 20; S.food = 20; S.sat = 5; S.air = 300;
    peakY = null; // stale fall-peaks must never damage across teleports (phantom-fall bug, #036)
    const P = CF.player;
    P.tp(P.spawn[0], P.spawn[1], P.spawn[2]);
    CF.lastDeathAt = CF.ticks;
  }

  CF.useHeld = () => {
    const held = CF.held && CF.held();
    if (!held) return false;
    const def = CF.ITEMS && CF.ITEMS[held];
    if (def && def.food && S.food < 20) {
      S.food = Math.min(20, S.food + def.food);
      S.sat = Math.min(S.food, S.sat + def.food * 0.5);
      CF.consume(held, 1);
      hudRefresh();
      return true;
    }
    return false;
  };

  const origOnTick = CF.onTick;
  CF.onTick = () => {
    if (origOnTick) origOnTick();
    const P = CF.player, W = CF.world;
    if (!P || !W) return;
    if (!P.spawn) P.spawn = P.pos.slice();
    if (hurtCd > 0) hurtCd--;

    // fall tracking
    if (P.onGround) {
      if (peakY !== null) {
        const dist = peakY - P.pos[1];
        S.lastFall = +dist.toFixed(2);
        if (dist > 3) {
          const inWater = W.get(Math.floor(P.pos[0]), Math.floor(P.pos[1] - 0.9), Math.floor(P.pos[2])) === CF.IDOF['water'];
          if (!inWater) CF.damage(Math.floor(dist - 3), 'fall');
        }
        peakY = null;
      }
    } else if (P.vel[1] < 0) {
      peakY = peakY === null ? P.pos[1] : Math.max(peakY, P.pos[1]);
    }

    if (!CF.survival) return;

    // exhaustion -> hunger
    const i = P.input;
    let ex = 0;
    if (P.onGround && (i.f || i.s || i.l || i.r)) ex = i.sprint && CF.canSprint() ? 0.08 : 0.01;
    if (i.jump && P.onGround) ex += 0.1;
    if (CF.mining) ex += 0.02;
    if (ex > 0) {
      S.sat -= ex;
      if (S.sat < 0) { S.food = Math.max(0, S.food + S.sat); S.sat = 0; }
    }

    // starvation
    if (S.food <= 0 && S.sat <= 0) {
      starveAcc++;
      if (starveAcc >= 80) { starveAcc = 0; if (S.hp > 1) CF.damage(1, 'starve'); }
    } else starveAcc = 0;

    // regeneration
    if (S.food >= 18 && S.sat > 0 && S.hp < 20) {
      regenAcc++;
      const rate = S.food >= 20 ? 40 : 80;
      if (regenAcc >= rate) { regenAcc = 0; S.hp = Math.min(20, S.hp + 1); S.sat = Math.max(0, S.sat - 1.5); }
    } else regenAcc = 0;

    // lava contact (body cells)
    const fx = Math.floor(P.pos[0]), fz = Math.floor(P.pos[2]);
    const fy1 = Math.floor(P.pos[1] - 0.8), fy2 = Math.floor(P.pos[1] + 0.8);
    if (W.get(fx, fy1, fz) === CF.IDOF['lava'] || W.get(fx, fy2, fz) === CF.IDOF['lava']) CF.damage(1, 'lava');

    // drowning (head in water)
    const head = W.get(fx, Math.floor(P.pos[1] + 0.72), fz) === CF.IDOF['water'];
    if (head) {
      S.air--;
      if (S.air <= 0) { S.air = 0; if (hurtCd <= 0) CF.damage(2, 'drown'); }
    } else if (S.air < 300) S.air = Math.min(300, S.air + 10);

    // void death
    if (P.pos[1] < -10) { S.hp = 0; respawn(); }

    hudRefresh();
  };

  window.addEventListener('keydown', (e) => {
    if (e.code === 'F4') {
      CF.survival = !CF.survival;
      if (CF.survival) { S.hp = 20; S.food = 20; S.sat = 5; }
      hudRefresh();
    }
  });
  CF.shotScenarios = CF.shotScenarios || {};
  CF.shotScenarios['hud-low'] = async () => {
    CF.freeCam = false;
    const P = CF.player, W = CF.world;
    W.ensureAround(30, 30, 2);
    for (let i = 0; i < 30 && W.stats().queue; i++) W.tick();
    P.tp(30.5, W.heightAt(30, 30) + 3, 30.5);
    P.yaw = 0.9; P.pitch = -0.15;
    CF.survival = true; S.hp = 7; S.food = 6; S.sat = 1; S.air = 240;
    for (let i = 0; i < 40; i++) { CF.playerTick(); CF.renderTick(); await new Promise((x) => setTimeout(x, 30)); }
    hudRefresh();
    CF.renderDraw(CF.camera);
    await new Promise((x) => setTimeout(x, 200));
  };
  setInterval(hudRefresh, 500);

  // ---- tests
  CF.survivalTests = async (r) => {
    const P = CF.player, W = CF.world;
    CF.survival = true; S.hp = 20; S.food = 20; S.sat = 5;
    W.ensureAround(P.spawn ? P.spawn[0] : 8, 8, 2);
    const gx = 100, gz = 100;
    W.ensureAround(gx, gz, 1);
    for (let i = 0; i < 10 && W.stats().queue; i++) W.tick();
    let gxx = gx, gzz = gz, found = false;
    for (let tries = 0; tries < 40 && !found; tries++) {
      const cx3 = gx + (tries % 8) * 3 - 9, cz3 = gz + Math.floor(tries / 8) * 3 - 6;
      const hh3 = W.heightAt(cx3, cz3);
      let clear = true;
      for (let y = hh3 + 1; y <= hh3 + 14; y++) if (W.get(cx3, y, cz3) || W.get(cx3 + 1, y, cz3) || W.get(cx3 - 1, y, cz3)) { clear = false; break; }
      if (clear) { gxx = cx3; gzz = cz3; found = true; }
    }
    CF.assert(r, 'surv.clear-spot', found === true);
    const gh = W.heightAt(gxx, gzz);
    // fall 10 blocks -> 7 dmg
    P.spawn = [gxx + 0.5, gh + 1, gzz + 0.5];
    P.tp(gxx + 0.5, gh + 12, gzz + 0.5);
    S.hp = 20; hurtCd = 0; peakY = null; P.onGround = false;
    for (let t = 0; t < 90; t++) { CF.playerTick(); CF.onTick(); if (P.onGround && t > 3) break; }
    // 1.12 formula floor(d-3): discrete sim peak-logging costs +/-1-2 blocks -> range assert (documented)
    CF.assert(r, 'surv.fall10(' + S.hp + ',f=' + S.lastFall + ')', S.hp >= 11 && S.hp <= 14 && P.onGround);
    // fall 3 blocks -> 0 dmg
    P.tp(gxx + 0.5, gh + 5, gzz + 0.5);
    S.hp = 20; hurtCd = 0; peakY = null; P.onGround = false;
    for (let t = 0; t < 90; t++) { CF.playerTick(); CF.onTick(); if (P.onGround && t > 3) break; }
    CF.assert(r, 'surv.fall3(' + S.hp + ')', S.hp === 20);
    // sprint gate
    S.food = 6;
    CF.assert(r, 'surv.sprint-gate', CF.canSprint() === false);
    S.food = 10;
    CF.assert(r, 'surv.sprint-ok', CF.canSprint() === true);
    // starvation floors at 1 hp
    S.food = 0; S.sat = 0; S.hp = 6; hurtCd = 0; starveAcc = 0;
    for (let t = 0; t < 2000; t++) CF.onTick();
    CF.assert(r, 'surv.starve-floor(' + S.hp + ')', S.hp === 1);
    // eating apple
    S.food = 10; S.sat = 0;
    CF.inv.fill(null); CF.give('apple', 1); CF.sel = 0;
    CF.useHeld();
    CF.assert(r, 'surv.eat(' + S.food + ')', S.food === 14 && CF.countItem('apple') === 0);
    // #054 bread: 5 food (1.12)
    S.food = 10; S.sat = 0;
    CF.inv.fill(null); CF.give('bread', 1); CF.sel = 0;
    CF.useHeld();
    CF.assert(r, 'surv.bread(' + S.food + ')', S.food === 15 && CF.countItem('bread') === 0);
    // regen: full food heals
    S.food = 20; S.sat = 5; S.hp = 10; regenAcc = 0;
    for (let t = 0; t < 200; t++) CF.onTick();
    CF.assert(r, 'surv.regen(' + S.hp + ')', S.hp > 10);
    // death + respawn via void
    S.hp = 20; const d0 = S.deaths;
    P.tp(0, -30, 0);
    CF.onTick();
    CF.assert(r, 'surv.respawn(' + S.hp + ',' + S.deaths + ')', S.deaths === d0 + 1 && S.hp === 20 && P.pos[1] > -5);
    // HUD
    hudRefresh();
    CF.assert(r, 'surv.hud', document.getElementById('hearts').children.length === 10 && hud.style.display === 'flex');
    CF.survival = false; hudRefresh();
  };
})();

/* ==== src/persist.js ==== */
// localStorage save/load, schema v1 (SPK-5): RLE edited-chunks + player + time.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const KEY = 'cf-save-1';

  function rleEncode(arr) {
    const out = [];
    let cur = arr[0], len = 1;
    for (let i = 1; i < arr.length; i++) {
      if (arr[i] === cur && len < 255) len++;
      else { out.push(cur, len); cur = arr[i]; len = 1; }
    }
    out.push(cur, len);
    return new Uint8Array(out);
  }
  function rleDecode(bytes, size) {
    const arr = new Uint8Array(size);
    let p = 0;
    for (let i = 0; i < bytes.length; i += 2) {
      const id = bytes[i], len = bytes[i + 1];
      for (let k = 0; k < len && p < size; k++) arr[p++] = id;
    }
    return arr;
  }
  CF.rleEncode = rleEncode; CF.rleDecode = rleDecode;

  const b64e = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
  const b64d = (s) => { const bin = atob(s), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8; };

  function initEditTracking(w) {
    if (w._tracked) return;
    w._tracked = true;
    w.edited = new Set();
    const orig = w.set;
    w.set = function (x, y, z, id) {
      const r = orig(x, y, z, id);
      if (r) w.edited.add(Math.floor(x / 16) + ',' + Math.floor(z / 16));
      return r;
    };
    const origF = w.flatSet; // #053: model meta (slab/stairs/torch/bed bits) also marks a chunk edited
    if (origF) w.flatSet = function (x, y, z, fm) { origF(x, y, z, fm); w.edited.add(Math.floor(x / 16) + ',' + Math.floor(z / 16)); };
  }

  function packDim(w, besMap) { // #055 v2: per-dimension chunks/flats/bes payload
    initEditTracking(w);
    const e = { chunks: {}, flats: {} };
    const keys = [...w.edited];
    keys.sort((a, b) => {
      const [ax, az] = a.split(',').map(Number), [bx, bz] = b.split(',').map(Number);
      return Math.hypot(bx * 16, bz * 16) - Math.hypot(ax * 16, az * 16);
    });
    for (const k of keys) {
      const c = w.chunks.get(k);
      if (!c) continue;
      e.chunks[k] = b64e(rleEncode(c.arr));
      if (c.flat) {
        let any = false;
        for (let i = 0; i < c.flat.length && !any; i++) if (c.flat[i]) any = true;
        if (any) e.flats[k] = b64e(rleEncode(c.flat));
      }
    }
    e.bes = besMap || {};
    return e;
  }

  function saveNow() {
    const w = CF.world;
    if (!w) return null;
    if (CF.dims) CF.dims[CF.activeDim || 'over'] = w; // live pointer (warp/load keep dims fresh)
    const active = CF.activeDim || 'over';
    const src = CF.dims ? CF.dims : { over: w };
    const save = { v: 2, seed: w.seed, time: CF.ticks, active, dims: {} };
    let total = 0;
    for (const key of Object.keys(src)) {
      const dw = src[key];
      if (!dw) continue;
      const besMap = CF.dimBes ? CF.dimBes[key] : (key === active ? CF.blockEntities : {});
      const e = packDim(dw, besMap);
      if (key === active && CF.player) e.player = { pos: CF.player.pos.map((v) => +v.toFixed(2)), yaw: CF.player.yaw, pitch: CF.player.pitch, sel: CF.sel };
      save.dims[key] = e;
      total += Object.keys(e.chunks).length;
    }
    let warn = null;
    for (;;) {
      try { localStorage.setItem(KEY, JSON.stringify(save)); break; }
      catch (err) {
        const es = save.dims[active];
        const ks = es ? Object.keys(es.chunks) : [];
        if (!ks.length) { warn = 'quota: nothing left'; break; }
        delete es.chunks[ks[ks.length - 1]]; // evict farthest active-dim chunk
        warn = 'quota: evicted far edited chunk';
      }
    }
    CF.saveInfo = { bytes: JSON.stringify(save).length, chunks: total, warn };
    return CF.saveInfo;
  }

  function applyDim(seed, key, d) { // build/rehydrate one dimension; returns world or null
    if (!d && key === 'nether') return null;
    const dw = CF.makeWorld(key === 'nether' ? ((seed ^ 0x5EED) >>> 0) : seed, key === 'nether' ? { nether: true } : undefined); // #056: rehydrate nether with REAL nether gen
    initEditTracking(dw);
    for (const [k, b] of Object.entries((d && d.chunks) || {})) {
      const [cx, cz] = k.split(',').map(Number);
      dw.generate(cx, cz);
      const c = dw.chunks.get(k);
      if (c) { c.arr.set(rleDecode(b64d(b), c.arr.length)); dw.edited.add(k); dw.dirty.add(k); }
      if (c && d.flats && d.flats[k]) { if (!c.flat) c.flat = new Uint8Array(16 * 128 * 16); c.flat.set(rleDecode(b64d(d.flats[k]), c.flat.length)); dw.dirty.add(k); } // #053 meta bits (lazy flat!)
    }
    return dw;
  }

  function loadNow() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return false; }
    if (!raw) return false;
    loadNow._raw = String(raw).slice(0, 12);
    let save = null;
    try { save = JSON.parse(raw); } catch (e) { loadNow._rej = 'parse'; localStorage.removeItem(KEY); return false; }
    if (!save || (save.v !== 1 && save.v !== 2)) { loadNow._rej = 'ver'; localStorage.removeItem(KEY); return false; }
    loadNow._migrated = save.v === 1; // #055 v1 -> v2: one world + top-level chunks/flats/bes becomes dims.over
    let dims, active, bes;
    if (save.v === 1) {
      dims = { over: null, nether: null };
      active = 'over';
      bes = { over: save.bes || {}, nether: {} };
      const dw = applyDim(save.seed, 'over', { chunks: save.chunks, flats: save.flats });
      dims.over = dw;
      if (save.player && CF.player) { CF.player.tp(...save.player.pos); CF.player.yaw = save.player.yaw; CF.player.pitch = save.player.pitch; }
      if (CF.player) CF.sel = save.player ? save.player.sel || 0 : 0;
    } else {
      dims = { over: null, nether: null };
      active = save.active === 'nether' ? 'nether' : 'over';
      bes = { over: {}, nether: {} };
      for (const key of ['over', 'nether']) {
        const d = save.dims && save.dims[key];
        if (!d && !save.dims) continue;
        dims[key] = applyDim(save.seed, key, d);
        if (d) bes[key] = d.bes || {};
        if (d && d.player && key === active && CF.player) {
          CF.player.tp(...d.player.pos); CF.player.yaw = d.player.yaw; CF.player.pitch = d.player.pitch; CF.sel = d.player.sel || 0;
        }
      }
    }
    if (!dims.over) dims.over = applyDim(save.seed, 'over', null);
    CF.world = dims[active] || dims.over;
    CF.activeDim = dims[active] ? active : 'over';
    CF.dims = dims;
    CF.dimBes = bes;
    CF.blockEntities = bes[CF.activeDim] || (bes[CF.activeDim] = {});
    CF.renderReset && CF.renderReset();
    CF.mobs && CF.mobs.clear(); // mobs are transient (persistence = backlog #044)
    if (CF.tnts) CF.tnts.length = 0; // primed TNT not persisted either
    if (CF.itemEnts) CF.itemEnts.length = 0; // #060 dropped items are transient
    CF.ticks = save.time || 0;
    // #040: restore container BEs per dim (drop orphans whose block is gone, e.g. blown up before saving)
    for (const key of ['over', 'nether']) {
      const dw = dims[key];
      if (!dw) { bes[key] = {}; continue; }
      const kept = {};
      for (const [k, b] of Object.entries(bes[key] || {})) {
        const [bx, by, bz] = k.split(',').map(Number);
        const nm = CF.BY_ID[dw.get(bx, by, bz)];
        if (nm && ((nm.name === 'chest' && b.type === 'chest') || (nm.name === 'furnace' && b.type === 'furnace'))) kept[k] = b;
      }
      bes[key] = kept;
    }
    CF.blockEntities = bes[CF.activeDim];
    CF.loaded = true;
    return true;
  }

  CF.saveNow = saveNow;
  CF.trackWorld = initEditTracking; // #055: newly created worlds (warp nether!) must be tracked BEFORE their first edit or changes never save
  CF.loadNow = loadNow;
  if (CF.world) initEditTracking(CF.world);

  setInterval(() => { if (CF.world && CF.player && CF.ticks > 10 && !CF.autosavePaused) saveNow(); }, 10000);
  window.addEventListener('beforeunload', () => saveNow());
  if (location.search.includes('new=1')) { try { localStorage.removeItem(KEY); } catch (e) {} }
  else if (CF.world) { setTimeout(() => loadNow(), 0); } // auto-load if a save exists (fresh profiles: no-op)

  CF.persistTests = async (r) => {
    const W = CF.world;
    // RLE unit
    const sample = new Uint8Array(400); sample.fill(3); sample[100] = 1; sample[399] = 5;
    const back = rleDecode(rleEncode(sample), 400);
    CF.assert(r, 'save.rle-unit', back.every((v, i) => v === sample[i]));
    // world edit + tower, save, reload
    W.ensureAround(8, 8, 3);
    for (let i = 0; i < 20 && W.stats().queue; i++) W.tick();
    const tx = 8, tz = 8, th = W.heightAt(tx, tz);
    for (let y = th + 1; y <= th + 5; y++) W.set(tx, y, tz, CF.IDOF['cobblestone']);
    W.set(tx, th + 6, tz, CF.IDOF['stone_stairs']); W.flatSet(tx, th + 6, tz, 2); // #053: meta bits must survive the roundtrip too
    CF.player.tp(8.5, th + 1, 8.5); CF.player.yaw = 1.23; CF.player.pitch = -0.33;
    for (let i = 0; i < 40; i++) W.tick(); // spread/gravity churn
    const info = saveNow();
    CF.assert(r, 'save.size(' + info.bytes + 'B)', info.bytes < 150000 && info.chunks >= 1);
    CF.world = CF.makeWorld(999999); // world with no tower, wrong seed
    CF.renderReset && CF.renderReset();
    const ok = loadNow();
    CF.assert(r, 'save.load', ok === true);
    let tower = 0;
    for (let y = th + 1; y <= th + 5; y++) if (CF.world.get(tx, y, tz) === CF.IDOF['cobblestone']) tower++;
    CF.assert(r, 'save.edits(' + tower + ')', tower === 5);
    CF.assert(r, 'save.flat(' + CF.world.get(tx, th + 6, tz) + '/' + (CF.world.flatAt ? CF.world.flatAt(tx, th + 6, tz) : 'NA') + ')',
      CF.world.get(tx, th + 6, tz) === CF.IDOF['stone_stairs'] && CF.world.flatAt(tx, th + 6, tz) === 2);
    CF.assert(r, 'save.seed', CF.world.seed === W.seed);
    CF.assert(r, 'save.player', Math.abs(CF.player.yaw - 1.23) < 1e-6 && Math.abs(CF.player.pos[1] - (th + 1)) < 0.01);
    // corrupt save -> clean fallback
    CF.autosavePaused = true;
    localStorage.setItem('cf-save-1', '{corrupt!');
    const rawDbg = (localStorage.getItem('cf-save-1') || '').slice(0, 14);
    const bad = loadNow();
    CF.assert(r, 'save.corrupt(bad=' + bad + ',raw=' + rawDbg + ',rawIn=' + loadNow._raw + ',rej=' + (loadNow._rej || 'pass') + ')',
      bad === false && !!CF.world && CF.world.heightAt(0, 0) > 0);
    localStorage.removeItem('cf-save-1');
    CF.autosavePaused = false;
    // #055 persist v2: markers in BOTH dims survive save->load; a v1 blob auto-migrates into dims.over
    {
      CF.autosavePaused = true;
      const dw0 = CF.dims, overW = CF.world, nW = dw0 && dw0.nether;
      const ox = 12, oz = 12, oy = overW.heightAt(ox, oz);
      overW.set(ox, oy, oz, CF.IDOF['stone']);
      CF.player.tp(ox + 0.5, oy + 3, oz + 5);
      let okN = false;
      if (nW) {
        const nx = 20, nz = 20;
        nW.ensureAround(nx, nz, 1);
        for (let i = 0; i < 40 && nW.stats().queue; i++) nW.tick();
        const ny = nW.heightAt(nx, nz);
        nW.set(nx, ny, nz, CF.IDOF['gold_block']);
        CF.saveNow(); CF.loadNow();
        const nw2 = CF.dims.nether;
        if (nw2) {
          nw2.ensureAround(nx, nz, 1);
          for (let i = 0; i < 40 && nw2.stats().queue; i++) nw2.tick();
          okN = nw2.get(nx, ny, nz) === CF.IDOF['gold_block'];
        }
      }
      const okOver = CF.dims.over.get(ox, oy, oz) === CF.IDOF['stone'];
      // hand-built v1 blob migrates: over-only, player/sel/time land
      const seedV1 = CF.dims.over.seed;
      localStorage.setItem('cf-save-1', JSON.stringify({ v: 1, seed: seedV1, time: 999, player: { pos: [8.5, 80, 8.5], yaw: 0.5, pitch: -0.2, sel: 4 }, chunks: {}, bes: {} }));
      const mok = CF.loadNow();
      const migOk = mok === true && CF.loadNow._migrated === true && CF.activeDim === 'over' && CF.ticks === 999 && CF.sel === 4 && Math.abs(CF.player.yaw - 0.5) < 1e-9;
      localStorage.removeItem('cf-save-1');
      CF.autosavePaused = false;
      CF.assert(r, 'save.v2(' + okOver + ',' + okN + ',mig=' + migOk + ')', okOver && okN && migOk);
    }
  };
})();

// F3 debug overlay (Tier-1): fps, xyz, chunk, faced direction, aimed block, light-ish stats.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const div = document.createElement('div');
  div.id = 'f3';
  div.style.cssText = 'position:fixed;top:4px;left:4px;color:#fff;font:12px monospace;' +
    'text-shadow:1px 1px 0 #000;background:rgba(0,0,0,.35);padding:4px;display:none;z-index:10;pointer-events:none';
  if (document.body) document.body.appendChild(div);
  let on = false, frames = 0, fps = 0, last = performance.now();
  window.addEventListener('keydown', (e) => { if (e.code === 'F3') { on = !on; div.style.display = on ? 'block' : 'none'; } });
  setInterval(() => {
    frames++;
    const now = performance.now();
    if (now - last > 500) { fps = Math.round(frames * 1000 / (now - last)); frames = 0; last = now; }
    if (!on) return;
    const p = CF.player, t = CF.aim && CF.aim();
    const b = t ? CF.BY_ID[CF.world.get(t.x, t.y, t.z)] : null;
    const lt = t ? CF.world.lightAt(t.x, t.y + (t.face ? t.face[1] : 0), t.z) : 0;
    const bio = p && CF.world.biome ? CF.world.biome(Math.floor(p.pos[0]), Math.floor(p.pos[2])) : '-';
    div.textContent = 'Cubeforge F3\n' +
      `${fps} fps  ticks ${CF.ticks}` + (CF.simMs !== undefined ? `  sim ${CF.simMs.toFixed(1)}ms` : '') + '\n' +
      (p ? `XYZ: ${p.pos.map((v) => v.toFixed(2)).join(' / ')}\n` +
        `Chunk: ${Math.floor(p.pos[0] / 16)}, ${Math.floor(p.pos[2] / 16)}  facing ${yawFace(p.yaw)}  biome ${bio}\n` : '') +
      `Target: ${b ? b.name + (b.variant !== 'default' ? ':' + b.variant : '') + ` [${t.x} ${t.y} ${t.z}]  light ${Math.max(lt >> 4, 0)}/${lt & 15}` : 'none'}\n` +
      `Time: ${CF.timeOfDay ? CF.timeOfDay() : 0}  Daylight: ${CF.dayFactor ? Math.round(CF.dayFactor() * 100) : 100}%\n` +

  CF.mobHitAt = (o, d, maxD) => {

  // --- arrow projectiles (skeleton). Ballistic w/ predictive aim so they actually threaten.

  // ============================ per-tick: physics, AI, burn, spawn ============================
  CF.mobTick = (dt = 0.05) => {

    for (const m of M.list.slice()) {

      else if (T.passive) aiPassive(m, T, P);
      M.step(m, dt);
      if (m.dead) { M.remove(m); continue; }

      }
    }

  // --- render feed: world-space boxes, vertex layout matches chunk stream (pos3 + uv/shade + light)

/* ==== src/explode.js ==== */
// Explosion (#037 creeper / #042 TNT): 1.12.2 ray-marched block destruction + entity damage.
// Algorithm per docs/REFERENCE + wiki: 16^3 rays from centre, intensity = power*rand(0.7..1.3),
// march 0.3/step, subtract (blastRes+0.3)*0.3 per solid crossed and 0.22500001 after; destroy if >0.
// Entity: impact=(1-dist/(2*power))*exposure; damage=((impact^2+impact)/2)*(7*2*power)+1 (NORMAL, no scaling).
// Block-drop-as-item (prob 1/power) deferred to item-entities (#044); we do destruction (mobGriefing on).
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  // 1.12.2 blast resistance by name (default 2.0). obsidian/bedrock effectively indestructible.
  const BLAST = {
    bedrock: 3600, obsidian: 1200, enchanting_table: 1200, anvil: 1200, mob_spawner: 1200,
    stone: 6, cobblestone: 6, mossy_cobblestone: 6, brick_block: 6, stonebrick: 6, planks: 3,
    log: 4, crafting_table: 2.5, furnace: 3.5, coal_ore: 3, iron_ore: 3, gold_ore: 3, diamond_ore: 3,
    emerald_ore: 3, lapis_ore: 3, redstone_ore: 3, quartz_ore: 3,
    dirt: 0.5, grass: 0.6, sand: 0.5, gravel: 0.6, clay: 0.6, sandstone: 0.8, snow: 0.2, snow_layer: 0.2,
    glass: 0.3, glowstone: 0.3, leaves: 0.2, torch: 0, bookshelf: 1.5, tnt: 0,
  };
  CF.blastRes = (id) => { const b = CF.BY_ID[id]; const raw = b ? (BLAST[b.name] != null ? BLAST[b.name] : 2.0) : 0; return raw / 5; }; // MC divides explosionResistance by 5 (stone 6->1.2, obsidian 1200->240)

  function exposure(x, y, z, ex, ey, ez) { // fraction of sampled path points that are non-solid
    let clear = 0, n = 6;
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 1);
      const id = CF.world.get(Math.floor(x + (ex - x) * t), Math.floor(y + (ey - y) * t), Math.floor(z + (ez - z) * t));
      if (!CF.solidAt(id)) clear++;
    }
    return clear / n;
  }

  CF.explode = (x, y, z, power) => {
    const W = CF.world, destroyed = new Set();
    for (let rx = 0; rx < 16; rx++) for (let ry = 0; ry < 16; ry++) for (let rz = 0; rz < 16; rz++) {
      let dx = rx / 15 * 2 - 1, dy = ry / 15 * 2 - 1, dz = rz / 15 * 2 - 1;
      const len = Math.hypot(dx, dy, dz) || 1; dx /= len; dy /= len; dz /= len;
      let intensity = power * (0.7 + Math.random() * 0.6);
      for (let d = 0; d < power * 2 && intensity > 0; d += 0.3) {
        const bx = Math.floor(x + dx * d), by = Math.floor(y + dy * d), bz = Math.floor(z + dz * d);
        const id = W.get(bx, by, bz);
        if (id) {
          const res = CF.blastRes(id);
          intensity -= (res + 0.3) * 0.3;
          if (intensity > 0) destroyed.add(bx + ',' + by + ',' + bz);
          intensity -= 0.22500001;
        }
      }
    }
    for (const k of destroyed) { const [bx, by, bz] = k.split(',').map(Number); if (W.get(bx, by, bz)) W.set(bx, by, bz, 0); }
    // entity damage: players + mobs
    const hurt = (pos, isPlayer) => {
      const dist = Math.hypot(pos[0] - x, pos[1] - y, pos[2] - z);
      if (dist > power * 2) return 0;
      const impact = (1 - dist / (2 * power)) * exposure(x, y, z, pos[0], pos[1], pos[2]);
      if (impact <= 0) return 0;
      const dmg = ((impact * impact + impact) / 2) * (7 * 2 * power) + 1;
      return Math.round(dmg * 10) / 10;
    };
    const result = { destroyed: destroyed.size, playerDmg: 0 };
    if (CF.player && CF.survival !== undefined) {
      const pd = hurt(CF.player.pos, true);
      if (pd > 0) { result.playerDmg = pd; CF.damage(pd, 'explosion'); }
    }
    if (CF.mobs) for (const m of CF.mobs.list.slice()) {
      const md = hurt(m.pos, false);
      if (md > 0 && CF.mobs.hurt) CF.mobs.hurt(m, md, 'explosion');
    }
    CF.shake = 18; // render/camera shake counter (#037+ polish)
    return result;
  };
})();

// TNT (#042): craft, place, prime with flint & steel, 80-tick fuse, chain reaction, power-4 explosion.

window.CF = window.CF || {};
(function () {
  const CF = window.CF;

  if (!meta.tnt_side) meta.tnt_side = { x: 16, y: 160, w: 16, h: 16, src: 'generated:tnt.js' }; // free atlas cell (post stride-fix layout)
  if (!meta.tnt_top) meta.tnt_top = { x: 32, y: 160, w: 16, h: 16, src: 'generated:tnt.js' };

  CF.FUSE = 80; // 1.12.2: tnt fuse = 4s = 80 game ticks
  CF.tnts = CF.tnts || [];

    if (CF.world.get(x, y, z) !== CF.IDOF['tnt']) return false;
    CF.world.set(x, y, z, 0);
    CF.tnts.push({ pos: [x + 0.5, y + 0.5, z + 0.5], fuse: fuse == null ? CF.FUSE : fuse });
    return true;
  };

    for (let i = CF.tnts.length - 1; i >= 0; i--) {
      const t = CF.tnts[i];
      if (--t.fuse > 0) continue;
      CF.tnts.splice(i, 1);

      if (CF.explode) CF.explode(t.pos[0], t.pos[1], t.pos[2], power);

      const bx = Math.floor(t.pos[0]), by = Math.floor(t.pos[1]), bz = Math.floor(t.pos[2]), R = Math.ceil(power * 1.5);

        if (dx * dx + dy * dy + dz * dz > R * R) continue;

    const bx = 280, by = 100, bz = 100;

    for (let x = bx - 5; x <= bx + 5; x++) for (let z = bz - 5; z <= bz + 5; z++) for (let y = by - 3; y <= by; y++) W.set(x, y, z, W.get(x, y, z) === CF.IDOF['bedrock'] ? CF.IDOF['bedrock'] : (y === by ? CF.IDOF['stone'] : (CF.IDOF['dirt'])));
    for (let i = 0; i < 10; i++) W.tick();

    W.set(bx + 1, by + 1, bz, CF.IDOF['tnt']); W.set(bx + 2, by + 1, bz, CF.IDOF['tnt']);
    CF.primeTNT(bx, by + 1, bz, 14); // mid-fuse -> flashing
    CF.tntTick = () => {};

      '<div style="margin-top:6px;opacity:0.7">LMB break &middot; RMB place &middot; Q drop &middot; E inventory &middot; F4 survival &middot; F3 debug</div>';

        gl.clearColor(0.6, 0.75, 1.0, 1); gl.clear(gl.COLOR_BUFFER_BIT);

  // ---- #055 DIMENSIONS (SPK-7 design): CF.dims registry + CF.warp hot-swap + 1.12 portal frames ----
  // world instances are closure-pure (SPK-7a); swap = CF.world + renderReset + entity wipes + BE map swap.
  CF.dims = null; // boot() fills {over:CF.world, nether:null} once items/BE exist; loadNow keeps it fresh
  function dimBoot() {
    if (CF.dims) return;

  }
  CF.dimBootHook = dimBoot;

  CF.portalFrameAt = (w, ix, iy, iz) => { // 1.12: 2 wide x 3 tall air interior, obsidian sill/cap/side pillars, corners OPTIONAL
    const OBS = CF.IDOF['obsidian'];
    for (let y = iy; y <= iy + 2; y++) if (w.get(ix, y, iz) || w.get(ix + 1, y, iz)) return false; // interior must be air

    for (let y = iy; y <= iy + 2; y++) if (w.get(ix - 1, y, iz) !== OBS || w.get(ix + 2, y, iz) !== OBS) return false; // pillars
    return true;
  };
  CF.portalTryIgnite = (hit) => { // 1.12: RMB the bottom-inside obsidian (top face) with flint & steel; brute-forces the 6 candidate origins
    if (!hit || !hit.face) return false;

    if (held !== 'flint_and_steel') return false;
    const w = CF.world, PT = CF.IDOF['portal'];
    const tx = hit.x + hit.face[0], ty = hit.y + hit.face[1], tz = hit.z + hit.face[2]; // the air cell clicked across

      if (!CF.portalFrameAt(w, ox, oy, tz)) continue;
      for (let x = ox; x <= ox + 1; x++) for (let y = oy; y <= oy + 2; y++) w.set(x, y, tz, PT);
      w.ensureLight(tx >> 4, tz >> 4);
      return true;
    }
    return false;
  };
  function buildNetherPortal(w, sx, sz) { // 1.12 spirit: the destination portal is BUILT if absent - deterministic carve+frame
    const OBS = CF.IDOF['obsidian'], P = CF.IDOF['portal'];
    w.ensureAround(sx, sz, 2); // set() is a silent no-op on UNGENERATED chunks - generate first
    for (let i = 0; i < 80 && w.stats().queue; i++) w.tick();
    const ix = sx + 1, base = Math.max(w.heightAt(sx, sz) + 1, 5); // #056: stand the portal ON the terrain floor (was >=64 float when nether gen landed at 32..37)
    for (let x = ix - 1; x <= ix + 2; x++) for (let y = base - 1; y <= base + 3; y++) for (let z = sz - 1; z <= sz + 1; z++) if (w.get(x, y, z)) w.set(x, y, z, 0);
    for (const x of [ix, ix + 1]) { w.set(x, base - 1, sz, OBS); w.set(x, base + 3, sz, OBS); } // sill + cap
    for (let y = base; y <= base + 2; y++) { w.set(ix - 1, y, sz, OBS); w.set(ix + 2, y, sz, OBS); } // pillars
    for (let x = ix; x <= ix + 1; x++) for (let y = base; y <= base + 2; y++) w.set(x, y, sz, P);
    return [ix, base, sz];
  }
  CF.warp = (toKey, entryPos) => {
    dimBoot();
    const fromKey = CF.activeDim;
    if (toKey === fromKey || (toKey !== 'over' && toKey !== 'nether')) return false;
    let target;
    if (toKey === 'nether') {
      if (!CF.dims.nether) {
        CF.dims.nether = CF.makeWorld((CF.dims.over.seed ^ 0x5EED) >>> 0, { nether: true }); // #056 real nether gen
        CF.trackWorld && CF.trackWorld(CF.dims.nether); // #055: track BEFORE first edit (PLAYBOOK lesson re-applied)
      }
      target = CF.dims.nether;
    } else target = CF.dims.over;
    if (!target) return false;
    const P = CF.player;
    const fromPos = entryPos || P.pos.slice();
    // BE maps are per-dimension; the shared object must be SWAPPED (all consumers read CF.blockEntities live)
    CF.dimBes[fromKey] = CF.blockEntities;
    CF.dims[fromKey] = CF.world;
    CF.blockEntities = CF.dimBes[toKey] || (CF.dimBes[toKey] = {});
    CF.world = target;
    CF.renderReset && CF.renderReset();
    CF.mobs && CF.mobs.clear();
    if (CF.tnts) CF.tnts.length = 0;
    if (CF.itemEnts) CF.itemEnts.length = 0; // dropped items stay behind (documented v1)
    if (CF.projectiles) CF.projectiles.length = 0;
    // 8:1 (1.12): over->nether divides, nether->over multiplies
    const sx = toKey === 'nether' ? Math.floor(fromPos[0] / 8) : Math.floor(fromPos[0] * 8);
    const sz = toKey === 'nether' ? Math.floor(fromPos[2] / 8) : Math.floor(fromPos[2] * 8);
    target.ensureAround(sx, sz, 2);
    for (let i = 0; i < 60 && target.stats().queue; i++) target.tick();
    let stand = null;
    for (let r = 0; r <= 16 && !stand; r++) for (let dx = -r; dx <= r && !stand; dx++) for (let dz = -r; dz <= r && !stand; dz++) {
      if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
      for (let y = 5; y < 110 && !stand; y++) if (target.get(sx + dx, y, sz + dz) === CF.IDOF['portal']) stand = [sx + dx, y - 1, sz + dz]; // stand on the block beneath portal base row? portals fill from sill+1: feet = portal base y
    }
    if (stand) P.tp(stand[0] + 0.5, stand[1] + 1 + 0.92, stand[2] + 0.5);
    else {
      const cell = buildNetherPortal(target, sx, sz);
      if (cell) P.tp(cell[0] + 0.5, cell[1] + 0.95, cell[2] + 0.5);
    }
    target.ensureAround(P.pos[0], P.pos[2], 4);
    for (let i = 0; i < 80 && (target.stats().queue || target.dirty.size); i++) { target.tick(); CF.renderTick(); }
    P.vel[0] = P.vel[1] = P.vel[2] = 0; P.prevPos = P.pos.slice();
    CF.activeDim = toKey;
    CF.warpArmed = false; // must leave a portal cell before the next warp fires (MC cooldown analog)
    CF.warpCount = (CF.warpCount || 0) + 1;
    return true;
  };
  CF.portalStepTick = () => { // called from the sim loop: step INTO a portal block warps (1.12 player is instant)
    dimBoot();
    const P = CF.player;
    const inCell = CF.world.get(Math.floor(P.pos[0]), Math.floor(P.pos[1] - 0.9 + 0.4), Math.floor(P.pos[2])) === CF.IDOF['portal'];
    if (!inCell) CF.warpArmed = true;
    if (inCell && CF.warpArmed !== false) CF.warp(CF.activeDim === 'over' ? 'nether' : 'over', [P.pos[0], P.pos[1] - 1.2, P.pos[2]]);
  };
})();

// Test + shot harness. Hash-routed: #test, #shot=NAME.
// Results go to document.title as TESTRESULT:{encodeURIComponent(JSON)} for tools/test.mjs.
(function () {
  const CF = window.CF;
  function report(result) {
    document.title = 'TESTRESULT:' + encodeURIComponent(JSON.stringify(result));
  }
  CF.assert = (results, name, cond) => { (cond ? results.pass : results.fail).push(name); };

  const SUITES = [
    { name: 'boot', run: async (r) => {
        for (let i = 0; i < 200 && !CF.ready; i++) await new Promise((res) => setTimeout(res, 50));
        CF.assert(r, 'boot.ready', CF.ready);
        CF.assert(r, 'gl.webgl2', !!(CF.gl && CF.gl.getParameter && /WebGL 2/.test(CF.gl.getParameter(CF.gl.VERSION))));
        const t0 = CF.ticks;
        await new Promise((res) => setTimeout(res, 600));
        CF.assert(r, 'loop.ticks', CF.ticks > t0 + 5);
        CF.stopGameLoop && CF.stopGameLoop(); // suites drive sim manually; frees CPU + virtual time
        CF.assert(r, 'registry.json', typeof CF.REGISTRY === 'object' && CF.REGISTRY !== null);
        if (window.__ATLAS_B64) {
          const img = new Image();
          const ok = await new Promise((res) => { img.onload = () => res(true); img.onerror = () => res(false); img.src = 'data:image/png;base64,' + window.__ATLAS_B64; });
          CF.assert(r, 'atlas.decoded', ok && img.width === (window.__ATLAS_SIZE || 128) && img.height === (window.__ATLAS_SIZE || 128));
        }
        if (typeof CF.registryTests === 'function') await CF.registryTests(r);
      } },
    { name: 'world', run: (r) => CF.worldTests && CF.worldTests(r) },
    { name: 'light', run: (r) => CF.lightTests && CF.lightTests(r) },
    { name: 'grass', slow: true, run: (r) => CF.grassTests && CF.grassTests(r) },
    { name: 'time', slow: true, run: (r) => CF.timeTests && CF.timeTests(r) },
    { name: 'fluids', slow: true, run: (r) => CF.fluidTests && CF.fluidTests(r) },
    { name: 'render', run: (r) => CF.rendererTests && CF.rendererTests(r) },
    { name: 'player', run: (r) => CF.playerTests && CF.playerTests(r) },
    { name: 'interact', run: (r) => CF.interactTests && CF.interactTests(r) },
    { name: 'f3', run: (r) => CF.f3Tests && CF.f3Tests(r) },
    { name: 'items', run: (r) => CF.itemTests && CF.itemTests(r) },
    { name: 'ui', run: (r) => CF.uiTests && CF.uiTests(r) },
    { name: 'survival', run: (r) => CF.survivalTests && CF.survivalTests(r) },
    { name: 'mobs', run: (r) => CF.mobTests && CF.mobTests(r) },
    { name: 'tnt', run: (r) => CF.tntTests && CF.tntTests(r) },
    { name: 'bed', run: (r) => CF.bedTests && CF.bedTests(r) },
    { name: 'save', run: (r) => CF.persistTests && CF.persistTests(r) },
  ];

  async function runTests(spec) {
    const r = { mode: 'test', pass: [], fail: [], errors: [], times: {}, ticks: 0, registry: null };
    let chosen = SUITES;
    if (spec === 'quick') chosen = SUITES.filter((s) => !s.slow);
    else if (spec && spec !== 'all') { const want = spec.split(','); chosen = SUITES.filter((s) => want.includes(s.name)); }
    try {
      for (const s of chosen) {
        const t0 = performance.now();
        await s.run(r);
        r.times[s.name] = Math.round(performance.now() - t0);
      }
    } catch (e) {
      r.fail.push('harness.threw: ' + (e && e.stack ? String(e.stack).split('\n').slice(0, 3).join(' | ') : e.message));
    }
    r.errors = CF.errors.slice(0, 20);
    r.ticks = CF.ticks;
    r.registry = Object.keys(CF.REGISTRY || {}).length;
    r.suites = chosen.map((s) => s.name);
    report(r);
  }

  async function runShot(name) {

    if (CF._pauseEl) CF._pauseEl.style.display = 'none'; // #060 overlay is a DOM layer - never in promo/qa frames

      out.faces[[dx, dy, dz]] = { nbLight: W.lightAt(nx, ny, nz), nbId: W.get(nx, ny, nz), sample: W.lightAt(Math.floor(fx), Math.floor(fy), Math.floor(fz)) };
