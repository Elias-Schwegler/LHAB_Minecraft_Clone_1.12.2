  function persp(f, a, n, z) { const t = 1 / Math.tan(f / 2); return [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (z + n) / (n - z), 2 * z * n / (n - z), 0, 0, -1, 0]; }
  function view(e, yaw, pitch) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const f = [sy * cp, sp, cy * cp], r = [cy, 0, -sy];
    const u = [f[1] * r[2] - f[2] * r[1], f[2] * r[0] - f[0] * r[2], f[0] * r[1] - f[1] * r[0]];
    const d = (a) => -(a[0] * e[0] + a[1] * e[1] + a[2] * e[2]);
    const rn = [-f[0], -f[1], -f[2]];
    return [r[0], r[1], r[2], d(r), u[0], u[1], u[2], d(u), rn[0], rn[1], rn[2], d(rn), 0, 0, 0, 1];
  }
  function mm(a, b) { const o = new Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[i * 4 + k] * b[k * 4 + j]; o[i * 4 + j] = s; } return o; }
  const tr = (m) => [m[0], m[4], m[8], m[12], m[1], m[5], m[9], m[13], m[2], m[6], m[10], m[14], m[3], m[7], m[11], m[15]];

  function draw(cam) {
    if (!gl || !texReady) return;
    const c = CF.canvas;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.useProgram(prog);
    gl.uniform1i(uTloc, 0);
    gl.viewport(0, 0, c.width, c.height);
    gl.clearColor(0.6, 0.75, 1.0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(prog);
    const VP = tr(mm(persp(70 * Math.PI / 180, c.width / c.height, 0.1, 300), view(cam.pos, cam.yaw, cam.pitch)));
    gl.uniformMatrix4fv(uVP, false, new Float32Array(VP));
    gl.uniform3f(uFog, 0.6, 0.75, 1.0);
    gl.uniform3fv(gl.getUniformLocation(prog, 'E'), new Float32Array(cam.pos));
    let tris = 0, drawn = 0;
    for (const [, e] of meshMap) {
      if (!e.n) continue;
      gl.bindVertexArray(e.vao);
      gl.drawArrays(gl.TRIANGLES, 0, e.n);
      tris += e.n / 3; drawn++;
    }
    stats.tris = tris; stats.drawn = drawn; stats.mapped = meshMap.size;
    stats.glErr = gl.getError();
  }

  CF.initRenderer = initRenderer;
  CF.renderTick = renderTick;
  CF.renderDraw = draw;

  CF.rendererTests = async (r) => {
    const t0 = performance.now();
    CF.world.ensureAround(0, 0, 4);
    for (let i = 0; i < 40 && CF.world.stats().queue; i++) CF.world.tick();
    for (let i = 0; i < 100 && (!stats.ready || meshMap.size < CF.world.chunks.size - 2); i++) {
      CF.renderTick(); await new Promise((res) => setTimeout(res, 50));
    }
    stats.meshAllMs = +(performance.now() - t0).toFixed(0);
    CF.renderDraw({ pos: [0, CF.world.heightAt(0, 0) + 12, 0], yaw: 0.6, pitch: -1.4 });
    CF.assert(r, 'render.mesh-all(' + stats.meshAllMs + 'ms)', stats.meshAllMs < 6000);
    const rp = new Uint8Array(4);
    gl.readPixels(Math.max(1, (CF.canvas.width / 2) | 0), Math.max(1, (CF.canvas.height / 2) | 0), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, rp);
    stats.px = [rp[0], rp[1], rp[2]];
    CF.assert(r, 'render.px(' + stats.px + ')', rp[0] + rp[1] + rp[2] < 500);
    stats.mapped = meshMap.size;
    CF.assert(r, 'render.atlas', stats.ready === true);
    CF.assert(r, 'render.merged(' + stats.mapped + '/' + CF.world.chunks.size + ')', stats.mapped >= CF.world.chunks.size - 2);
    CF.assert(r, 'render.tris(' + stats.tris + ',rebuilds=' + stats.rebuilds + ')', stats.tris > 1000);
    CF.assert(r, 'render.glErr', stats.glErr === 0);
    CF.assert(r, 'render.no-missing-tiles', stats.missingTiles.size === 0);
    const before = stats.rebuilds;
    CF.world.set(3, 40, 3, CF.IDOF['stone']);
    CF.renderTick(); CF.renderTick();
    CF.assert(r, 'render.dirty-fast', stats.rebuilds >= before + 1);
  };
})();

// Player: 1.12.2 AABB physics (0.6x1.8, eye 1.62), gravity, walk/sprint/sneak/jump/step-up.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const HW = 0.3, HH = 0.9, EYE = 1.62;
  const GRAV = 32, JUMP = 8.94, WALK = 4.317, SPRINT = 5.6, SNEAK = 1.3;

  const player = {
    pos: [8.5, 80, 8.5], vel: [0, 0, 0], yaw: Math.PI / 4, pitch: -0.2,
    onGround: false, input: { f: 0, s: 0, l: 0, r: 0, jump: false, sneak: false, sprint: false },
    tp(x, y, z) { this.pos = [x, y, z]; this.vel = [0, 0, 0]; },
  };
  CF.player = player;

  const solid = (x, y, z) => CF.solidAt(CF.world.get(Math.floor(x), Math.floor(y), Math.floor(z)));
  function boxHits(px, py, pz) {
    for (let x = Math.floor(px - HW); x <= Math.floor(px + HW); x++)
      for (let y = Math.floor(py - HH + 0.001); y <= Math.floor(py + HH - 0.001); y++)
        for (let z = Math.floor(pz - HW); z <= Math.floor(pz + HW); z++)
          if (solid(x, y, z)) return true;
    return false;
  }

  const keys = {};
  window.addEventListener('keydown', (e) => { keys[e.code] = true; if (['Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) e.preventDefault(); });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  function readInput() {
    const i = player.input;
    if (i.scripted) return;
    i.f = keys['KeyW'] ? 1 : 0; i.s = keys['KeyS'] ? 1 : 0;
    i.l = keys['KeyA'] ? 1 : 0; i.r = keys['KeyD'] ? 1 : 0;
    i.jump = !!keys['Space']; i.sneak = !!keys['ShiftLeft']; i.sprint = !!keys['ControlLeft'];
  }

  function tick(dt = 0.05) {
    if (!CF.world) return;
    readInput();
    const i = player.input;
    const speed = i.sprint ? SPRINT : i.sneak ? SNEAK : WALK;
    const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw);
    let mx = fx * (i.f - i.s) + Math.cos(player.yaw) * (i.r - i.l);
    let mz = fz * (i.f - i.s) - Math.sin(player.yaw) * (i.r - i.l);
    const ml = Math.hypot(mx, mz);
    if (ml > 0) { mx = mx / ml * speed; mz = mz / ml * speed; }
    player.vel[0] = mx; player.vel[2] = mz;
    player.vel[1] -= GRAV * dt;
    if (i.jump && player.onGround) { player.vel[1] = JUMP; player.onGround = false; }

    const [p0, p1, p2] = player.pos;
    let [x, y, z] = player.pos;
    // per-axis sweep
    let nx = x + player.vel[0] * dt;
    if (boxHits(nx, y, z)) {
      const stepY = y + 0.55;
      if (player.onGround && !boxHits(nx, stepY, z)) { y = stepY; nx = x + player.vel[0] * dt * 0.75; }
      else nx = x;
    }
    x = nx;
    let nz = z + player.vel[2] * dt;
    if (boxHits(x, y, nz)) {
      const stepY = y + 0.55;
      if (player.onGround && !boxHits(x, stepY, nz)) { y = stepY; nz = z + player.vel[2] * dt * 0.75; }
      else nz = z;
    }
    z = nz;
    let ny = y + player.vel[1] * dt;
    player.onGround = false;
    if (boxHits(x, ny, z)) {
      if (player.vel[1] < 0) { player.onGround = true; ny = Math.floor(y - HH) + 1 + HH; }
      else ny = Math.ceil(y + HH) - 1 - HH - 0.001;
      player.vel[1] = 0;
    }
    y = ny;
    // snap to exact ground: settle when tiny hop noise
    if (player.onGround && Math.abs(player.vel[1]) < 0.01) y = Math.round((y - HH) * 1000) / 1000;
    player.pos = [x, y, z];
    if (y < -20) player.tp(8.5, CF.world.heightAt(8, 8) + 2, 8.5); // void rescue

    if (!CF.freeCam) CF.camera = { pos: [x, y - HH + EYE, z], yaw: player.yaw, pitch: player.pitch };
  }
  player.tick = tick;
  CF.playerTick = tick;

  // Mouse look with pointer lock (real play; harness uses scripted input/yaw directly).
  document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement) {
      player.yaw += e.movementX * 0.0026;
      player.pitch = Math.max(-1.55, Math.min(1.55, player.pitch - e.movementY * 0.0026));
    }
  });
  document.addEventListener('click', () => { if (CF.canvas && CF.canvas.requestPointerLock) CF.canvas.requestPointerLock(); });

  CF.playerTests = async (r) => {
    const P = CF.player;
    const h = CF.world.heightAt(8, 8);
    P.tp(8.5, h + 10, 8.5);
    P.input.scripted = true;
    P.input.f = P.input.l = P.input.r = 0; P.input.jump = false;
    for (let i = 0; i < 40; i++) tick();
    CF.assert(r, 'player.land', P.onGround && P.pos[1] > h - 1 && P.pos[1] < h + 3);
    const y0 = P.pos[1], x0 = P.pos[0], z0 = P.pos[2];
    P.input.f = 1;
    for (let i = 0; i < 60; i++) tick();
    P.input.f = 0;
    const dist = Math.hypot(P.pos[0] - x0, P.pos[2] - z0);
    CF.assert(r, 'player.move(' + dist.toFixed(1) + ')', dist > 2);
    CF.assert(r, 'player.no-sink', P.pos[1] > h - 1 && P.onGround);
    P.tp(8.5, h + 12, 8.5);
    for (let i = 0; i < 80; i++) tick();
    const hAt = CF.world.heightAt(Math.floor(P.pos[0]), Math.floor(P.pos[2]));
    CF.assert(r, 'player.gravity-fall', P.onGround && P.pos[1] >= hAt);
    CF.assert(r, 'player.camera', !!CF.camera && Math.abs(CF.camera.pos[1] - (P.pos[1] - 0.9 + 1.62)) < 0.5);
  };
})();

// Interaction: DDA raycast, hold-to-break with 1.12 break-time formula + tier gate,
// place with player-overlap rule, hotbar selection, drops queue.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  const HAND_TIER = 0, HAND_SPEED = 1; // tool system comes later; hand for now

  CF.hotbar = ['grass', 'dirt', 'stone', 'cobblestone', 'planks', 'log', 'leaves', 'sand', 'glass'];
  CF.sel = 0;
  CF.drops = [];

  CF.hotId = () => {
    const n = CF.hotbar[CF.sel];
    const reg = CF.REGISTRY[n];
    if (!reg) return 0;
    const k = Object.keys(reg.variants)[0];
    return reg.variants[k].id;
  };

  function raycast(o, d, maxD) {
    let x = Math.floor(o[0]), y = Math.floor(o[1]), z = Math.floor(o[2]);
    const sx = d[0] > 0 ? 1 : -1, sy = d[1] > 0 ? 1 : -1, sz = d[2] > 0 ? 1 : -1;
    const dx = Math.abs(1 / (d[0] || 1e-9)), dy = Math.abs(1 / (d[1] || 1e-9)), dz = Math.abs(1 / (d[2] || 1e-9));
    let tx = ((sx > 0 ? x + 1 - o[0] : o[0] - x)) * dx;
    let ty = ((sy > 0 ? y + 1 - o[1] : o[1] - y)) * dy;
    let tz = ((sz > 0 ? z + 1 - o[2] : o[2] - z)) * dz;
    let t = 0, face = [0, 0, 0];
    for (let i = 0; i < 120; i++) {
      if (CF.solidAt(CF.world.get(x, y, z))) return { x, y, z, face };
      if (tx < ty && tx < tz) { x += sx; t = tx; tx += dx; face = [-sx, 0, 0]; }
      else if (ty < tz) { y += sy; t = ty; ty += dy; face = [0, -sy, 0]; }
      else { z += sz; t = tz; tz += dz; face = [0, 0, -sz]; }
      if (t > maxD) return null;
    }
    return null;
  }
  CF.raycast = raycast;

  CF.aim = () => {
    const p = CF.player;
    if (!p) return null;
    const cy = Math.cos(p.yaw), sy = Math.sin(p.yaw), cp = Math.cos(p.pitch), sp = Math.sin(p.pitch);
    return raycast([p.pos[0], p.pos[1] - 0.9 + 1.62, p.pos[2]], [sy * cp, sp, cy * cp], 5);
  };

  function breakTime(id) {
    const v = CF.BY_ID[id];
    if (!v) return Infinity;
    if (v.hardness < 0) return Infinity;
    const tierOk = HAND_TIER >= v.minTier || !v.tool;
    let t = v.hardness * 1.5 / HAND_SPEED;
    if (HAND_TIER < v.minTier) t *= 5; // 1.12: can dig but slow & dropless
    return t;
  }
  CF.breakTime = breakTime;

  CF.mining = null; // {x,y,z,progress,need}
  CF.mineStart = (hit) => {
    if (!hit) { CF.mining = null; return; }
    const id = CF.world.get(hit.x, hit.y, hit.z);
    CF.mining = { x: hit.x, y: hit.y, z: hit.z, progress: 0, need: breakTime(id) };
  };
  CF.mineTick = (dt) => {
    const m = CF.mining;
    if (!m) return null;
    if (!isFinite(m.need)) return null; // bedrock: unbreakable
    const id = CF.world.get(m.x, m.y, m.z);
    if (!id) { CF.mining = null; return null; }
    m.progress += dt;
    if (m.progress >= m.need) {
      const v = CF.BY_ID[id];
      const tierOk = HAND_TIER >= v.minTier || !v.tool;
      const drops = tierOk && v.drop ? [{ name: v.drop, n: 1, x: m.x + 0.5, y: m.y + 0.5, z: m.z + 0.5 }] : [];
      CF.world.set(m.x, m.y, m.z, 0);
      CF.drops.push(...drops);
      CF.mining = null;
      return { broke: [m.x, m.y, m.z], drops, noDrop: !tierOk };
    }
    return { progress: m.progress / m.need };
  };

  CF.place = (hit) => {
    if (!hit) return false;
    const tx = hit.x + hit.face[0], ty = hit.y + hit.face[1], tz = hit.z + hit.face[2];
    if (CF.world.get(tx, ty, tz)) return false;
    const p = CF.player;
    const ox = Math.abs(p.pos[0] - (tx + 0.5)) < 0.3 + 0.5 && Math.abs(p.pos[2] - (tz + 0.5)) < 0.3 + 0.5;
    const oy = p.pos[1] - 0.9 < ty + 1 && p.pos[1] + 0.9 > ty;
    if (ox && oy) return false;
    return CF.world.set(tx, ty, tz, CF.hotId());
  };

  // input wiring (real browser)
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('mousedown', (e) => {
    if (!CF.player) return;
    if (e.button === 0) CF.mineStart(CF.aim());
    if (e.button === 2) CF.place(CF.aim());
  });
  window.addEventListener('mouseup', () => { CF.mining = null; });
  window.addEventListener('wheel', (e) => { CF.sel = (CF.sel + (e.deltaY > 0 ? 1 : -1) + CF.hotbar.length) % CF.hotbar.length; });
  window.addEventListener('keydown', (e) => { if (e.code.startsWith('Digit')) { const n = +e.code[5]; if (n >= 1 && n <= 9) CF.sel = n - 1; } });

  // continuous mining from the sim tick (1.12: holding LMB continues)
  const origTick = CF.onTick;
  CF.onTick = () => {
    if (origTick) origTick();
    if (CF.mouseDown) { if (!CF.mining) CF.mineStart(CF.aim()); CF.mineTick(0.05); }
  };
  window.addEventListener('mousedown', (e) => { if (e.button === 0) CF.mouseDown = true; });
  window.addEventListener('mouseup', () => { CF.mouseDown = false; });

  CF.interactTests = async (r) => {
    const P = CF.player, IDOF = CF.IDOF;
    // place a dirt block under cursor by direct API: aim down at ground
    P.pitch = -1.4;
    const hit = CF.aim();
    CF.assert(r, 'interact.aim-hit', !!hit && CF.solidAt(CF.world.get(hit.x, hit.y, hit.z)));
    // break it: pick a floating dirt we place first
    const h = hit.y;
    CF.world.set(hit.x, h + 1, hit.z, IDOF['dirt']);
    CF.drops.length = 0;
    CF.mineStart({ x: hit.x, y: h + 1, z: hit.z });
    let broke = null, ticks = 0;
    while (ticks < 100 && !(broke && broke.broke)) { broke = CF.mineTick(0.05); ticks++; }
    CF.assert(r, 'interact.break-time(1.12 dirt=0.75s, got ' + (ticks * 0.05).toFixed(2) + ')', broke && broke.broke && Math.abs(ticks * 0.05 - 0.75) <= 0.15);
    CF.assert(r, 'interact.drop', broke.broke && broke.drops.length === 1 && broke.drops[0].name === 'dirt');
    CF.assert(r, 'interact.air', CF.world.get(hit.x, h + 1, hit.z) === 0);
    // stone by hand: 2.25*5=11.25s > 2s of mining -> not broken, no drop
    CF.world.set(hit.x, h + 1, hit.z, IDOF['stone']);
    CF.mineStart({ x: hit.x, y: h + 1, z: hit.z });
    for (let i = 0; i < 40; i++) CF.mineTick(0.05);
    CF.assert(r, 'interact.slow-tier', CF.world.get(hit.x, h + 1, hit.z) === IDOF['stone']);
    const need = CF.breakTime(IDOF['stone']);
    CF.assert(r, 'interact.slow-time(' + need + 's)', Math.abs(need - 11.25) < 0.01);
    CF.mining = null;
    CF.world.set(hit.x, h + 1, hit.z, 0);
    // bedrock unbreakable
    CF.assert(r, 'interact.bedrock', !isFinite(CF.breakTime(IDOF['bedrock'])));
    // place: aim ~2 blocks ahead (not own column!), place selected hotbar block
    CF.sel = 1; // dirt
    P.pitch = -0.5;
    const g = CF.aim();
    const placed = CF.place(g);
    const tg = [g.x + g.face[0], g.y + g.face[1], g.z + g.face[2]];
    CF.assert(r, 'interact.place', placed && CF.world.get(tg[0], tg[1], tg[2]) === IDOF['dirt']);
    CF.world.set(tg[0], tg[1], tg[2], 0);
    // place into self fails: craft synthetic hit targeting player's own feet cell
    const cx = Math.floor(P.pos[0]), cy = Math.floor(P.pos[1] - 0.45), cz = Math.floor(P.pos[2]);
    CF.world.set(cx, cy, cz, 0);
    const self = CF.place({ x: cx - 1, y: cy, z: cz, face: [1, 0, 0] });
    CF.assert(r, 'interact.no-self-place', !self && CF.world.get(cx, cy, cz) === 0);
  };
})();

// Cubeforge boot: WebGL2 canvas + fixed 20 UPS tick loop.
window.CF = window.CF || {};
(function () {
  const CF = window.CF;
  CF.errors = [];
  CF.ticks = 0;
  CF.ready = false;
  const origErr = console.error;
  console.error = function () { CF.errors.push(Array.from(arguments).map(String).join(' ')); origErr.apply(console, arguments); };
  window.addEventListener('error', (e) => CF.errors.push(String(e.message)));

  function init() {
    const canvas = document.getElementById('gl');
    const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
    if (!gl) { CF.errors.push('WebGL2 unavailable'); document.title = 'FATAL: no webgl2'; return; }
    CF.gl = gl; CF.canvas = canvas;
    function resize() {
      const w = canvas.clientWidth * devicePixelRatio, h = canvas.clientHeight * devicePixelRatio;
      if (canvas.width !== w | 0 || canvas.height !== h | 0) { canvas.width = w | 0; canvas.height = h | 0; }
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    CF.resize = resize;
    window.addEventListener('resize', resize);
    resize();
    gl.clearColor(0.6, 0.75, 1.0, 1); // sky placeholder until SPK-1 sky pass
    CF.ready = true;
    // Fixed-timestep SIM on setInterval (deterministic, works in headless virtual time);
    // RENDER on rAF. Sim never depends on rAF firing.
    setInterval(() => {
      if (CF.world) {
        const p = CF.player;
        CF.world.ensureAround(p ? p.pos[0] : 0, p ? p.pos[2] : 0, 4);
        CF.world.tick();
        CF.playerTick && CF.playerTick();
      }
      CF.renderTick && CF.renderTick();
      CF.onTick && CF.onTick();
      if (CF.renderDraw) CF.renderDraw(CF.camera || { pos: [8, CF.world ? CF.world.heightAt(0, 0) + 26 : 90, 8], yaw: 0.7, pitch: -0.9 });
      CF.ticks++;
    }, 50);
    function frame() {
      if (CF.renderDraw) {
        CF.renderDraw(CF.camera || { pos: [8, CF.world ? CF.world.heightAt(0, 0) + 26 : 90, 8], yaw: 0.7, pitch: -0.9 });
      } else {
        gl.clearColor(0.6, 0.75, 1.0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    CF.initRenderer && CF.initRenderer(gl);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

// Test + shot harness. Hash-routed: #test, #shot=NAME.
// Results go to document.title as TESTRESULT:{encodeURIComponent(JSON)} for tools/test.mjs.
(function () {
  const CF = window.CF;
  function report(result) {
    document.title = 'TESTRESULT:' + encodeURIComponent(JSON.stringify(result));
  }
  CF.assert = (results, name, cond) => { (cond ? results.pass : results.fail).push(name); };

  async function runTests() {
    const r = { mode: 'test', pass: [], fail: [], errors: [], ticks: 0, registry: null };
    try {
      for (let i = 0; i < 200 && !CF.ready; i++) await new Promise((res) => setTimeout(res, 50));
      CF.assert(r, 'boot.ready', CF.ready);
      CF.assert(r, 'gl.webgl2', !!(CF.gl && CF.gl.getParameter && /WebGL 2/.test(CF.gl.getParameter(CF.gl.VERSION))));
      const t0 = CF.ticks;
      await new Promise((res) => setTimeout(res, 600));
      CF.assert(r, 'loop.ticks', CF.ticks > t0 + 5);
      CF.assert(r, 'registry.json', typeof CF.REGISTRY === 'object' && CF.REGISTRY !== null);
      if (window.__ATLAS_B64) {
        const img = new Image();
        const ok = await new Promise((res) => { img.onload = () => res(true); img.onerror = () => res(false); img.src = 'data:image/png;base64,' + window.__ATLAS_B64; });
        CF.assert(r, 'atlas.decoded', ok && img.width === 128 && img.height === 128);
      }
      if (typeof CF.registryTests === 'function') await CF.registryTests(r);
      if (typeof CF.worldTests === 'function') await CF.worldTests(r);
      if (typeof CF.rendererTests === 'function') await CF.rendererTests(r);
      if (typeof CF.playerTests === 'function') await CF.playerTests(r);
      if (typeof CF.interactTests === 'function') await CF.interactTests(r);
    } catch (e) {
      r.fail.push('harness.threw: ' + e.message);
    }
    r.errors = CF.errors.slice(0, 20);
    r.ticks = CF.ticks;
    r.registry = Object.keys(CF.REGISTRY || {}).length;
    report(r);
  }

  async function runShot(name) {
    CF.shotName = name;
    for (let i = 0; i < 200 && !CF.ready; i++) await new Promise((res) => setTimeout(res, 50));
    CF.shotDone = false;
    try {
      if (typeof CF.shotScenarios === 'object' && CF.shotScenarios[name]) await CF.shotScenarios[name]();
    } catch (e) { CF.errors.push('shot:' + name + ' ' + e.message); }
    setTimeout(() => { CF.shotDone = true; }, 2500);
  }

  CF.shotScenarios = {};
  CF.shotScenarios['starter-world'] = async () => {
    CF.freeCam = true;
    const W = CF.world;
    W.ensureAround(0, 0, 4);
    for (let i = 0; i < 60 && W.stats().queue; i++) W.tick();
    for (let i = 0; i < 120 && !CF.rendererStats.ready; i++) { CF.renderTick(); await new Promise((r) => setTimeout(r, 50)); }
    for (let i = 0; i < 120; i++) CF.renderTick();
    // find a tree (log block) near spawn to frame it
    let tx = 0, tz = 0, found = false;
    for (let r = 2; r < 120 && !found; r += 4) for (let a = 0; a < 16 && !found; a++) {
      const x = Math.round(Math.cos(a * Math.PI / 8) * r), z = Math.round(Math.sin(a * Math.PI / 8) * r);
      W.ensureAround(x, z, 1);
      for (let i = 0; i < 8 && W.stats().queue; i++) W.tick();
      const h = W.heightAt(x, z);
      for (let y = h; y < h + 8; y++) if (W.get(x, y, z) === CF.IDOF['log']) { tx = x; tz = z; found = true; }
    }
    const th = W.heightAt(tx, tz);
    for (let i = 0; i < 30 && W.stats().queue; i++) CF.renderTick();
    CF.camera = { pos: [tx - 6, th + 7, tz - 6], yaw: Math.PI / 4, pitch: -0.15 };
    CF.renderDraw(CF.camera);
    await new Promise((r) => setTimeout(r, 300));
  };

  CF.shotScenarios['block'] = async () => {
    CF.freeCam = true;
    const name = (location.search.match(/block=([a-z0-9_]+)/) || [])[1] || 'stone';
    const W = CF.world;
    W.ensureAround(10, 10, 2);
    for (let i = 0; i < 20 && W.stats().queue; i++) W.tick();
    const reg = CF.REGISTRY[name];
    const key = Object.keys(reg.variants)[0];
    const id = reg.variants[key].id;
    const by = 70;
    for (let x = 7; x <= 13; x++) for (let z = 7; z <= 13; z++) for (let y = by - 2; y < by + 8; y++) W.set(x, y, z, 0);
    for (let x = 7; x <= 13; x++) for (let z = 7; z <= 13; z++) W.set(x, by, z, CF.IDOF['stone']);
    W.set(10, by + 1, 10, id);
    for (let i = 0; i < 100; i++) CF.renderTick();
    const camx = 13.4, camy = by + 2.6, camz = 13.4, tx = 10.5, ty = by + 1.5, tz = 10.5;
    const horiz = Math.hypot(camx - tx, camz - tz);
    CF.camera = { pos: [camx, camy, camz], yaw: Math.atan2(tx - camx, tz - camz), pitch: -Math.atan2(camy - ty, horiz) };
    CF.renderDraw(CF.camera);
    await new Promise((r) => setTimeout(r, 300));
  };
  const h = location.hash || '';
  if (h === '#test') runTests();
  else if (h.startsWith('#shot=')) runShot(h.slice(6));
})();

</script>
</body>
